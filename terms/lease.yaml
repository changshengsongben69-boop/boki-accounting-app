# 用語辞書 — リース
#
# 根拠: 企業会計基準第34号「リースに関する会計基準」（2024年9月13日公表）
#       https://www.asb-j.jp/jp/wp-content/uploads/sites/4/lease_20240913_02.pdf
#       企業会計基準適用指針第33号「リースに関する会計基準の適用指針」
#       企業会計基準第13号「リース取引に関する会計基準」（旧基準）
#       商工会議所簿記検定試験出題区分表 改定趣旨の説明書（2026年7月31日）
#
# 本アプリは2027年度以降の受験者向け。旧基準は学習対象としない。
# ただし旧用語（リース資産・リース債務）は reference_only: true として残す。
# 誤答の候補に置いてあるため、選んだ学習者に「なぜ誤りか」を説明する必要があるため。
# topics は新基準の論点に付けてある。誤りやすい場面で引けることが目的。

terms:
  - id: shiyouken-shisan
    headword: 使用権資産
    reading: しようけんしさん
    aliases: [right-of-use asset]
    basis: asbj-34
    valid_from: 2027
    topics: [BK-2-15-01]
    definition: |
      借手が、リース期間にわたり原資産を使用する権利を表す資産。
    body: |
      企業会計基準第34号において、借手はリースの定義を満たすものについて基本的に
      オンバランス化が求められ、その資産側を「使用権資産」として計上する。

      旧基準（企業会計基準第13号）における「リース資産」に相当するが、**同じもの
      の名称変更ではない**。旧基準ではファイナンス・リース取引に限って資産計上
      していたのに対し、新基準では借手側のファイナンス／オペレーティングの区分
      自体が廃止され、原則としてすべてのリースが対象になる。対象範囲が広がって
      いる点が本質的な差である。

      償却は、間接法による場合「使用権資産減価償却累計額」を用いる。
      借地権の設定に係る権利金等は、使用権資産の取得価額に含める（適用指針第27項）。
    related: [ri-su-fusai, ri-su-shisan, tanki-ri-su]

  - id: ri-su-fusai
    headword: リース負債
    reading: りーすふさい
    aliases: [lease liability]
    basis: asbj-34
    valid_from: 2027
    topics: [BK-2-15-01]
    definition: |
      借手が、リース料を支払う義務を表す負債。使用権資産に対応して計上される。
    body: |
      旧基準の「リース債務」に相当する。利子込み法ではリース料総額、
      利子抜き法ではリース料総額から利息相当額を控除した額で計上する。

      2級では利子込み法と利子抜き法の双方が出題され、利息相当額の各期間への
      配分は定額法に限られる。
    related: [shiyouken-shisan, ri-su-saimu, rishi-komi-hou, rishi-nuki-hou]

  - id: ri-su-shisan
    headword: リース資産
    reading: りーすしさん
    basis: asbj-13
    valid_until: 2026
    topics: [BK-2-15-01]
    definition: |
      旧基準において、借手がファイナンス・リース取引について計上した資産。
    body: |
      企業会計基準第13号では、ファイナンス・リース取引を通常の売買取引に係る
      方法に準じて処理し、借手はリース資産とリース債務を計上した。
      オペレーティング・リース取引は資産計上せず、賃貸借処理による。

      **2026年度までの用語であり、2027年度以降は誤り。** 標準・許容のいずれの
      勘定科目表にも存在しない。「使用権資産」に置き換わり、同時に対象範囲も広がる。

      本アプリは2027年度以降の受験者向けのため、この用語は**学習対象ではなく、
      誤答を選んだときの説明のために置いている参考項目**である。
    reference_only: true
    related: [shiyouken-shisan, ri-su-saimu]

  - id: ri-su-saimu
    headword: リース債務
    reading: りーすさいむ
    basis: asbj-13
    valid_until: 2026
    topics: [BK-2-15-01]
    definition: |
      旧基準において、借手がファイナンス・リース取引について計上した負債。
    body: |
      リース資産に対応する負債。**2027年度以降は「リース負債」に置き換わり、
      この用語は誤りとなる。** 学習対象ではなく、誤答の説明のための参考項目。
    reference_only: true
    related: [ri-su-shisan, ri-su-fusai]

  - id: tanki-ri-su
    headword: 短期リース
    reading: たんきりーす
    aliases: [short-term lease]
    basis: asbj-34
    valid_from: 2027
    topics: [BK-2-15-02]
    definition: |
      リース期間が12か月以内で、かつ購入オプションを含まないリース。
      オンバランスせず賃貸借処理を行うことが容認される。
    body: |
      適用指針第20項による免除規定。**期間の要件だけでなく、購入オプションを
      含まないことが併せて必要**である点に注意。

      少額リースとは別の免除規定であり、要件も異なる。混同しやすい。
    related: [shougaku-ri-su, shiyouken-shisan]

  - id: shougaku-ri-su
    headword: 少額リース
    reading: しょうがくりーす
    basis: asbj-34
    valid_from: 2027
    topics: [BK-2-15-02]
    definition: |
      企業の事業内容に照らして重要性の乏しいリースで、かつリース契約1件当たりの
      金額に重要性が乏しいもの。オンバランスせず賃貸借処理を行うことが容認される。
    body: |
      適用指針第22項による免除規定。短期リースが期間による免除であるのに対し、
      こちらは金額・重要性による免除である。
    related: [tanki-ri-su]

  - id: rishi-komi-hou
    headword: 利子込み法
    reading: りしこみほう
    topics: [BK-2-15-01]
    definition: |
      リース料総額をそのまま資産および負債の計上額とし、利息相当額を区分しない
      処理方法。
    body: |
      支払時も元本と利息を区分せず、負債をリース料の額だけ減額する。
      新基準・旧基準のいずれでも2級の出題範囲。
    related: [rishi-nuki-hou]

  - id: rishi-nuki-hou
    headword: 利子抜き法
    reading: りしぬきほう
    topics: [BK-2-15-01]
    definition: |
      リース料総額から利息相当額を控除した金額を資産および負債の計上額とし、
      利息相当額を各期間に配分する処理方法。
    body: |
      支払時に元本部分と利息部分を区分し、利息部分を支払利息として計上する。

      2級では利息相当額の各期間への配分は**定額法に限る**。利息法および級数法は
      1級の範囲である。この級の切り分けは新基準・旧基準を通じて変わらない。
    related: [rishi-komi-hou]

  - id: finance-lease
    headword: ファイナンス・リース
    reading: ふぁいなんすりーす
    aliases: [finance lease]
    topics: [BK-2-15-01, BK-2-15-03]
    definition: |
      解約不能かつフルペイアウトの要件を満たすリース。旧基準では借手・貸手の
      双方で区分に用いられたが、新基準では貸手側にのみ残る。
    body: |
      **新旧で位置づけが変わった用語であり、最も誤りやすい。**

      - 旧基準（第13号）: 借手・貸手の双方でオペレーティング・リースと区分し、
        借手はファイナンス・リースのみを資産計上した
      - 新基準（第34号）: **借手側の区分は廃止**され、リースの定義を満たすものは
        基本的にオンバランス。一方、**貸手側では区分が残されている**

      出題区分表でも「ウ．リースの貸手側の処理(ファイナンス・リース、
      オペレーティング・リース)」と括弧書きで明示され、注意喚起されている。
    related: [operating-lease, shiyouken-shisan]

  - id: operating-lease
    headword: オペレーティング・リース
    reading: おぺれーてぃんぐりーす
    aliases: [operating lease]
    topics: [BK-2-15-02, BK-2-15-03]
    definition: |
      ファイナンス・リースに該当しないリース。旧基準では借手が賃貸借処理を行った。
      新基準では借手側の区分が廃止され、貸手側にのみ残る。
    body: |
      旧基準における借手の処理は、通常の賃貸借取引に係る方法に準じ、支払リース料
      として費用計上する。

      新基準では借手側にこの区分は存在しない。ただし短期リース・少額リースに
      該当すれば賃貸借処理が容認されるため、**結果として賃貸借処理になる場合が
      あることと、区分が残っていることは別問題**である。
    related: [finance-lease, tanki-ri-su, shougaku-ri-su]

  - id: ri-su-toushi-shisan
    headword: リース投資資産
    reading: りーすとうしさん
    basis: asbj-34
    valid_from: 2027
    topics: [BK-2-15-03]
    definition: |
      貸手が所有権移転外ファイナンス・リースについて計上する資産。
    body: |
      企業会計基準第34号 第46項により、貸手はリース開始日に、通常の売買取引に係る
      方法に準じた会計処理を行い、**所有権移転ファイナンス・リースは「リース債権」、
      所有権移転外ファイナンス・リースは「リース投資資産」**として計上する。
      第13号からこの区分と用語は変わっていない。

      両者を分ける理由は投資の回収方法の違いにある（第34号 結論の背景）。
      所有権移転の場合はリース料と割安購入選択権の行使価額で回収するのに対し、
      所有権移転外の場合はリース料と見積残存価額の価値により回収を図る。
      そのためリース投資資産は、将来のリース料を収受する権利と見積残存価額から
      構成される複合的な資産となる。

      **どちらがどちらか取り違えやすい。** 所有権が移転する＝（単純な）債権、
      移転しない＝残存価額を含むので投資資産、と回収方法から考えると迷わない。

      表示は第52項により、リース債権とリース投資資産をそれぞれ区分表示するか、
      それぞれが含まれる科目と金額を注記する。ただしリース債権の期末残高の割合に
      重要性が乏しい場合は合算できる。

      なお第34号では借手側のファイナンス／オペレーティングの区分は廃止されたが、
      **貸手側にはこの区分が残っている**。借手と貸手で扱いが非対称である。
    related: [finance-lease, ri-su-saiken]

  - id: ri-su-saiken
    headword: リース債権
    reading: りーすさいけん
    basis: asbj-34
    valid_from: 2027
    topics: [BK-2-15-03]
    definition: |
      貸手が所有権移転ファイナンス・リースについて計上する資産。
    body: |
      企業会計基準第34号 第46項。所有権が移転するため、リース料と割安購入選択権の
      行使価額で投資を回収する。見積残存価額を含まないため、リース投資資産よりも
      単純な債権としての性格が強い。

      所有権が移転しない場合は「リース投資資産」を用いる。
    related: [ri-su-toushi-shisan, finance-lease]

  - id: shiharai-ri-su-ryou
    headword: 支払リース料
    reading: しはらいりーすりょう
    topics: [BK-2-15-02, BK-2-18]
    definition: |
      リースを賃貸借処理する場合に用いる費用勘定。
    body: |
      2027年度の改定により、**2級以上では不動産の賃借を賃貸借処理する場合も、
      支払家賃勘定・支払地代勘定ではなくこの勘定に統一される**。

      3級では引き続き支払家賃・支払地代を用いる。同一の取引でも級によって用いる
      勘定科目が異なるため、問題を解く際は自分の受験級を意識すること。

      2026年度までの2級では支払家賃を用いていたため、過去問との差にも注意。
    related: [tanki-ri-su, shougaku-ri-su]
