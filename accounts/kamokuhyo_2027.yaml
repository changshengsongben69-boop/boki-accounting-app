# 商業簿記標準・許容勘定科目表（２〜３級）
#
# 出典: https://www.kentei.ne.jp/wp/wp-content/uploads/2014/10/2027kamokuhyo_fixed.pdf
#       2016年2月1日制定 / 2025年12月25日改定 / 2026年7月31日最終改定
#       （2027年4月1日施行）
#
# 作成方法: PDFを画像に描画し、目視で書き起こした。
#   座標ベースの機械抽出は、この表が科目ごとの横罫線を持たず、
#   「使用権資産減価償却累計/額」のように1科目が2行に折り返される箇所を
#   別科目と区別できないため断念した。
#
# std = Ａ欄（標準的な勘定科目） / alt = Ｂ欄（採点上許容される勘定科目）
#
# 表の注意事項（原文）:
#   ・ここに示した勘定科目は仕訳目的の科目であって、財務諸表表示目的の科目は除外されている
#   ・問題文で勘定科目の指定がある場合は、その指示が優先される。常にこの表の科目が
#     認められるわけではない
#   ・Ａ欄が標準的な勘定科目、採点上許容される勘定科目をＢ欄に示す
#   ・**２級には、３級の標準・許容勘定科目がすべて含まれる**
#   ・すべての勘定科目の一覧表ではない（主要な科目のみ。製造業の科目は除く）
#   ・会社法・会社計算規則や各種会計基準の改正・改訂等により、一部の用語などが
#     変更される可能性がある
#
# 採点で使うときは、grade="2" の候補集合 = （3級の全科目）＋（2級の全科目）とすること。
# １級・全経上級・短答式には公式の勘定科目表が存在しない。別途定義が必要。

