    question: |
      決算の結果、当期純損失¥150,000となった。損益勘定から振り替える仕訳として正しいものはどれか。
    choices:
      - "（借）繰越利益剰余金 150,000 ／（貸）損益 150,000"
      - "（借）損益 150,000 ／（貸）繰越利益剰余金 150,000"
      - "（借）資本金 150,000 ／（貸）損益 150,000"
      - "損失の場合は振替を行わない"
    answer: 0
    explanation: |
      損失の場合、損益勘定は借方残高になっているので、これをゼロにするには貸方に損益を記入し、相手方の繰越利益剰余金を借方で減らす。利益のときと貸借がちょうど逆になる。損失であっても帳簿を締め切るために振替は必ず行い、その結果として繰越利益剰余金が減少（場合によっては借方残高）となる。

