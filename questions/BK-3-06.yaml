    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算の結果、当期純利益¥400,000を計上した。損益勘定から振り替える仕訳として正しいものはどれか。
    choices:
      - "（借）損益 400,000 ／（貸）資本金 400,000"
      - "（借）当期純利益 400,000 ／（貸）繰越利益剰余金 400,000"
      - "（借）損益 400,000 ／（貸）繰越利益剰余金 400,000"
      - "（借）繰越利益剰余金 400,000 ／（貸）損益 400,000"
    answer: 2
    explanation: |
      収益と費用を集めた損益勘定は、利益が出ていれば貸方残高になっている。これを純資産の勘定である繰越利益剰余金へ振り替えることで、損益勘定の残高がゼロになり帳簿が締め切られる。株式会社では利益を資本金に加えるのではなく繰越利益剰余金とする。当期純利益という勘定科目は用いない。

  - id: BK-3-06-002
