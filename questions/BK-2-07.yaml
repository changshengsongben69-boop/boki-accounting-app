# BK-2-07
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-2-07-01, BK-2-07-02, BK-2-07-04, BK-2-07-07
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-2-07-04

questions:
  - id: BK-2-07-001
    topic_id: BK-2-07-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      掛けで売り上げた商品のうち¥20,000が品違いのため返品された。正しい仕訳はどれか。
    choices:
      - "（借）売上 20,000 ／（貸）買掛金 20,000"
      - "（借）売上 20,000 ／（貸）売掛金 20,000"
      - "（借）仕入 20,000 ／（貸）売掛金 20,000"
      - "（借）売掛金 20,000 ／（貸）売上 20,000"
    answer: 1
    explanation: |
      売上戻り（返品）は売上取引そのものの取消なので、売上を借方に記入して減らし、あわせて代金請求権である売掛金を貸方で減らす。仕入を減らすのは当社が仕入先へ返品した側（仕入戻し）の処理。買掛金は仕入先に対する債務であり、得意先への返品とは無関係。

  - id: BK-2-07-002
    topic_id: BK-2-07-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      3分法を採用している。期首商品棚卸高¥50,000、期末商品棚卸高¥70,000であるときの決算整理仕訳として正しいものはどれか。
    choices:
      - "（借）繰越商品 50,000 ／（貸）仕入 50,000　および　（借）仕入 70,000 ／（貸）繰越商品 70,000"
      - "（借）売上原価 50,000 ／（貸）繰越商品 50,000　および　（借）繰越商品 70,000 ／（貸）売上原価 70,000"
      - "（借）繰越商品 20,000 ／（貸）仕入 20,000"
      - "（借）仕入 50,000 ／（貸）繰越商品 50,000　および　（借）繰越商品 70,000 ／（貸）仕入 70,000"
    answer: 3
    explanation: |
      3分法では、期首商品を繰越商品勘定から仕入勘定へ振り替え（借方 仕入）、期末商品を仕入勘定から繰越商品勘定へ振り替える（借方 繰越商品）。この結果、仕入勘定の残高が売上原価となり、繰越商品勘定の残高が期末商品有高となる。差額¥20,000だけを振り替えても、仕入勘定の残高は正しい売上原価にならない。売上原価勘定を用いるのは、売上原価を仕入勘定ではなく売上原価勘定で算定する方法を指示された場合である。

  - id: BK-2-07-003
    topic_id: BK-2-07-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    question: |
      期首商品棚卸高¥50,000、当期商品仕入高¥600,000、期末商品棚卸高¥70,000であった。当期の売上原価として正しいものはどれか。
    choices:
      - "¥720,000"
      - "¥580,000"
      - "¥620,000"
      - "¥600,000"
    answer: 1
    explanation: |
      売上原価＝期首商品棚卸高＋当期商品仕入高−期末商品棚卸高＝¥50,000＋¥600,000−¥70,000＝¥580,000。期末商品は売れ残りであって当期の費用にはならないため差し引く。¥620,000は期首と期末を逆に計算した場合の金額で、符号の取り違えが最も多い誤り。

  - id: BK-2-07-004
    topic_id: BK-2-07-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      販売のつど売上原価勘定に振り替える方法を採用している。商品¥100,000を掛けで仕入れたときの仕訳として正しいものはどれか。
    choices:
      - "（借）売上原価 100,000 ／（貸）買掛金 100,000"
      - "（借）繰越商品 100,000 ／（貸）買掛金 100,000"
      - "（借）商品 100,000 ／（貸）買掛金 100,000"
      - "（借）仕入 100,000 ／（貸）買掛金 100,000"
    answer: 2
    explanation: |
      この方法では、仕入れた時点ではまだ費用にせず、資産である商品勘定で受け入れる。仕入勘定や売上原価勘定を用いるのは誤りで、売上原価は販売した時点ではじめて計上される。繰越商品勘定は3分法で期末商品を繰り越すための科目。なおこの方法は2027年度から2級の範囲より3級に移行した論点である。

  - id: BK-2-07-005
    topic_id: BK-2-07-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      販売のつど売上原価勘定に振り替える方法を採用している。原価¥60,000の商品を¥90,000で掛け販売したときの仕訳として正しいものはどれか。
    choices:
      - "（借）売掛金 90,000 ／（貸）売上 90,000　および　（借）売上原価 60,000 ／（貸）商品 60,000"
      - "（借）売掛金 90,000 ／（貸）売上 90,000"
      - "（借）売掛金 90,000 ／（貸）商品 60,000・商品売買益 30,000"
      - "（借）売掛金 90,000 ／（貸）売上 60,000・売上原価 30,000"
    answer: 0
    explanation: |
      売価による売上の計上と、原価による売上原価への振替という2つの仕訳をセットで行うのがこの方法の特徴。売上は売価¥90,000、売上原価は原価¥60,000であり、差額が利益として自動的に把握される。売上だけを計上して原価の振替を忘れると、商品勘定に売れた分が残ったままになる。なお、貸方を商品と商品売買益に分ける処理は分記法であり、この方法とは異なる。

  - id: BK-2-07-006
    topic_id: BK-2-07-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      販売のつど売上原価勘定に振り替える方法について、正しい説明はどれか。
    choices:
      - "販売のつど原価が振り替えられるため、決算時に売上原価を算定するための決算整理は不要である"
      - "3分法と同じく、決算時に期首・期末商品を仕入勘定へ振り替える必要がある"
      - "期中は売上原価が把握できず、決算をまたないと利益が分からない"
      - "商品有高帳を作成することができない"
    answer: 0
    explanation: |
      この方法では販売のたびに商品勘定から売上原価勘定へ振り替えているので、期末時点で商品勘定の残高がそのまま期末商品有高を示し、売上原価勘定の残高が当期の売上原価を示す。したがって売上原価を算定するための決算整理は要らない。期中いつでも売上原価と利益が把握できることが、3分法に対するこの方法の利点である。

  - id: BK-2-07-007
    topic_id: BK-2-07-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      3分法により、商品¥200,000を掛けで仕入れ、引取運賃¥5,000を現金で支払った。この運賃は当社が負担する。正しい仕訳はどれか。
    choices:
      - "（借）仕入 200,000・立替金 5,000 ／（貸）買掛金 205,000"
      - "（借）仕入 200,000 ／（貸）買掛金 200,000"
      - "（借）仕入 205,000 ／（貸）買掛金 200,000・現金 5,000"
      - "（借）仕入 200,000・支払運賃 5,000 ／（貸）買掛金 200,000・現金 5,000"
    answer: 2
    explanation: |
      当社が負担する仕入諸掛は、商品を仕入れるために不可欠な支出なので仕入原価に含める。したがって仕入勘定は¥205,000となる。買掛金は仕入先に支払う商品代金の¥200,000のみで、運賃の支払先は運送業者なので現金で処理する。立替金は仕入先が負担すべき諸掛を当社が立て替えた場合に用いる科目。

  - id: BK-2-07-008
    topic_id: BK-2-07-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      商品¥150,000を掛けで販売し、発送費¥3,000を現金で支払った。この発送費は当社が負担する。正しい仕訳はどれか。
    choices:
      - "（借）売掛金 150,000・売上 3,000 ／（貸）売上 150,000・現金 3,000"
      - "（借）売掛金 150,000・発送費 3,000 ／（貸）売上 150,000・現金 3,000"
      - "（借）売掛金 153,000 ／（貸）売上 153,000"
      - "（借）売掛金 150,000 ／（貸）売上 147,000・現金 3,000"
    answer: 1
    explanation: |
      当社が負担する売上諸掛は、仕入諸掛のように売上に加減するのではなく、発送費という費用の勘定で処理する。売上はあくまで販売価格の¥150,000、得意先に請求する売掛金も¥150,000であり、発送費は当社の費用として別に計上される。仕入諸掛が仕入原価に含められるのと扱いが異なる点に注意する。

  - id: BK-2-07-009
    topic_id: BK-2-07-07
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    question: |
      移動平均法により商品有高帳を記入している。前月繰越が10個（原価@¥100）、当月に30個を@¥140で仕入れた。この仕入直後の平均単価として正しいものはどれか。
    choices:
      - "@¥120"
      - "@¥140"
      - "@¥110"
      - "@¥130"
    answer: 3
    explanation: |
      移動平均法では、仕入のつど残高と受入分を合算して平均単価を計算し直す。（10個×¥100＋30個×¥140）÷40個＝¥5,200÷40個＝@¥130。@¥120は単価どうしを単純平均した誤りで、数量による加重平均になっていない。先入先出法であれば平均せず、@¥100の10個と@¥140の30個を区別したまま管理する。
  - id: BK-2-07-010
    topic_id: BK-2-07-06
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      掛け取引の記録について正しいものはどれか。
    choices:
      - "掛け仕入を記録するのは仕入帳、掛け売上を記録するのは売上帳である"
      - "掛け仕入と掛け売上は両方とも現金出納帳に記録する"
      - "掛け仕入は売上帳に、掛け売上は仕入帳に記録する"
      - "仕入帳と売上帳は有形固定資産の取得を記録する帳簿である"
    answer: 0
    explanation: |
      仕入帳は掛け仕入を、売上帳は掛け売上を記録する補助簿である。現金出納帳は現金取引専用であり、固定資産の取得や掛け取引の両方を扱うわけではない。
