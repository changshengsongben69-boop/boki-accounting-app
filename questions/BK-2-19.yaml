# BK-2-19
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-2-19-01, BK-2-19-02, BK-2-19-03
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-2-19-01

questions:
  - id: BK-2-19-001
    topic_id: BK-2-19-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      建物および土地に対する固定資産税¥80,000を現金で納付した。正しい仕訳はどれか。
    choices:
      - "（借）建物 80,000 ／（貸）現金 80,000"
      - "（借）仮払法人税等 80,000 ／（貸）現金 80,000"
      - "（借）租税公課 80,000 ／（貸）現金 80,000"
      - "（借）法人税等 80,000 ／（貸）現金 80,000"
    answer: 2
    explanation: |
      固定資産税や自動車税、印紙税などは、利益の有無にかかわらず課される税金であり、費用として租税公課で処理する。法人税等は会社の所得（利益）に対して課される税金であり、性質が異なる。すでに取得している建物の取得原価に加算する処理も誤りで、保有期間中の税金は費用である。

  - id: BK-2-19-002
    topic_id: BK-2-19-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      収入印紙¥5,000と郵便切手¥1,200を購入し、現金で支払った。正しい仕訳はどれか。
    choices:
      - "（借）租税公課 5,000・通信費 1,200 ／（貸）現金 6,200"
      - "（借）貯蔵品 6,200 ／（貸）現金 6,200"
      - "（借）通信費 6,200 ／（貸）現金 6,200"
      - "（借）租税公課 6,200 ／（貸）現金 6,200"
    answer: 0
    explanation: |
      収入印紙は印紙税を納めるためのものなので租税公課、郵便切手は通信のためのものなので通信費で処理する。購入時にはいったん全額を費用として処理し、決算時に未使用分があれば貯蔵品へ振り替える。購入時から貯蔵品とする方法もあるが、3級では費用処理してから決算で振り替える流れが基本。

  - id: BK-2-19-003
    topic_id: BK-2-19-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      法人税等の中間申告を行い、¥120,000を普通預金から納付した。正しい仕訳はどれか。
    choices:
      - "（借）未払法人税等 120,000 ／（貸）普通預金 120,000"
      - "（借）仮払法人税等 120,000 ／（貸）普通預金 120,000"
      - "（借）法人税等 120,000 ／（貸）普通預金 120,000"
      - "（借）租税公課 120,000 ／（貸）普通預金 120,000"
    answer: 1
    explanation: |
      中間申告による納付は、確定した税額ではなく年間税額の前払いにあたるので、仮払法人税等という資産で処理する。確定した税額としての法人税等を計上するのは決算時。租税公課は固定資産税など所得に対する税金以外に用いる科目。未払法人税等は決算で確定額から中間納付額を差し引いた残りを計上する負債である。

  - id: BK-2-19-004
    topic_id: BK-2-19-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算の結果、当期の法人税・住民税・事業税の合計額が¥300,000と確定した。中間申告時に¥120,000を納付し仮払法人税等として処理している。正しい仕訳はどれか。
    choices:
      - "（借）法人税等 300,000・仮払法人税等 120,000 ／（貸）未払法人税等 420,000"
      - "（借）法人税等 300,000 ／（貸）仮払法人税等 120,000・未払法人税等 180,000"
      - "（借）法人税等 180,000 ／（貸）未払法人税等 180,000"
      - "（借）法人税等 300,000 ／（貸）未払法人税等 300,000"
    answer: 1
    explanation: |
      当期の負担額である¥300,000の全額を法人税等として費用計上する。すでに前払いしている仮払法人税等¥120,000を取り崩し、差額¥180,000を今後納付すべき負債として未払法人税等に計上する。法人税等を差額の¥180,000とすると、当期の税負担が過小に表示されてしまう。

  - id: BK-2-19-005
    topic_id: BK-2-19-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      税抜方式を採用している。商品¥200,000（税抜）を仕入れ、消費税10%とあわせて掛けとした。正しい仕訳はどれか。
    choices:
      - "（借）仕入 220,000 ／（貸）買掛金 220,000"
      - "（借）仕入 200,000・租税公課 20,000 ／（貸）買掛金 220,000"
      - "（借）仕入 200,000・仮受消費税 20,000 ／（貸）買掛金 220,000"
      - "（借）仕入 200,000・仮払消費税 20,000 ／（貸）買掛金 220,000"
    answer: 3
    explanation: |
      税抜方式では消費税を仕入原価に含めず、仮払消費税という資産の勘定で区分して処理する。仕入先へ支払う債務は税込みの¥220,000。消費税を仕入に含めるのは税込方式であり、税抜方式では誤り。支払った側なので仮払であり、仮受消費税は売上時に使う科目。

  - id: BK-2-19-006
    topic_id: BK-2-19-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      税抜方式を採用している。商品¥300,000（税抜）を売り上げ、消費税10%とあわせて掛けとした。正しい仕訳はどれか。
    choices:
      - "（借）売掛金 330,000 ／（貸）売上 300,000・仮受消費税 30,000"
      - "（借）売掛金 330,000 ／（貸）売上 330,000"
      - "（借）売掛金 330,000 ／（貸）売上 300,000・仮払消費税 30,000"
      - "（借）売掛金 300,000 ／（貸）売上 300,000"
    answer: 0
    explanation: |
      税抜方式では売上に消費税を含めず、預かった消費税を仮受消費税という負債で処理する。得意先に請求する債権は税込みの¥330,000。消費税は最終的に国へ納付するものであって会社の収益ではないため、売上を¥330,000とするのは誤り。受け取った側なので仮受であり、仮払消費税は仕入時に使う科目。

  - id: BK-2-19-007
    topic_id: BK-2-19-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり、仮受消費税¥30,000と仮払消費税¥20,000を相殺し、納付額を確定する。正しい仕訳はどれか。
    choices:
      - "（借）仮受消費税 30,000 ／（貸）租税公課 30,000"
      - "（借）未払消費税 10,000 ／（貸）現金 10,000"
      - "（借）仮受消費税 30,000 ／（貸）仮払消費税 20,000・未払消費税 10,000"
      - "（借）仮払消費税 20,000・未払消費税 10,000 ／（貸）仮受消費税 30,000"
    answer: 2
    explanation: |
      預かった消費税から支払った消費税を差し引いた残額が国へ納付すべき金額になる。負債である仮受消費税を借方で消し、資産である仮払消費税を貸方で消して、差額¥10,000を未払消費税という負債として計上する。仮払消費税が仮受消費税を上回る場合は、還付を受ける権利として未収還付消費税などの資産が生じる。税抜方式では消費税が損益に影響しない点も押さえておく。

  - id: BK-2-19-008
    topic_id: BK-2-19-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      未払消費税¥10,000を現金で納付した。正しい仕訳はどれか。
    choices:
      - "（借）未払消費税 10,000 ／（貸）普通預金 10,000"
      - "（借）仮払消費税 10,000 ／（貸）普通預金 10,000"
      - "（借）租税公課 10,000 ／（貸）普通預金 10,000"
      - "（借）普通預金 10,000 ／（貸）未払消費税 10,000"
    answer: 0
    explanation: |
      納付によって負債である未払消費税が消滅するので、借方に未払消費税を記入し、貸方は普通預金を減らす。仮払消費税や租税公課ではなく、決算時に確定した消費税額に対する負債勘定を使うことが重要である。
