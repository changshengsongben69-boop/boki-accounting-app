# BK-1-03
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-1-03-01, BK-1-03-02, BK-1-03-03, BK-1-03-04
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-1-03-02

questions:
  - id: BK-1-03-001
    topic_id: BK-1-03-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      勘定記入の法則についての説明として正しいものはどれか。
    choices:
      - "収益の勘定は発生額を貸方に、費用の勘定は発生額を借方に記入する"
      - "収益の勘定は発生額を借方に、費用の勘定は発生額を貸方に記入する"
      - "収益も費用も発生額は借方に記入する"
      - "収益も費用も発生額は貸方に記入する"
    answer: 0
    explanation: |
      収益は純資産を増加させる原因なので、純資産と同じ貸方に発生額を記入する。費用は純資産を減少させる原因なので借方に記入する。資産は借方に増加・貸方に減少、負債と純資産は貸方に増加・借方に減少と記入する法則とあわせて、5要素の位置関係で覚えるとよい。

  - id: BK-1-03-002
    topic_id: BK-1-03-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      貸借平均の原理についての説明として正しいものはどれか。
    choices:
      - "すべての取引は借方と貸方に同額ずつ記入されるため、総勘定元帳の借方合計と貸方合計は必ず一致する"
      - "資産の合計と負債の合計は必ず一致する"
      - "収益の合計と費用の合計は必ず一致する"
      - "各勘定の残高は必ずゼロになる"
    answer: 0
    explanation: |
      複式簿記ではひとつの取引を必ず借方と貸方に同額で記録するため、すべての記入を集計すれば借方合計と貸方合計は一致する。これが貸借平均の原理であり、試算表による検算の根拠になっている。資産と負債は一致しないし（差額が純資産）、収益と費用も一致しない（差額が当期純損益）。

  - id: BK-1-03-003
    topic_id: BK-1-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      通常、勘定の残高が貸方に生じるものの組合せとして正しいものはどれか。
    choices:
      - "資産・負債・純資産"
      - "費用・収益のみ"
      - "負債・純資産・収益"
      - "資産・費用・収益"
    answer: 2
    explanation: |
      負債と純資産は貸方に増加を記入するので貸方残高、収益も貸方に発生額を記入するので貸方残高となる。これに対し資産と費用は借方に記入するので借方残高。残高がどちら側に立つかを覚えておくと、試算表や精算表で金額を記入する欄を間違えにくくなる。

  - id: BK-1-03-004
    topic_id: BK-1-03-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      仕訳の意義についての説明として正しいものはどれか。
    choices:
      - "取引の内容を文章で記録することをいう"
      - "取引を借方の要素と貸方の要素に分解し、勘定科目と金額で記録することをいう"
      - "総勘定元帳の各勘定の残高を集計することをいう"
      - "決算にあたり帳簿を締め切ることをいう"
    answer: 1
    explanation: |
      仕訳とは、取引をどの勘定科目のどちら側にいくら記入するかを決める作業であり、複式簿記の出発点である。仕訳帳に記入した後、総勘定元帳の各勘定へ転記する。残高の集計は試算表の作成、帳簿の締切は決算手続の一部であり、いずれも仕訳そのものではない。

  - id: BK-1-03-005
    topic_id: BK-1-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      通常、勘定の残高が貸方に生じるものの組合せとして正しいものはどれか。
    choices:
      - "資産・負債・純資産"
      - "費用・収益のみ"
      - "負債・純資産・収益"
      - "資産・費用・収益"
    answer: 2
    explanation: |
      負債と純資産は貸方に増加を記入するので貸方残高、収益も貸方に発生を記入するので貸方残高となる。資産と費用は借方に増加を記入するため借方残高となる。勘定の残高の方向を理解することが試算表や決算整理の基礎になる。

  - id: BK-1-03-006
    topic_id: BK-1-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      負債の勘定が増加するとき、どちら側に記入されるか。
    choices:
      - "借方"
      - "貸方"
      - "どちらでもよい"
      - "増加したときは記入しない"
    answer: 1
    explanation: |
      負債は貸方に増加を記入する。資産と費用は借方に増加し、負債と純資産と収益は貸方に増加するという5要素の仕訳のルールで覚える。増加したときに借方へ記入するのは資産と費用だけである。

  - id: BK-1-03-007
    topic_id: BK-1-03-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      商品を掛けで販売したときの売掛金の処理として正しいものはどれか。
    choices:
      - "借方に売掛金を記入する"
      - "貸方に売掛金を記入する"
      - "売掛金は仕訳に記入しない"
      - "売掛金は費用として計上する"
    answer: 0
    explanation: |
      掛け販売では代金を後で受け取る債権である売掛金が増えるため、資産の増加として借方に記入する。売上は貸方に記入される。売掛金を貸方に記入すると債務が増えたことになってしまう。

  - id: BK-1-03-008
    topic_id: BK-1-03-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      貸借平均の原理を用いて試算表を検算するとき、確認するべきものはどれか。
    choices:
      - "借方合計と貸方合計が一致していること"
      - "資産と負債が一致していること"
      - "収益と費用が一致していること"
      - "各勘定の残高がすべてゼロであること"
    answer: 0
    explanation: |
      貸借平均の原理では、仕訳の借方と貸方が同額になるため、試算表の借方合計と貸方合計が一致するか確認する。資産と負債が一致するのは貸借対照表の考え方、収益と費用が一致するのは損益計算書の考え方ではない。

