# BK-1-02
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-1-02-01, BK-1-02-02
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-1-02-01

questions:
  - id: BK-1-02-001
    topic_id: BK-1-02-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      得意先から商品¥100,000を掛けで販売してほしいという注文書を受け取った。商品はまだ引き渡していない。この時点で行う仕訳として正しいものはどれか。
    choices:
      - "（借）契約資産 100,000 ／（貸）売上 100,000"
      - "仕訳は不要である"
      - "（借）売掛金 100,000 ／（貸）売上 100,000"
      - "（借）売掛金 100,000 ／（貸）前受金 100,000"
    answer: 1
    explanation: |
      簿記上の取引とは、資産・負債・資本（純資産）・収益・費用のいずれかに増減をもたらす事象をいう。注文を受けただけでは商品も代金も動いておらず、何の増減も生じないので仕訳は行わない。売掛金と売上を計上するのは商品を引き渡した時点。代金を受け取っていない以上、前受金も生じない。なお契約資産は2級以上の範囲である。

  - id: BK-1-02-002
    topic_id: BK-1-02-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      次のうち、簿記上の取引に該当しないものはどれか。
    choices:
      - "火災により倉庫が焼失した"
      - "現金が盗難にあった"
      - "商品を掛けで販売した"
      - "新しい従業員を雇用する契約を結んだ"
    answer: 3
    explanation: |
      簿記上の取引とは、資産・負債・純資産・収益・費用に増減をもたらす事象をいう。雇用契約を結んだだけでは何も増減しないので取引ではない（給料を支払った時点で取引となる）。一方、火災による焼失や盗難は日常語では「取引」といわないが、資産が減少するので簿記上は立派な取引である。日常用語と簿記用語のずれが問われる典型論点。

  - id: BK-1-02-003
    topic_id: BK-1-02-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      「商品¥100,000を掛けで仕入れた」という取引の8要素の結合関係として正しいものはどれか。
    choices:
      - "資産の増加と収益の発生"
      - "費用の発生と負債の増加"
      - "資産の増加と負債の増加"
      - "費用の発生と資産の減少"
    answer: 1
    explanation: |
      3分法では仕入れた時点で費用である仕入が発生し（借方）、代金は後払いなので買掛金という負債が増加する（貸方）。借方要素は「資産の増加・負債の減少・純資産の減少・費用の発生」、貸方要素は「資産の減少・負債の増加・純資産の増加・収益の発生」であり、必ず借方要素と貸方要素が組み合わさる。

  - id: BK-1-02-004
    topic_id: BK-1-02-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      「借入金¥200,000を現金で返済した」という取引の8要素の結合関係として正しいものはどれか。
    choices:
      - "費用の発生と資産の減少"
      - "資産の減少と収益の発生"
      - "負債の減少と資産の減少"
      - "負債の増加と資産の増加"
    answer: 2
    explanation: |
      返済により借入金という負債が減り（借方）、支払により現金という資産が減る（貸方）。負債の減少は借方要素、資産の減少は貸方要素なので、借方と貸方が正しく組み合わさっている。なお利息を支払った場合は、あわせて費用の発生（借方）が加わる。

  - id: BK-1-02-005
    topic_id: BK-1-02-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      次のうち、仕訳の借方に記入されるものはどれか。
    choices:
      - "買掛金の減少"
      - "現金の増加"
      - "売掛金の増加"
      - "費用の減少"
    answer: 2
    explanation: |
      仕訳の借方は資産の増加、負債の減少、純資産の減少、費用の発生などを記録する。現金が入金されると資産が増加するため借方に記入される。買掛金の減少や費用の減少は借方要素ではなく、売掛金の増加は資産の増加であるが、問題文で求められた「借方に記入されるもの」としてもっとも基本的なのは現金の増加である。

  - id: BK-1-02-006
    topic_id: BK-1-02-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      取引の8要素において、売上を計上する場合に貸方に該当するものはどれか。
    choices:
      - "資産の増加"
      - "負債の減少"
      - "純資産の増加"
      - "費用の発生"
    answer: 2
    explanation: |
      売上は収益であり、収益は純資産を増加させるため貸方に記入される。問題文の選択肢では「純資産の増加」が貸方要素にあたる。資産の増加は借方、負債の減少も借方要素、費用の発生は借方要素である。

  - id: BK-1-02-007
    topic_id: BK-1-02-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      次のうち、簿記上の取引に該当するものはどれか。
    choices:
      - "得意先に商品を掛けで販売した"
      - "新しい取引先と契約書を交わした"
      - "見積書を発行した"
      - "商品の価格交渉を行った"
    answer: 0
    explanation: |
      簿記上の取引とは、資産・負債・純資産・収益・費用のいずれかに変動を生じさせる事象をいう。商品の掛け販売は売掛金と売上を計上するため取引に該当する。契約書の締結や見積書の発行、交渉は取引の準備段階であり、資産・負債・純資産・収益・費用のいずれも変動しない。

  - id: BK-1-02-008
    topic_id: BK-1-02-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      「支払利息を現金で支払った」という取引の8要素の組合せとして正しいものはどれか。
    choices:
      - "費用の発生と資産の減少"
      - "費用の発生と負債の減少"
      - "資産の増加と負債の減少"
      - "純資産の増加と資産の減少"
    answer: 0
    explanation: |
      支払利息は費用の発生であり、現金の支払いは資産の減少である。負債の減少や純資産の増加とはならない。借方は費用の発生、貸方は資産の減少という組合せになる。
