# BK-2-04
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-2-04-01, BK-2-04-02, BK-2-04-03, BK-2-04-05, BK-2-04-06, BK-2-04-07, BK-2-04-08
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-2-04-02

questions:
  - id: BK-2-04-001
    topic_id: BK-2-04-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      不要になった備品を帳簿価額¥50,000で売却し、代金は翌月末に受け取ることにした。借方科目として正しいものはどれか。
    choices:
      - "未収入金"
      - "売掛金"
      - "前払金"
      - "売上"
    answer: 0
    explanation: |
      売掛金は「商品売買という主たる営業取引」から生じた債権に限られる。備品の売却は営業外の取引なので、代金の未回収額は未収入金で処理する。売却額を売上とするのも誤りで、商品以外の売却は固定資産売却損益で損益を把握する。

  - id: BK-2-04-002
    topic_id: BK-2-04-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      得意先から商品¥200,000の注文を受け、手付金として¥40,000を現金で受け取った。正しい仕訳はどれか。
    choices:
      - "（借）現金 40,000 ／（貸）売上 40,000"
      - "（借）現金 40,000 ／（貸）売掛金 40,000"
      - "（借）前払金 40,000 ／（貸）現金 40,000"
      - "（借）現金 40,000 ／（貸）前受金 40,000"
    answer: 3
    explanation: |
      商品を引き渡す前に受け取った手付金は、後日商品を引き渡す義務を表す負債であり前受金で処理する。まだ引渡しがないので売上は計上できない。売掛金を減らす処理も誤りで、この時点では売掛金そのものが発生していない。前払金は当社が手付金を支払った側の科目。

  - id: BK-2-04-003
    topic_id: BK-2-04-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      No.003の商品¥200,000を引き渡し、さきに受け取った手付金¥40,000を差し引いた残額は掛けとした。正しい仕訳はどれか。
    choices:
      - "（借）前受金 40,000・現金 160,000 ／（貸）売上 200,000"
      - "（借）前受金 40,000・売掛金 160,000 ／（貸）売上 200,000"
      - "（借）売掛金 200,000 ／（貸）売上 200,000"
      - "（借）売掛金 160,000 ／（貸）売上 160,000"
    answer: 1
    explanation: |
      売上は手付金を含めた総額¥200,000で計上する。引渡しにより義務が消滅するので前受金¥40,000を借方に振り替え、残額¥160,000が新たな売掛金となる。売上を¥160,000とするのは、手付金分の収益が計上されないため誤り。代金を受け取っていないので現金も増えない。

  - id: BK-2-04-004
    topic_id: BK-2-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      取引先に貸し付けていた¥600,000の返済を受け、利息¥9,000とともに普通預金口座に入金された。正しい仕訳はどれか。
    choices:
      - "（借）普通預金 609,000 ／（貸）貸付金 609,000"
      - "（借）普通預金 600,000・支払利息 9,000 ／（貸）貸付金 609,000"
      - "（借）普通預金 609,000 ／（貸）借入金 600,000・受取利息 9,000"
      - "（借）普通預金 609,000 ／（貸）貸付金 600,000・受取利息 9,000"
    answer: 3
    explanation: |
      貸し付けていた元本¥600,000が回収されて債権が消滅し、あわせて利息¥9,000を収益として受け取っている。入金額はその合計の¥609,000。利息を貸付金に含めてしまうと収益が計上されない。当社は貸した側なので受取利息であり、支払利息や借入金を使うのは貸借が逆。

  - id: BK-2-04-005
    topic_id: BK-2-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    question: |
      ¥600,000を年利率3%、貸付期間4か月の条件で貸し付けた。受け取る利息の金額として正しいものはどれか。
    choices:
      - "¥72,000"
      - "¥6,000"
      - "¥18,000"
      - "¥2,000"
    answer: 1
    explanation: |
      利率は特に断りがなければ年利率なので、期間に応じて月割計算する。¥600,000×3%×4か月/12か月＝¥6,000。¥18,000は1年分をそのまま計算した誤り、¥72,000は月利と誤解した場合の金額。日数や月数の按分を忘れないこと。

  - id: BK-2-04-006
    topic_id: BK-2-04-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      文房具店を営む当社が、事務用のパソコン¥180,000を購入し、代金は翌月末に支払うこととした。貸方科目として正しいものはどれか。
    choices:
      - "前払金"
      - "預り金"
      - "未払金"
      - "買掛金"
    answer: 2
    explanation: |
      買掛金は販売するための商品を仕入れたときの債務に限られる。当社の商品は文房具であり、自社で使うパソコンは商品ではないので、代金の未払額は未払金で処理する。同じ「後払い」でも、主たる営業取引かどうかで科目が変わる点が問われる。前払金は代金を先に支払ったときの債権。

  - id: BK-2-04-007
    topic_id: BK-2-04-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      仕入先に商品¥250,000を注文し、内金として¥30,000を現金で支払った。正しい仕訳はどれか。
    choices:
      - "（借）前払金 30,000 ／（貸）現金 30,000"
      - "（借）仕入 30,000 ／（貸）現金 30,000"
      - "（借）買掛金 30,000 ／（貸）現金 30,000"
      - "（借）前受金 30,000 ／（貸）現金 30,000"
    answer: 0
    explanation: |
      内金の支払は、後日商品を受け取る権利を得たということなので資産である前払金で処理する。商品はまだ届いていないので仕入を計上してはならない。買掛金は仕入が計上された後に生じる債務であり、この時点では存在しない。前受金は代金を受け取った側が使う負債の科目。

  - id: BK-2-04-008
    topic_id: BK-2-04-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      従業員への給料¥300,000のうち、源泉所得税¥12,000と社会保険料の従業員負担分¥15,000を差し引き、残額を普通預金から支払った。正しい仕訳はどれか。
    choices:
      - "（借）給料 300,000 ／（貸）所得税預り金 12,000・社会保険料預り金 15,000・普通預金 273,000"
      - "（借）給料 273,000 ／（貸）普通預金 273,000"
      - "（借）給料 300,000 ／（貸）立替金 27,000・普通預金 273,000"
      - "（借）給料 300,000・法定福利費 15,000 ／（貸）普通預金 315,000"
    answer: 0
    explanation: |
      会社が負担する費用は差引前の給料総額¥300,000であり、これを借方に計上する。差し引いた源泉所得税と社会保険料の従業員負担分は、会社が本人に代わって後日納付する義務なので預り金（負債）となる。手取額¥273,000だけを給料とすると費用が過小になる。立替金は会社が従業員の分を立て替えて支払った場合の科目で、給料から差し引いた場合には該当しない。会社負担分の社会保険料は納付時に法定福利費として処理する。

  - id: BK-2-04-009
    topic_id: BK-2-04-06
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      従業員の出張にあたり旅費の概算額¥50,000を現金で渡していた。従業員が帰社し、旅費として¥46,000を使用した旨の報告と残額の返金を受けた。正しい仕訳はどれか。
    choices:
      - "（借）旅費交通費 50,000 ／（貸）仮払金 46,000・現金 4,000"
      - "（借）旅費交通費 46,000・仮払金 4,000 ／（貸）現金 50,000"
      - "（借）旅費交通費 46,000・現金 4,000 ／（貸）仮払金 50,000"
      - "（借）旅費交通費 46,000 ／（貸）仮払金 46,000"
    answer: 2
    explanation: |
      概算払の時点では金額も内容も未確定なので仮払金（資産）としておき、精算時に確定した費用へ振り替える。仮払金は全額¥50,000を取り崩して残高をゼロにし、実際に使った¥46,000を旅費交通費、返金された¥4,000を現金の増加とする。仮払金を¥46,000しか取り崩さないと、返金済みの¥4,000が資産として残ってしまう。

  - id: BK-2-04-010
    topic_id: BK-2-04-06
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      出張中の従業員から当社の普通預金口座に¥80,000の入金があったが、その内容は不明である。正しい仕訳はどれか。
    choices:
      - "内容が判明するまで仕訳は行わない"
      - "（借）普通預金 80,000 ／（貸）仮受金 80,000"
      - "（借）普通預金 80,000 ／（貸）売掛金 80,000"
      - "（借）普通預金 80,000 ／（貸）前受金 80,000"
    answer: 1
    explanation: |
      入金という事実は生じている以上、普通預金の増加は記録しなければならない。相手科目が確定できないので、一時的な負債の科目である仮受金で受けておき、内容が判明した時点で売掛金の回収や前受金などの適切な科目へ振り替える。判明を待って仕訳しないと、預金の帳簿残高が実際と合わなくなる。

  - id: BK-2-04-011
    topic_id: BK-2-04-07
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      商品¥20,000を販売し、代金として他店が発行した商品券¥20,000を受け取った。正しい仕訳はどれか。
    choices:
      - "（借）現金 20,000 ／（貸）売上 20,000"
      - "（借）売掛金 20,000 ／（貸）売上 20,000"
      - "（借）売上 20,000 ／（貸）受取商品券 20,000"
      - "（借）受取商品券 20,000 ／（貸）売上 20,000"
    answer: 3
    explanation: |
      他店が発行した商品券は、後日その発行元に対して代金を請求できる権利なので、受取商品券という資産の勘定で処理する。現金そのものを受け取ったわけではないので現金ではなく、また相手は得意先ではなく商品券の発行元なので売掛金とするのも適切でない。後日精算を受けたときに受取商品券を貸方で減らす。

  - id: BK-2-04-012
    topic_id: BK-2-04-08
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      事務所を賃借するにあたり、敷金¥200,000と1か月分の家賃¥100,000を普通預金から支払った。敷金は退去時に返還される契約である。正しい仕訳はどれか。
    choices:
      - "（借）前払家賃 200,000・支払家賃 100,000 ／（貸）普通預金 300,000"
      - "（借）差入保証金 300,000 ／（貸）普通預金 300,000"
      - "（借）差入保証金 200,000・支払家賃 100,000 ／（貸）普通預金 300,000"
      - "（借）支払家賃 300,000 ／（貸）普通預金 300,000"
    answer: 2
    explanation: |
      退去時に返還される敷金は、返してもらう権利を表す資産なので差入保証金で処理し、費用にはしない。当月分の家賃は当期の費用なので支払家賃。全額を費用にすると資産が計上されず、逆に全額を差入保証金にすると当期の費用が計上されない。前払家賃は将来の家賃を先に支払った場合の科目であり、返還される敷金とは性質が異なる。

