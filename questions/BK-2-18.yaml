# 収益と費用 — 不動産の賃借に用いる勘定科目
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
#       および改定趣旨の説明書「18.収益と費用」
#
# 2027年度改定により、不動産の賃借は本来リースの範疇に含まれるという整理がなされた。
#   3級      … 短期・少額リースに該当するものとして、従来どおり支払家賃・支払地代
#   2級以上  … 賃貸借処理する場合も「支払リース料」勘定に統一
# この差は勘定科目の正誤に直結するため、grades と valid_from/until を必ず設定する。

topic_default: BK-2-18

questions:
  - id: BK-2-18-001
    basis: rent-legacy
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      店舗の建替工事期間中に賃借した仮店舗の半年分の家賃600,000円を
      普通預金から振り込んで支払った。借方に用いる勘定科目として
      正しいものはどれか。
    choices:
      - 支払リース料
      - 支払家賃
      - 使用権資産
      - 前払費用
    answer: 1
    explanation: |
      正解は「支払家賃」。

      2027年度の出題区分表の改定により、不動産の賃貸借取引は本来リースの範疇に
      含まれるという整理がなされた。ただし3級では比較的小規模の株式会社を想定して
      おり、事務所や店舗の賃借は多くの場合、短期リースまたは少額リースに該当する
      ものと考えられる。そのため3級では引き続き従来どおりの賃貸借処理を行い、
      支払家賃勘定を用いる。

      「支払リース料」は2級以上で用いる勘定科目であり、3級では誤り。同じ取引でも
      級によって用いる勘定科目が異なる点に注意すること。
      「使用権資産」は借手がリースをオンバランスする場合の資産勘定であり、
      3級ではオンバランス処理を求めていない。
      「前払費用」は費用の前払いを繰り延べる場合の勘定であり、支払時の借方科目
      ではない。

  - id: BK-2-18-002
    basis: asbj-34
    exams: [nissho]
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 2
    question: |
      事務所として賃借している建物の当月分の賃借料を現金で支払った。
      当該賃借は短期リースに該当し、賃貸借処理による。借方に用いる勘定科目として
      正しいものはどれか。
    choices:
      - 支払家賃
      - 支払地代
      - 支払リース料
      - リース債務
    answer: 2
    explanation: |
      正解は「支払リース料」。

      2級以上においては、不動産の賃借の取引はリースに該当する以上、賃貸借処理を
      する場合であっても支払家賃勘定や支払地代勘定を用いず、支払リース料勘定に
      統一される。2027年度の出題区分表の改定で明示された取扱いである。

      「支払家賃」は3級では正解になるが、2級以上では誤り。2026年度までの2級では
      支払家賃が正解であったため、過去問を解く際は年度に注意すること。
      「支払地代」は土地の賃借に対応する旧来の勘定であり、同様に2級以上では
      用いない。
      「リース債務」は旧基準における負債勘定であり、賃貸借処理では計上しない。

  - id: BK-2-18-003
    topic_id: BK-2-18
    basis: rent-legacy
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      今月分の駐車場代金¥40,000を現金で支払った。3級における正しい仕訳はどれか。
    choices:
      - "（借）租税公課 40,000 ／（貸）現金 40,000"
      - "（借）支払地代 40,000 ／（貸）現金 40,000"
      - "（借）支払家賃 40,000 ／（貸）現金 40,000"
      - "（借）支払リース料 40,000 ／（貸）現金 40,000"
    answer: 1
    explanation: |
      土地を借りたことによる対価は支払地代で処理する。建物を借りた場合の支払家賃と区別すること。駐車場は土地の賃借なので支払地代が正しい。3級ではリースが範囲外であるため支払リース料は用いない。租税公課は固定資産税など税金を支払ったときの科目。

  - id: BK-2-18-004
    topic_id: BK-2-18
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      社会保険料¥30,000を普通預金から納付した。うち¥15,000は従業員の給料から差し引いて預かっていた分、残り¥15,000は会社負担分である。正しい仕訳はどれか。
    choices:
      - "（借）社会保険料預り金 30,000 ／（貸）普通預金 30,000"
      - "（借）給料 30,000 ／（貸）普通預金 30,000"
      - "（借）社会保険料預り金 15,000・法定福利費 15,000 ／（貸）普通預金 30,000"
      - "（借）法定福利費 30,000 ／（貸）普通預金 30,000"
    answer: 2
    explanation: |
      従業員から預かっていた分は納付によって預り金という負債が消滅するので借方に記入する。会社が負担する分は当期の費用であり、法定福利費で処理する。全額を法定福利費とすると、従業員負担分まで会社の費用にしてしまい費用が過大になる。全額を預り金とすると、預かっていない会社負担分まで負債を減らすことになる。

  - id: BK-2-18-005
    topic_id: BK-2-18
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      建物の賃貸料¥240,000を6ヶ月分前払いして普通預金で支払った。借方に用いる勘定科目として正しいものはどれか。
    choices:
      - "支払家賃"
      - "前払費用"
      - "支払地代"
      - "支払リース料"
    answer: 1
    explanation: |
      賃貸料を前払いした場合、支払家賃として費用計上せず、資産勘定の前払費用で処理する。支払家賃や支払地代は支払時に費用計上する場合の科目であり、前払費用は翌期以降に費用化するまで資産として扱う。支払リース料は3級では使わない。

  - id: BK-2-18-006
    topic_id: BK-2-18
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      事務所の賃貸借契約に基づいて当月分の家賃を現金で支払った。3級で正しい借方科目はどれか。
    choices:
      - "支払家賃"
      - "支払リース料"
      - "支払地代"
      - "前払費用"
    answer: 0
    explanation: |
      3級では不動産の賃借料は従来どおり支払家賃または支払地代で処理する。事務所は建物の賃借なので支払家賃を用いる。支払リース料は2級以上で用いる勘定科目であり、3級では誤り。前払費用は費用の前払いに限り使用する。

  - id: BK-2-18-007
    topic_id: BK-2-18
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      賃貸借契約により店舗の家賃を普通預金で支払った。次のうち、3級で誤った勘定科目はどれか。
    choices:
      - "支払家賃"
      - "支払地代"
      - "支払リース料"
      - "前払費用"
    answer: 2
    explanation: |
      3級では不動産賃貸借取引の賃料を支払リース料で処理しない。支払リース料は2級以上の新リース基準を反映した勘定であり、3級では支払家賃や支払地代を使う。前払費用は賃料を前払いした場合に使用するが、前払いでない通常の支払では使わない。

  - id: BK-2-18-008
    topic_id: BK-2-18
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      土地の賃借料を現金で支払った。3級の正しい仕訳として借方に用いるべき勘定科目はどれか。
    choices:
      - "支払家賃"
      - "支払地代"
      - "支払リース料"
      - "租税公課"
    answer: 1
    explanation: |
      土地の賃借料は支払地代で処理する。建物の賃借料なら支払家賃となる。支払リース料は3級では使わない勘定であり、租税公課は税金の支払いに用いる科目である。
  - id: BK-2-18-009
    topic_id: BK-2-18
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      建物の賃貸料を3年分前払いし、前払費用を計上した。1年経過したときの仕訳として正しいものはどれか。
    choices:
      - "（借）支払家賃 1年分 ／（貸）前払費用 1年分"
      - "（借）前払費用 1年分 ／（貸）支払家賃 1年分"
      - "（借）支払家賃 3年分 ／（貸）前払費用 3年分"
      - "前払費用はそのまま資産のままで仕訳は不要"
    answer: 0
    explanation: |
      前払費用は費用を先に支払って資産として処理し、期間経過に応じて費用化する。1年分の使用分を支払家賃に振り替えるので、支払家賃を借方、前払費用を貸方とする。前払費用をそのままにしておくと費用の漏れになる。
