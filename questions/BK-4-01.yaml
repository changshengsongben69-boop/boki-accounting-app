# BK-4-01
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-4-01-01, BK-4-01-02
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-4-01-01

questions:
  - id: BK-4-01-001
    topic_id: BK-4-01-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      会社の設立にあたり、株式100株を1株につき¥50,000で発行し、全額の払込みを受けて普通預金とした。3級における正しい仕訳はどれか。
    choices:
      - "（借）資本金 5,000,000 ／（貸）普通預金 5,000,000"
      - "（借）普通預金 5,000,000 ／（貸）資本金 5,000,000"
      - "（借）普通預金 5,000,000 ／（貸）資本金 2,500,000・資本準備金 2,500,000"
      - "（借）普通預金 5,000,000 ／（貸）繰越利益剰余金 5,000,000"
    answer: 1
    explanation: |
      払込金額は100株×¥50,000＝¥5,000,000。3級では払込金額の全額を資本金とする処理のみを扱う。会社法上は2分の1までを資本準備金とすることもできるが、資本準備金を含む資本剰余金は2級の範囲である。繰越利益剰余金は稼いだ利益の留保額であり、出資とは区別する。

  - id: BK-4-01-002
    topic_id: BK-4-01-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      増資にあたり、新たに株式40株を1株につき¥60,000で発行し、全額の払込みを受けて普通預金とした。3級における正しい仕訳はどれか。
    choices:
      - "（借）普通預金 2,400,000 ／（貸）繰越利益剰余金 2,400,000"
      - "（借）普通預金 2,400,000 ／（貸）資本金 1,200,000・資本準備金 1,200,000"
      - "（借）資本金 2,400,000 ／（貸）普通預金 2,400,000"
      - "（借）普通預金 2,400,000 ／（貸）資本金 2,400,000"
    answer: 3
    explanation: |
      40株×¥60,000＝¥2,400,000。会社の成立後に行う増資でも、設立時と同じく3級では払込金額の全額を資本金とする。株主からの出資であって稼いだ利益ではないので、繰越利益剰余金としてはならない。借方は払い込まれた財産である普通預金である。

  - id: BK-4-01-003
    topic_id: BK-4-01-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      新たに株式を発行して払込を受けた際、借方に記入する科目はどれか。
    choices:
      - "資本金"
      - "普通預金"
      - "繰越利益剰余金"
      - "未収入金"
    answer: 1
    explanation: |
      株式の払込金は会社に入金された財産であり、資産の普通預金に記入する。資本金は貸方に計上される。繰越利益剰余金は利益の留保額、未収入金は未収の債権である。

  - id: BK-4-01-004
    topic_id: BK-4-01-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      会社設立時に株式100株を1株¥70,000で発行し、全額の払込みを受けた。3級での資本金の金額はいくらか。
    choices:
      - "7,000,000円"
      - "5,000,000円"
      - "7,000円"
      - "700,000円"
    answer: 0
    explanation: |
      100株×¥70,000＝¥7,000,000。3級では払込金額の全額を資本金として扱うため、資本金の金額は7,000,000円になる。資本準備金やその他の科目に分けない。 

  - id: BK-4-01-005
    topic_id: BK-4-01-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      3級において、株式の発行で払込金額を資本金と資本準備金に分ける処理はどう扱われるか。
    choices:
      - "常に資本金に振り替える"
      - "常に資本準備金に振り替える"
      - "資本金と資本準備金に分ける"
      - "払込金は資本金でも資本準備金でもない"
    answer: 0
    explanation: |
      3級では株式の払込金額はすべて資本金として処理する。資本準備金を用いる配分は2級以上の範囲であり、3級では扱わない。 

  - id: BK-4-01-006
    topic_id: BK-4-01-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      発行価額が額面を上回る場合、3級では超過額をどの勘定科目に計上するか。
    choices:
      - "資本金"
      - "資本準備金"
      - "繰越利益剰余金"
      - "払込資本"
    answer: 0
    explanation: |
      3級では、株式の発行価額が額面を上回っても超過額を含めた全額を資本金として処理する。資本準備金や繰越利益剰余金を使うのは上級の範囲であり、払込資本は3級で扱わない。 

  - id: BK-4-01-007
    topic_id: BK-4-01-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      株式会社が新株を発行して払込みを受けたとき、貸方に記入される科目はどれか。
    choices:
      - "普通預金"
      - "資本金"
      - "未払金"
      - "繰越利益剰余金"
    answer: 1
    explanation: |
      新株の払込みは会社の資本の増加を表すため、貸方に資本金を記入する。普通預金は借方に記入される。未払金は負債、繰越利益剰余金は利益の留保であり、新株発行の際には使わない。

  - id: BK-4-01-008
    topic_id: BK-4-01-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      額面¥1,000の株式100株を1株当たり¥1,200で発行し全額払込みを受けた。3級における払込金の処理として正しいものはどれか。
    choices:
      - "（借）普通預金 120,000 ／（貸）資本金 120,000"
      - "（借）普通預金 120,000 ／（貸）資本金 100,000・資本準備金 20,000"
      - "（借）資本金 120,000 ／（貸）普通預金 120,000"
      - "（借）普通預金 120,000 ／（貸）繰越利益剰余金 120,000"
    answer: 0
    explanation: |
      3級では発行済株式の払込金は全額を資本金として扱うため、借方に普通預金、貸方に資本金を記入する。超過額の資本準備金への振替は上級範囲である。

