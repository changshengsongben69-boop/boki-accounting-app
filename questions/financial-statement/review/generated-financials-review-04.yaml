  question: '次の残高試算表（一部）に基づき、当期純利益（損失）を計算し、最も適当な金額を選びなさい。


    売上 (貸方) 200000円

    備品減価償却累計額 (貸方) 110000円

    繰越利益剰余金 (貸方) 300000円

    仕入 (借方) 50000円

    売掛金 (借方) 210000円

    給料 (借方) 90000円

    現金 (借方) 150000円

    買掛金 (貸方) 200000円'
  choices:
  - '50000'
  - '60000'
  - '30000'
  - '70000'
  answer: 1
  explanation: "計算手順：\n計算手順：\n1) 収益合計を求める: $\text{収益合計} = 250000$\n2) 費用合計を求める: $\t\
    ext{費用合計} = 150000$\n3) 当期純利益 = 収益合計 − 費用合計 = $ 250000 - 150000 = 100000 $\n\n\
    （注）上記は試算表の一部に基づく簡易計算。実際の決算整理では追加仕訳が入る場合がある。"
