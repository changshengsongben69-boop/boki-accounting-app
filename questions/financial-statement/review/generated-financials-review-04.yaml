  valid_from: 2027
  difficulty: 2
  question: '次の残高試算表（一部）に基づき、総資産額に最も近い金額を選びなさい。


    備品 (借方) 300000円

    備品減価償却累計額 (貸方) 100000円

    売上 (貸方) 60000円

    資本金 (貸方) 100000円

    受取利息 (貸方) 100000円

    売掛金 (借方) 50000円

    仕入 (借方) 200000円

    買掛金 (貸方) 200000円'
  choices:
  - '240000'
  - '280000'
  - '260000'
  - '250000'
  answer: 3
  explanation: "計算手順：\n計算手順：\n1) 資産の合計を求める: $\text{資産合計} = 350000$\n2) 控除科目(累計減価償却等)を求める:\
    \ $\text{控除} = 100000$\n3) 総資産 = 資産合計 − 控除 = $ 350000 - 100000 = 250000 $\n\n\
    （注）上記は試算表の一部に基づく簡易計算。実際の決算整理では追加仕訳が入る場合がある。"
