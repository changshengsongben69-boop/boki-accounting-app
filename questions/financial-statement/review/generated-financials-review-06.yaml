  difficulty: 2
  question: '次の残高試算表（一部）に基づき、総資産額に最も近い金額を選びなさい。


    買掛金 (貸方) 210000円

    売上 (貸方) 200000円

    仕入 (借方) 200000円

    資本金 (貸方) 200000円

    売掛金 (借方) 100000円

    備品 (借方) 150000円

    受取利息 (貸方) 300000円

    普通預金 (借方) 200000円'
  choices:
  - '450000'
  - '480000'
  - '460000'
  - '440000'
  answer: 0
  explanation: "計算手順：\n計算手順：\n1) 資産の合計を求める: $\text{資産合計} = 500000$\n2) 控除科目(累計減価償却等)を求める:\
    \ $\text{控除} = 0$\n3) 総資産 = 資産合計 − 控除 = $ 500000 - 0 = 500000 $\n\n（注）上記は試算表の一部に基づく簡易計算。実際の決算整理では追加仕訳が入る場合がある。"
