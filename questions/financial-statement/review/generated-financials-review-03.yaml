    減価償却費 (借方) 300000円

    買掛金 (貸方) 300000円

    租税公課 (借方) 100000円'
  choices:
  - '490000'
  - '500000'
  - '530000'
  - '510000'
  answer: 1
  explanation: "計算手順：\n計算手順：\n1) 資産の合計を求める: $\text{資産合計} = 500000$\n2) 控除科目(累計減価償却等)を求める:\
