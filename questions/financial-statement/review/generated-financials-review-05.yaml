  valid_from: 2027
  difficulty: 2
  question: '次の残高試算表（一部）に基づき、当期純利益（損失）を計算し、最も適当な金額を選びなさい。


    資本金 (貸方) 150000円

    受取利息 (貸方) 300000円

    備品 (借方) 110000円

    買掛金 (貸方) 150000円

    売掛金 (借方) 90000円

    減価償却費 (借方) 50000円

    支払利息 (借方) 50000円

    現金 (借方) 300000円'
  choices:
  - '170000'
  - '200000'
  - '210000'
  - '230000'
  answer: 1
  explanation: "計算手順：\n計算手順：\n1) 収益合計を求める: $\text{収益合計} = 300000$\n2) 費用合計を求める: $\t\
    ext{費用合計} = 100000$\n3) 当期純利益 = 収益合計 − 費用合計 = $ 300000 - 100000 = 200000 $\n\n\
    （注）上記は試算表の一部に基づく簡易計算。実際の決算整理では追加仕訳が入る場合がある。"
- id: GEN-FS-022
  topic_id: BK-3-09-01
