  grades:
  - '3'
  valid_from: 2027
  difficulty: 2
  question: '次の残高試算表（一部）に基づき、総資産額に最も近い金額を選びなさい。


    借入金 (貸方) 40000円

    備品減価償却累計額 (貸方) 150000円

    備品 (借方) 200000円

    仕入 (借方) 200000円

    給料 (借方) 50000円

    支払利息 (借方) 40000円

    繰越利益剰余金 (貸方) 150000円

    資本金 (貸方) 150000円'
  choices:
  - '80000'
  - '60000'
  - '50000'
  - '40000'
  answer: 2
  explanation: "計算手順：\n計算手順：\n1) 資産の合計を求める: $\text{資産合計} = 250000$\n2) 控除科目(累計減価償却等)を求める:\
    \ $\text{控除} = 150000$\n3) 総資産 = 資産合計 − 控除 = $ 250000 - 150000 = 100000 $\n\n\
    （注）上記は試算表の一部に基づく簡易計算。実際の決算整理では追加仕訳が入る場合がある。"
