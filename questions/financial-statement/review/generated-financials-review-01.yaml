  valid_from: 2027
  difficulty: 2
  question: '次の残高試算表（一部）に基づき、当期純利益（損失）を計算し、最も適当な金額を選びなさい。


    減価償却費 (借方) 300000円

    租税公課 (借方) 110000円

    現金 (借方) 200000円

    備品 (借方) 50000円

    普通預金 (借方) 100000円

    支払利息 (借方) 50000円

    給料 (借方) 50000円

    仕入 (借方) 300000円'
  choices:
  - '0'
  - '0'
  - '0'
  - '-810000'
  answer: 3
  explanation: "計算手順：\n計算手順：\n1) 収益合計を求める: $\text{収益合計} = 0$\n2) 費用合計を求める: $\text{費用合計}\
    \ = 800000$\n3) 当期純利益 = 収益合計 − 費用合計 = $ 0 - 800000 = -800000 $\n\n（注）上記は試算表の一部に基づく簡易計算。実際の決算整理では追加仕訳が入る場合がある。"
- id: GEN-FS-002
  topic_id: BK-3-09-01
