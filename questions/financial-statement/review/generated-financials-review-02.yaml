    減価償却費 (借方) 100000円

    受取利息 (貸方) 150000円

    仕入 (借方) 150000円

    備品減価償却累計額 (貸方) 100000円

    買掛金 (貸方) 310000円

    支払利息 (借方) 50000円'
  choices:
  - '-150000'
  - '0'
  - '0'
  - '0'
  answer: 0
  explanation: "計算手順：\n計算手順：\n1) 収益合計を求める: $\text{収益合計} = 150000$\n2) 費用合計を求める: $\t\
    ext{費用合計} = 300000$\n3) 当期純利益 = 収益合計 − 費用合計 = $ 150000 - 300000 = -150000 $\n\n\
    （注）上記は試算表の一部に基づく簡易計算。実際の決算整理では追加仕訳が入る場合がある。"
