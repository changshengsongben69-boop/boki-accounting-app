  valid_from: 2027
  difficulty: 2
  question: '次の残高試算表（一部）に基づき、総資産額に最も近い金額を選びなさい。


    給料 (借方) 300000円

    受取利息 (貸方) 190000円

    普通預金 (借方) 100000円

    租税公課 (借方) 100000円

    減価償却費 (借方) 50000円

    仕入 (借方) 300000円

    現金 (借方) 150000円

    買掛金 (貸方) 50000円'
  choices:
  - '280000'
  - '250000'
  - '220000'
  - '240000'
  answer: 1
  explanation: "計算手順：\n計算手順：\n1) 資産の合計を求める: $\text{資産合計} = 250000$\n2) 控除科目(累計減価償却等)を求める:\
    \ $\text{控除} = 0$\n3) 総資産 = 資産合計 − 控除 = $ 250000 - 0 = 250000 $\n\n（注）上記は試算表の一部に基づく簡易計算。実際の決算整理では追加仕訳が入る場合がある。"
