    現金 (借方) 200000円

    備品 (借方) 50000円

    普通預金 (借方) 100000円

    支払利息 (借方) 50000円

    給料 (借方) 50000円

    仕入 (借方) 300000円'
  choices:
  - '0'
  - '-800000'
  - '-820000'
  - '-810000'
  answer: 3
  explanation: "計算手順：\n\n1) 収益合計を求める: $\text{収益合計} = 0$\n2) 費用合計を求める: $\text{費用合計}\
