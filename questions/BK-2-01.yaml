# BK-2-01
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-2-01-03, BK-2-01-04, BK-2-01-07, BK-2-01-08
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-2-01-03

questions:
  - id: BK-2-01-001
    topic_id: BK-2-01-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      現金の実際有高を調べたところ、帳簿残高より¥3,000少なかった。原因はまだ判明していない。正しい仕訳はどれか。
    choices:
      - "（借）雑損 3,000 ／（貸）現金 3,000"
      - "原因が判明するまで仕訳は行わない"
      - "（借）現金過不足 3,000 ／（貸）現金 3,000"
      - "（借）現金 3,000 ／（貸）現金過不足 3,000"
    answer: 2
    explanation: |
      帳簿は実際有高に合わせる必要があるので、現金を¥3,000減らす。相手科目は原因が判明するまでの一時的な科目である現金過不足。期中の段階でいきなり雑損とするのは、原因が判明すれば適切な科目に振り替えるべきなので誤り。仕訳を行わないと帳簿残高と実際有高がずれたままになる。

  - id: BK-2-01-002
    topic_id: BK-2-01-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      借方残高¥3,000の現金過不足のうち、¥2,600は通信費の記帳もれであることが判明した。正しい仕訳はどれか。
    choices:
      - "（借）通信費 2,600 ／（貸）現金過不足 2,600"
      - "（借）現金過不足 2,600 ／（貸）通信費 2,600"
      - "（借）通信費 2,600 ／（貸）現金 2,600"
      - "（借）通信費 2,600 ／（貸）雑益 2,600"
    answer: 0
    explanation: |
      現金過不足は原因が判明した分だけ本来の科目へ振り替える。不足の原因が費用の記帳もれなので、通信費を借方に計上し、借方に計上されていた現金過不足を貸方で取り崩す。現金はすでに実際有高に合わせて減らしてあるため、ここで再び減らすと二重に減額してしまう。

  - id: BK-2-01-003
    topic_id: BK-2-01-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算日を迎えたが、現金過不足勘定の借方残高¥400については原因が判明しなかった。正しい仕訳はどれか。
    choices:
      - "（借）現金過不足 400 ／（貸）雑益 400"
      - "（借）雑益 400 ／（貸）現金過不足 400"
      - "翌期に繰り越すので仕訳は不要である"
      - "（借）雑損 400 ／（貸）現金過不足 400"
    answer: 3
    explanation: |
      現金過不足は一時的な仮の科目なので、決算では必ず残高をゼロにする。借方残高（現金の不足）が残っている場合は費用である雑損に振り替える。逆に貸方残高（現金の過剰）であれば雑益とする。仮の科目を翌期に繰り越すことはできない。

  - id: BK-2-01-004
    topic_id: BK-2-01-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算日に現金の実際有高を調べたところ、帳簿残高より¥800多かったが原因は不明であった。正しい仕訳はどれか。
    choices:
      - "（借）雑損 800 ／（貸）現金 800"
      - "（借）現金 800 ／（貸）雑益 800"
      - "（借）現金 800 ／（貸）現金過不足 800"
      - "（借）現金過不足 800 ／（貸）雑益 800"
    answer: 1
    explanation: |
      決算日に発見した過不足は、原因を調査する期間がもはや残っていないため、現金過不足勘定を経由せず直接雑益（過剰の場合）または雑損（不足の場合）とする。期中に発見した場合といったん現金過不足に振り替えるかどうかが分かれる点であり、問題文の日付をよく確認すること。

  - id: BK-2-01-005
    topic_id: BK-2-01-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      当社はA銀行とB銀行に普通預金口座を開設し、口座ごとに勘定を設けて管理している。A銀行の口座からB銀行の口座へ¥500,000を振り替えた（手数料は考慮しない）。正しい仕訳はどれか。
    choices:
      - "同じ普通預金なので仕訳は不要である"
      - "（借）普通預金B銀行 500,000 ／（貸）普通預金A銀行 500,000"
      - "（借）普通預金A銀行 500,000 ／（貸）普通預金B銀行 500,000"
      - "（借）現金 500,000 ／（貸）普通預金A銀行 500,000"
    answer: 1
    explanation: |
      口座ごとに勘定を設けている場合、それぞれが独立した資産の勘定なので、減る口座を貸方、増える口座を借方に記入する。資金がA銀行から出てB銀行に入るのだから、貸方がA銀行、借方がB銀行。現金を経由していないので現金勘定は使わない。2027年度の区分表では「複数口座を開設している場合の管理を含む」と明記され、3級の範囲であることがはっきりした。

  - id: BK-2-01-006
    topic_id: BK-2-01-07
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      定額資金前渡法（インプレスト・システム）により小口現金を管理している。用度係から、旅費交通費¥3,200および通信費¥1,500を支払った旨の報告を受けた。正しい仕訳はどれか。
    choices:
      - "（借）旅費交通費 3,200・通信費 1,500 ／（貸）小口現金 4,700"
      - "（借）小口現金 4,700 ／（貸）旅費交通費 3,200・通信費 1,500"
      - "（借）旅費交通費 3,200・通信費 1,500 ／（貸）現金 4,700"
      - "支払報告だけでは仕訳せず、補給時にまとめて仕訳する"
    answer: 0
    explanation: |
      支払報告を受けた時点で費用が確定するので、各費用の科目を借方に計上し、手許の小口現金が減ったことを貸方に記入する。用度係が支払ったのは小口現金であって本社の現金ではないため、貸方を現金とするのは誤り。補給時の仕訳とは別に、報告時の仕訳が必要である。

  - id: BK-2-01-007
    topic_id: BK-2-01-07
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      定額資金前渡法（インプレスト・システム）の説明として正しいものはどれか。
    choices:
      - "用度係が支払うたびに本社が同額をただちに補給する方法"
      - "小口現金勘定を設けず、すべての支払を現金勘定で処理する方法"
      - "一定期間の支払報告を受けた後、使用した額と同額を補給し、手許有高を常に一定額に保つ方法"
      - "月々の支払額の見込みに応じて、その都度異なる金額を前渡しする方法"
    answer: 2
    explanation: |
      定額資金前渡法は、あらかじめ定めた一定額を用度係に前渡ししておき、支払報告を受けたら使った分だけを補給する方法。補給後の手許有高は必ず当初の定額に戻るため、管理が容易で使いすぎも把握しやすい。金額をその都度変える方法や、支払のたびに補給する方法は定額資金前渡法とはいわない。

  - id: BK-2-01-008
    topic_id: BK-2-01-08
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      小口現金出納帳についての説明として正しいものはどれか。
    choices:
      - "決算時にのみ作成する帳簿である"
      - "用度係が管理する小口現金の受入れと支払いの明細を記録する補助記入帳である"
      - "総勘定元帳の一部であり、主要簿に分類される"
      - "現金出納帳と同じ帳簿の別名である"
    answer: 1
    explanation: |
      小口現金出納帳は、日常のこまごまとした支払いに充てるために用度係へ前渡しした小口現金について、受入額と支払明細を記録する補助記入帳である。会計係が管理する現金全体を記録する現金出納帳とは対象が異なる。補助簿なので主要簿ではなく、日々の取引のつど記入する。

  - id: BK-2-01-009
    topic_id: BK-2-01-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      商品を現金¥120,000で購入した。正しい仕訳はどれか。
    choices:
      - "（借）仕入 120,000 ／（貸）現金 120,000"
      - "（借）現金 120,000 ／（貸）仕入 120,000"
      - "（借）借入金 120,000 ／（貸）現金 120,000"
      - "（借）現金 120,000 ／（貸）買掛金 120,000"
    answer: 0
    explanation: |
      現金で商品を購入した場合、費用または商品勘定を借方に計上し、現金の支出により現金を貸方で減少させる。現金受領ではなく支払いなので現金を借方にするのは誤り。

  - id: BK-2-01-010
    topic_id: BK-2-01-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      現金出納帳について正しいものはどれか。
    choices:
      - "現金の入金・出金を記録する補助簿である"
      - "当座預金の入出金を記録する補助簿である"
      - "固定資産の取得原価を記録する帳簿である"
      - "収益と費用の勘定科目を集計する帳簿である"
    answer: 0
    explanation: |
      現金出納帳は現金取引の入金・出金を記録する補助簿であり、現金の受払を日付順に整理する。銀行預金や固定資産、損益科目の記録には使わない。

  - id: BK-2-01-011
    topic_id: BK-2-01-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      当座預金出納帳について正しいものはどれか。
    choices:
      - "当座預金の預入・払戻しを記録する補助簿である"
      - "現金の入金・出金を記録する補助簿である"
      - "売掛金の回収を管理する帳簿である"
      - "有形固定資産の減価償却を記録する帳簿である"
    answer: 0
    explanation: |
      当座預金出納帳は当座預金口座の入出金を記録する補助簿であり、現金出納帳とは扱う対象が異なる。売掛金や固定資産関係の帳簿ではない。

