# BK-3-05
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-3-05
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-3-05

questions:
  - id: BK-3-05-001
    topic_id: BK-3-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり、売上勘定の残高¥900,000を損益勘定へ振り替える仕訳として正しいものはどれか。
    choices:
      - "（借）損益 900,000 ／（貸）売上 900,000"
      - "（借）売上 900,000 ／（貸）繰越利益剰余金 900,000"
      - "（借）売上 900,000 ／（貸）売掛金 900,000"
      - "（借）売上 900,000 ／（貸）損益 900,000"
    answer: 3
    explanation: |
      売上は収益なので貸方残高になっている。これをゼロにするには借方に売上を記入し、相手方の損益勘定の貸方へ集める。収益はすべて損益勘定の貸方に集まることになる。繰越利益剰余金へ直接振り替えるのではなく、いったん損益勘定に集めて当期純損益を計算するのが手順である。

  - id: BK-3-05-002
    topic_id: BK-3-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり、仕入勘定の残高¥580,000を損益勘定へ振り替える仕訳として正しいものはどれか。
    choices:
      - "（借）繰越利益剰余金 580,000 ／（貸）仕入 580,000"
      - "（借）損益 580,000 ／（貸）仕入 580,000"
      - "（借）仕入 580,000 ／（貸）損益 580,000"
      - "（借）損益 580,000 ／（貸）繰越商品 580,000"
    answer: 1
    explanation: |
      決算整理後の仕入勘定の残高は売上原価を表しており、費用なので借方残高である。これをゼロにするには貸方に仕入を記入し、相手方の損益勘定の借方へ集める。費用はすべて損益勘定の借方に集まる。収益の振替とは貸借が逆になる点を確認すること。

  - id: BK-3-05-003
    topic_id: BK-3-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      収益と費用をすべて振り替えた結果、損益勘定が¥120,000の貸方残高となった。この意味として正しいものはどれか。
    choices:
      - "現金が¥120,000残っていることを示す"
      - "繰越利益剰余金が¥120,000であることを示す"
      - "当期純利益が¥120,000であることを示す"
      - "当期純損失が¥120,000であることを示す"
    answer: 2
    explanation: |
      損益勘定の貸方には収益、借方には費用が集まる。貸方残高ということは収益が費用を上回っている状態であり、その差額が当期純利益となる。逆に借方残高であれば当期純損失。損益勘定の残高は利益の額を示すだけで、同額の現金があることを意味しないし、繰越利益剰余金の残高そのものでもない。

  - id: BK-3-05-004
    topic_id: BK-3-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      決算振替仕訳を行う目的として最も適切なものはどれか。
    choices:
      - "翌期の予算を作成するため"
      - "収益・費用の残高を損益勘定に集めて当期純損益を計算し、それを繰越利益剰余金へ移すため"
      - "期中の取引の記帳もれを発見するため"
      - "補助簿と総勘定元帳の残高を一致させるため"
    answer: 1
    explanation: |
      決算振替仕訳は、収益と費用を損益勘定に集約して当期純損益を算定し、それを純資産である繰越利益剰余金へ振り替える一連の仕訳をいう。これにより収益・費用の勘定が締め切られ、利益が貸借対照表に反映される。記帳もれの発見は試算表の役割であり、補助簿との照合は別の手続である。

  - id: BK-3-05-005
    topic_id: BK-3-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      損益勘定へ費用を振り替えるとき、仕入勘定の貸方と損益勘定のどちら側に記入するか。
    choices:
      - "借方"
      - "貸方"
      - "どちらでもよい"
      - "記入しない"
    answer: 1
    explanation: |
      費用勘定である仕入は借方残高なので、損益勘定へ振り替えるときは仕入を貸方に記入し、相手方の損益勘定の借方へ集める。収益を振り替えるときは逆に損益勘定の貸方に集めることになる。

  - id: BK-3-05-006
    topic_id: BK-3-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      売上の残高を損益勘定へ振り替える仕訳として正しいものはどれか。
    choices:
      - "（借）売上 ／（貸）損益"
      - "（借）損益 ／（貸）売上"
      - "（借）売上 ／（貸）繰越利益剰余金"
      - "（借）損益 ／（貸）前払費用"
    answer: 1
    explanation: |
      売上は貸方残高なので、これをゼロにするには借方に売上を記入し、相手方の損益勘定の貸方へ集める。損益勘定には収益の貸方と費用の借方が集められる。繰越利益剰余金へ直接振り替えるのは決算振替の後の手続である。

  - id: BK-3-05-007
    topic_id: BK-3-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      収益と費用を損益勘定に振り替える仕訳を何というか。
    choices:
      - "決算整理仕訳"
      - "決算振替仕訳"
      - "試算表仕訳"
      - "期末仕訳"
    answer: 1
    explanation: |
      収益と費用を損益勘定に振り替えて損益勘定の残高を求める仕訳は決算振替仕訳と呼ばれる。決算整理仕訳は収益や費用の計上や資産負債の調整を行う仕訳の総称であり、その後に決算振替仕訳を行う。

  - id: BK-3-05-008
    topic_id: BK-3-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      損益勘定の借方残高が残っている場合、これは何を示しているか。
    choices:
      - "当期純利益"
      - "当期純損失"
      - "資本金の増加"
      - "繰越利益剰余金の増加"
    answer: 1
    explanation: |
      損益勘定の借方残高は費用が収益を上回っている状態を示し、当期純損失を意味する。貸方残高なら当期純利益である。資本金や繰越利益剰余金の増加を直接示すものではない。

