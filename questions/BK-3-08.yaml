    question: |
      繰越試算表の目的として最も適切なものはどれか。
    choices:
      - "翌期首に前期繰越を正しく転記するため、資産・負債・純資産の次期繰越額を検証する"
      - "当期の利益金額を計算するため、収益と費用を集計する"
      - "決算整理前の残高を一覧にして、仕訳漏れを発見する"
      - "固定資産の減価償却費を計算する"
    answer: 0
    explanation: |
      繰越試算表は、資産・負債・純資産の次期繰越額が正しく貸借一致しているかを確認するために作成される。収益と費用は損益勘定で締め切られるため、繰越試算表の中心項目ではない。減価償却費の計算や決算整理前残高の一覧は別の手続きで行う。

  - id: BK-3-08-009
    topic_id: BK-3-08-02
