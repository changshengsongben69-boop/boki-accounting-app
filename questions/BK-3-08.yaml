# BK-3-08
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-3-08-01
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-3-08-01

questions:
  - id: BK-3-08-001
    topic_id: BK-3-08-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      英米式決算法における資産・負債・純資産の各勘定の締め切り方として正しいものはどれか。
    choices:
      - "残高勘定へ振り替えて締め切る"
      - "締め切らずにそのまま翌期へ続けて記入する"
      - "残高を「次期繰越」として記入して締め切り、翌期首に「前期繰越」として記入する"
      - "損益勘定へ振り替えて締め切る"
    answer: 2
    explanation: |
      英米式決算法では、資産・負債・純資産の各勘定は残高を「次期繰越」と記入して直接締め切り、翌期首に「前期繰越」として書き始める。残高勘定を設けて振り替えるのは大陸式決算法であり、3級では英米式のみを扱う。損益勘定へ振り替えるのは収益と費用の勘定である。

  - id: BK-3-08-002
    topic_id: BK-3-08-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      決算において収益・費用の各勘定を締め切った後、これらの勘定はどうなるか。
    choices:
      - "残高がゼロになるため、翌期へ繰り越さない"
      - "残高を次期繰越として翌期へ繰り越す"
      - "繰越試算表に記載される"
      - "翌期首に再振替仕訳を行って復活させる"
    answer: 0
    explanation: |
      収益と費用は一会計期間の成果を表すものなので、損益勘定へ振り替えて残高をゼロにし、翌期はまたゼロから記録し始める。したがって繰越しは行わず、繰越試算表にも載らない。翌期に繰り越されるのは資産・負債・純資産の各勘定だけである。再振替仕訳は前払費用など経過勘定について行うものであり、収益・費用の勘定を繰り越すこととは異なる。

  - id: BK-3-08-003
    topic_id: BK-3-08-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      繰越試算表についての説明として正しいものはどれか。
    choices:
      - "決算整理前の残高を集計した表である"
      - "当期純利益を計算するために作成する表である"
      - "資産・負債・純資産の各勘定の次期繰越額を集計し、その正確性を確かめるために作成する"
      - "収益・費用の各勘定の残高を集計した表である"
    answer: 2
    explanation: |
      英米式決算法では各勘定に直接「次期繰越」と記入して締め切るため、書き写しの誤りが起こりうる。そこで繰越額だけを集めた繰越試算表を作り、貸借の一致によって正確性を検証する。集計対象は翌期へ繰り越す資産・負債・純資産に限られ、収益・費用は含まれない。

  - id: BK-3-08-004
    topic_id: BK-3-08-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      英米式決算法で収益勘定を締め切るとき、収益の残高はどこへ振り替えるか。
    choices:
      - "損益"
      - "繰越利益剰余金"
      - "次期繰越"
      - "前期繰越"
    answer: 0
    explanation: |
      英米式決算法では収益はすべて損益勘定の貸方に集められる。損益勘定は収益と費用の差額を示し、その後で当期純損益を繰越利益剰余金へ振り替える。前期繰越は翌期首に資産・負債・純資産の勘定に記入するものであり、収益勘定の締め切り先ではない。

  - id: BK-3-08-005
    topic_id: BK-3-08-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      英米式決算法では、翌期首に資産勘定へ記入される残高の呼び方として正しいものはどれか。
    choices:
      - "前期繰越"
      - "次期繰越"
      - "繰越利益剰余金"
      - "損益"
    answer: 0
    explanation: |
      英米式決算法では、前期に締め切った残高を翌期首に「前期繰越」として資産・負債・純資産の勘定に記入する。資産・負債・純資産の各勘定に記入されるのは前期繰越額であり、「次期繰越」は決算日に記入する概念である。

  - id: BK-3-08-006
    topic_id: BK-3-08-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      英米式決算法において、収益と費用をすべて損益勘定へ振り替えた後の損益勘定の残高はどうなるか。
    choices:
      - "ゼロになる"
      - "前期繰越になる"
      - "次期繰越になる"
      - "繰越利益剰余金になる"
    answer: 0
    explanation: |
      収益と費用を損益勘定に集めた後、損益勘定の残高をゼロにして当期純損益を繰越利益剰余金へ振り替える。したがって、すべての振替が終わった時点では損益勘定の残高はゼロになる。前期繰越や次期繰越は資産・負債・純資産の勘定に関する用語であり、損益勘定の残高の状態ではない。

  - id: BK-3-08-007
    topic_id: BK-3-08-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      英米式決算法で当期純損失が発生した場合、損益勘定の残高はどのようになるか。
    choices:
      - "借方残高"
      - "貸方残高"
      - "ゼロ残高"
      - "繰越利益剰余金残高"
    answer: 0
    explanation: |
      当期純損失は費用が収益を上回った結果なので、損益勘定は借方残高になる。利益が出た場合は貸方残高となり、ゼロになるのは決算振替後である。繰越利益剰余金は損益勘定の相手勘定であり、損益勘定の残高そのものではない。

  - id: BK-3-08-008
    topic_id: BK-3-08-01
