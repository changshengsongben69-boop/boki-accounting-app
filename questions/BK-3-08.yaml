    question: |
      補助簿について正しいものはどれか。
    choices:
      - "主要簿の記録を補助するため、取引の詳細を記録する帳簿である"
      - "貸借対照表そのものを表す帳簿である"
      - "税務申告書を作成するための帳簿である"
      - "仕訳帳と同じものを指す"
    answer: 0
    explanation: |
