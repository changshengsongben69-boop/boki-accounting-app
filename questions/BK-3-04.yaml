# BK-3-04
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-3-04
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-3-04

questions:
  - id: BK-3-04-001
    topic_id: BK-3-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      決算整理後残高試算表についての説明として正しいものはどれか。
    choices:
      - "決算整理を反映した後の各勘定の残高を集計したもので、これをもとに財務諸表を作成できる"
      - "決算整理前の残高を集計したものである"
      - "収益と費用の勘定は記載されない"
      - "当期純利益がすでに1行として記載されている"
    answer: 0
    explanation: |
      決算整理後残高試算表は、売上原価の算定や減価償却などの決算整理仕訳をすべて反映した後の残高一覧である。ここに並ぶ収益と費用から損益計算書が、資産・負債・純資産から貸借対照表が作成できる。当期純利益はこの試算表の収益と費用の差額として計算されるものであり、独立した行としては記載されない。

  - id: BK-3-04-002
    topic_id: BK-3-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    preformatted: true
    question: |
      【決算整理前残高試算表（一部）】繰越商品 50,000／仕入 1,200,000
      【決算整理事項】期末商品棚卸高は70,000円である。

      決算整理後残高試算表に記載される繰越商品と仕入の金額の組合せとして、正しいものはどれか。
    choices:
      - "繰越商品 70,000／仕入 1,180,000"
      - "繰越商品 50,000／仕入 1,200,000"
      - "繰越商品 70,000／仕入 1,200,000"
      - "繰越商品 120,000／仕入 1,180,000"
    answer: 0
    explanation: |
      決算整理後は、繰越商品が期末商品有高70,000円、仕入が売上原価
      （50,000＋1,200,000−70,000＝1,180,000円）を表す。
      同じ勘定科目が、決算整理の前と後で違う内容を示すことがこの試算表の読みどころ。
      決算整理前の繰越商品50,000円は期首商品有高であり、期末商品ではない。

  - id: BK-3-04-003
    topic_id: BK-3-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算整理後残高試算表に記載されないものはどれか。
    choices:
      - "当期純利益"
      - "貸倒引当金繰入"
      - "前払保険料"
      - "備品減価償却累計額"
    answer: 0
    explanation: |
      決算整理後残高試算表は、決算整理を反映した各勘定の残高を並べたものである。
      当期純利益は収益と費用の差額として計算される値であって勘定ではないため、記載されない
      （損益勘定へ振り替えて算定するのは、この後の決算振替の手続）。
      貸倒引当金繰入は決算整理で新たに生じた費用の勘定、前払保険料は資産の勘定、
      備品減価償却累計額は評価勘定として、いずれも残高が記載される。

  - id: BK-3-04-004
    topic_id: BK-3-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    preformatted: true
    question: |
      【決算整理前残高試算表】借方合計・貸方合計とも 4,406,000円
      【決算整理事項】
      ① 期末商品棚卸高 70,000円（決算整理前の繰越商品は50,000円）
      ② 貸倒引当金を10,000円繰り入れる
      ③ 減価償却費120,000円を間接法により計上する
      ④ 支払保険料のうち80,000円を前払保険料に振り替える
      ⑤ 家賃の未払分20,000円を計上する

      決算整理後残高試算表の借方合計として正しいものはどれか。
    choices:
      - "4,556,000円"
      - "4,406,000円"
      - "4,446,000円"
      - "4,626,000円"
    answer: 0
    explanation: |
      借方側の増減は、繰越商品＋20,000、仕入−20,000、支払保険料−80,000、前払保険料＋80,000、
      支払家賃＋20,000、貸倒引当金繰入＋10,000、減価償却費＋120,000で、差引＋150,000円。
      よって4,406,000＋150,000＝4,556,000円。
      貸方側も未払家賃＋20,000、貸倒引当金＋10,000、備品減価償却累計額＋120,000で＋150,000円となり、
      決算整理後も貸借は一致する。決算整理仕訳は必ず借方と貸方に同額入るので、
      両側が同じ額だけ増えるという点を使うと検算できる。

  - id: BK-3-04-005
    topic_id: BK-3-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    preformatted: true
    question: |
      【決算整理後残高試算表（収益と費用の部分）】
      売上 2,200,000／受取手数料 60,000
      仕入 1,180,000／給料 500,000／支払家賃 260,000／支払保険料 40,000／
      貸倒引当金繰入 10,000／減価償却費 120,000

      当期純利益として正しいものはどれか。
    choices:
      - "150,000円"
      - "350,000円"
      - "230,000円"
      - "1,080,000円"
    answer: 0
    explanation: |
      収益は2,200,000＋60,000＝2,260,000円。
      費用は1,180,000＋500,000＋260,000＋40,000＋10,000＋120,000＝2,110,000円。
      差引150,000円が当期純利益となる。
      決算整理後残高試算表からは、収益と費用の行を拾って差し引くだけで当期純利益が求められる。
      貸倒引当金繰入と減価償却費も当期の費用なので、集計から漏らさないこと。

  - id: BK-3-04-006
    topic_id: BK-3-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算整理後残高試算表に記載されるものとして正しいものはどれか。
    choices:
      - "当期純利益"
      - "前払保険料"
      - "当期純損失"
      - "収益と費用の差額"
    answer: 1
    explanation: |
      決算整理後残高試算表には、前払保険料のような資産の残高が記載される。あくまで各勘定の残高を一覧した表であり、当期純利益や当期純損失といった計算結果そのものは記載されない。収益と費用の差額は損益計算書で求めるものである。

  - id: BK-3-04-007
    topic_id: BK-3-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
