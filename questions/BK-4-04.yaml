# BK-4-04
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-4-04-01
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-4-04-01

questions:
  - id: BK-4-04-001
    topic_id: BK-4-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      株主総会において、繰越利益剰余金を財源として配当金¥300,000を支払うことと、利益準備金¥30,000を積み立てることが決議された。正しい仕訳はどれか。
    choices:
      - "（借）繰越利益剰余金 300,000 ／（貸）未払配当金 300,000"
      - "（借）繰越利益剰余金 330,000 ／（貸）普通預金 300,000・利益準備金 30,000"
      - "（借）未払配当金 300,000・利益準備金 30,000 ／（貸）繰越利益剰余金 330,000"
      - "（借）繰越利益剰余金 330,000 ／（貸）未払配当金 300,000・利益準備金 30,000"
    answer: 3
    explanation: |
      株主総会の決議によって配当額が確定するので、この時点で支払義務を表す未払配当金（負債）を計上する。利益準備金の積立てもあわせて決議されるため、配当金と準備金の合計¥330,000だけ繰越利益剰余金が減少する。まだ支払っていないので普通預金は減らない。なお準備金として積み立てるべき額の算定は2級の範囲であり、3級では金額が与えられる。

  - id: BK-4-04-002
    topic_id: BK-4-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      株主総会で決議された配当金¥300,000を、普通預金口座から支払った。正しい仕訳はどれか。
    choices:
      - "（借）支払配当金 300,000 ／（貸）普通預金 300,000"
      - "（借）未払配当金 300,000 ／（貸）普通預金 300,000"
      - "（借）繰越利益剰余金 300,000 ／（貸）普通預金 300,000"
      - "（借）普通預金 300,000 ／（貸）未払配当金 300,000"
    answer: 1
    explanation: |
      決議時にすでに未払配当金という負債を計上しているので、支払によってその負債が消滅する。ここで繰越利益剰余金を減らすと、決議時とあわせて二重に減額してしまう。配当は株主への利益の分配であって費用ではないため、支払配当金のような費用の科目は用いない。

  - id: BK-4-04-003
    topic_id: BK-4-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      株主総会の決議によって配当金を支払うことになったとき、まだ支払っていない時点で計上する科目はどれか。
    choices:
      - "未払配当金"
      - "支払配当金"
      - "繰越利益剰余金"
      - "前払配当金"
    answer: 0
    explanation: |
      支払義務が確定した段階で、まだ支払っていない金額は未払配当金という負債として計上する。支払配当金は費用の勘定であり、3級では使用しない。繰越利益剰余金は利益の留保額であり、配当の支払義務そのものを示すものではない。

  - id: BK-4-04-004
    topic_id: BK-4-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      配当金を支払ったときの仕訳として正しいものはどれか。
    choices:
      - "（借）未払配当金 ／（貸）普通預金"
      - "（借）普通預金 ／（貸）未払配当金"
      - "（借）繰越利益剰余金 ／（貸）普通預金"
      - "（借）支払配当金 ／（貸）普通預金"
    answer: 1
    explanation: |
      支払義務が決議時に未払配当金として計上されている時点では、支払い時に未払配当金を減少させ、普通預金を減少させる。貸方に普通預金を記入するのが正しい。繰越利益剰余金は既に決議時の仕訳で減少している場合が多い。 

  - id: BK-4-04-005
    topic_id: BK-4-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      未払配当金はどの区分の勘定科目か。
    choices:
      - "資産"
      - "負債"
      - "純資産"
      - "費用"
    answer: 1
    explanation: |
      未払配当金は、決議により支払義務が生じたがまだ支払っていない金額を表す負債の科目である。純資産や資産ではない。 

  - id: BK-4-04-006
    topic_id: BK-4-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決議時に未払配当金が計上されている場合、配当金の支払い時に繰越利益剰余金が再度減少するか。
    choices:
      - "はい"
      - "いいえ"
      - "場合による"
      - "配当金とは無関係"
    answer: 1
    explanation: |
      配当金は決議時に繰越利益剰余金から未払配当金へ振り替えられるため、支払時にはすでに繰越利益剰余金は減少している。支払時には未払配当金が減少し、普通預金が減少するだけである。

  - id: BK-4-04-007
    topic_id: BK-4-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      株主総会の決議がなければ未払配当金は計上されるか。
    choices:
      - "はい"
      - "いいえ"
      - "同額であれば計上される"
      - "決議後1か月以内にだけ計上される"
    answer: 1
    explanation: |
      未払配当金は株主総会の決議により配当金の支払義務が確定した場合に計上される。決議がなければ支払義務が未確定であるため、未払配当金は計上されない。

  - id: BK-4-04-008
    topic_id: BK-4-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      配当は企業の財務諸表上どのように扱われるか。最も適切なものはどれか。
    choices:
      - "損益計算書の費用として計上される"
      - "純資産の減少として表示される"
      - "負債として常に計上される"
      - "収益として計上される"
    answer: 1
    explanation: |
      配当は株主への利益処分であり、費用ではなく純資産の処分として扱われる。支払前は未払配当金（負債）で計上されるが、配当そのものは損益計算書上の費用ではない。

