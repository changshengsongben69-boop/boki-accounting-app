topic_default: BK-2-05-01

questions:
  - id: BK-2-05-001
    topic_id: BK-2-05-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり、期末の売掛金残高¥800,000に対して2%の貸倒引当金を差額補充法により設定する。決算整理前の貸倒引当金残高は¥6,000である。正しい仕訳はどれか。
    choices:
      - "（借）貸倒引当金 6,000 ／（貸）貸倒引当金繰入 6,000"
      - "（借）貸倒損失 10,000 ／（貸）貸倒引当金 10,000"
      - "（借）貸倒引当金繰入 10,000 ／（貸）貸倒引当金 10,000"
      - "（借）貸倒引当金繰入 16,000 ／（貸）貸倒引当金 16,000"
    answer: 2
    explanation: |
      設定すべき見積額は¥800,000×2%＝¥16,000。差額補充法は、すでにある残高¥6,000との差額だけを追加計上する方法なので、繰入額は¥16,000−¥6,000＝¥10,000となる。見積額の全額¥16,000を繰り入れると引当金が¥22,000となり過大。実際に貸倒れが発生したわけではないので、貸倒損失は用いない。

  - id: BK-2-05-002
    topic_id: BK-2-05-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり貸倒引当金の見積額は¥16,000と算定されたが、決算整理前の貸倒引当金残高は¥20,000であった。差額補充法による正しい仕訳はどれか。
    choices:
      - "（借）貸倒引当金 4,000 ／（貸）貸倒引当金戻入 4,000"
      - "（借）貸倒引当金繰入 4,000 ／（貸）貸倒引当金 4,000"
      - "（借）貸倒引当金 20,000 ／（貸）貸倒引当金戻入 20,000"
      - "残高が多い場合は何も処理しない"
    answer: 0
    explanation: |
      見積額より残高が多い場合は、超過額だけ引当金を減らし、その分を収益である貸倒引当金戻入として処理する。引当金を借方で¥4,000減らすと残高が見積額の¥16,000に一致する。残高全額を戻し入れると引当金がゼロになってしまい、必要な見積額が計上されない。処理しないままでは負債性の評価勘定が過大に残る。

  - id: BK-2-05-003
    topic_id: BK-2-05-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      前期に発生した売掛金¥30,000が貸倒れとなった。貸倒引当金の残高は¥50,000である。正しい仕訳はどれか。
    choices:
      - "（借）貸倒損失 30,000 ／（貸）売掛金 30,000"
      - "（借）貸倒引当金繰入 30,000 ／（貸）売掛金 30,000"
      - "（借）売掛金 30,000 ／（貸）貸倒引当金 30,000"
      - "（借）貸倒引当金 30,000 ／（貸）売掛金 30,000"
    answer: 3
    explanation: |
      貸倒引当金は前期末に存在した債権が貸し倒れる可能性に備えて設定したものなので、前期発生の売掛金が実際に貸倒れとなった場合は、まず引当金を取り崩して充当する。残高¥50,000で足りているため貸倒損失は生じない。貸倒引当金繰入は決算で引当金を設定するときの費用科目であり、貸倒れ発生時には使わない。

  - id: BK-2-05-004
    topic_id: BK-2-05-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      前期に発生した売掛金¥60,000が貸倒れとなった。貸倒引当金の残高は¥50,000である。正しい仕訳はどれか。
    choices:
      - "（借）貸倒引当金 50,000・貸倒引当金繰入 10,000 ／（貸）売掛金 60,000"
      - "（借）貸倒引当金 50,000・貸倒損失 10,000 ／（貸）売掛金 60,000"
      - "（借）貸倒引当金 60,000 ／（貸）売掛金 60,000"
      - "（借）貸倒損失 60,000 ／（貸）売掛金 60,000"
    answer: 1
    explanation: |
      まず引当金の残高¥50,000を上限として充当し、それでも不足する¥10,000は当期の費用である貸倒損失とする。引当金を残高以上に取り崩すと引当金がマイナスになってしまうので誤り。全額を貸倒損失とすると、せっかく設定した引当金が使われないまま残る。不足分に貸倒引当金繰入を使うのも誤りで、繰入は決算での設定時に用いる科目である。

  - id: BK-2-05-005
    topic_id: BK-2-05-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      当期に発生した売掛金¥40,000が貸倒れとなった。貸倒引当金の残高は¥50,000ある。正しい仕訳はどれか。
    choices:
      - "（借）貸倒引当金繰入 40,000 ／（貸）売掛金 40,000"
      - "（借）貸倒損失 40,000 ／（貸）売掛金 40,000"
      - "（借）貸倒引当金 40,000 ／（貸）売掛金 40,000"
      - "（借）貸倒引当金 40,000・貸倒損失 40,000 ／（貸）売掛金 80,000"
    answer: 1
    explanation: |
      貸倒引当金は前期末に存在していた債権を対象に設定されたものなので、当期に発生した売掛金の貸倒れには充当できない。引当金の残高が十分にあっても、全額を当期の費用である貸倒損失として処理する。引当金残高の有無ではなく、貸し倒れた債権がいつ発生したものかで判断する点が最大のポイント。

  - id: BK-2-05-006
    topic_id: BK-2-05-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      前期に貸倒れとして処理した売掛金¥25,000について、当期になって現金で回収することができた。正しい仕訳はどれか。
    choices:
      - "（借）現金 25,000 ／（貸）売掛金 25,000"
      - "（借）現金 25,000 ／（貸）貸倒引当金 25,000"
      - "（借）現金 25,000 ／（貸）貸倒損失 25,000"
      - "（借）現金 25,000 ／（貸）償却債権取立益 25,000"
    answer: 3
    explanation: |
      前期に貸倒処理をした時点で売掛金は帳簿から消えているので、回収してももはや減らすべき売掛金は存在しない。予期していなかった回収なので、償却債権取立益という収益で処理する。前期の費用である貸倒損失を当期に取り消すと、期間ごとの損益が正しく計算されない。

  - id: BK-2-05-007
    topic_id: BK-2-05-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      貸倒引当金を設定する対象となるものとして、最も適切なものはどれか。
    choices:
      - "売掛金や電子記録債権などの債権"
      - "買掛金や電子記録債務などの債務"
      - "期末に保有する商品"
      - "得意先から受け取った前受金"
    answer: 0
    explanation: |
      貸倒引当金は、保有する債権が将来回収できなくなる可能性に備えるものなので、対象は売掛金や電子記録債権といった債権である。買掛金や電子記録債務は当社が支払う側の債務であり、貸し倒れるという概念がない。商品は評価の問題であって貸倒れではなく、前受金は負債なので対象外。

  - id: BK-2-05-008
    topic_id: BK-2-05-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      貸倒引当金の貸借対照表における表示方法として正しいものはどれか。
    choices:
      - "費用であるため、損益計算書にのみ表示する"
      - "純資産の部に表示する"
      - "売掛金などの債権から控除する形式で、資産の部に表示する"
      - "支払義務があるため、負債の部に表示する"
    answer: 2
    explanation: |
      貸倒引当金は債権の回収不能見込額を表す評価勘定であり、対象となる債権の金額から控除する形で資産の部に表示する。これにより回収が見込まれる正味の金額が読み取れる。名前に「引当金」とあっても外部への支払義務ではないので負債ではない。損益計算書に載るのは貸倒引当金繰入という費用のほうである。

