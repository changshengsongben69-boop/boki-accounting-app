# BK-1-04
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-1-04-01, BK-1-04-02
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-1-04-01

questions:
  - id: BK-1-04-001
    topic_id: BK-1-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      主要簿に該当する帳簿の組合せとして正しいものはどれか。
    choices:
      - "売掛金元帳と買掛金元帳"
      - "仕入帳と売上帳"
      - "仕訳帳と総勘定元帳"
      - "現金出納帳と当座預金出納帳"
    answer: 2
    explanation: |
      すべての取引が必ず記入される帳簿が主要簿であり、仕訳帳と総勘定元帳の2つを指す。それ以外はいずれも補助簿であり、主要簿の記録を補うために必要に応じて設けられる。主要簿がなければ財務諸表は作成できないが、補助簿は設けなくても決算はできる、という関係を押さえる。

  - id: BK-1-04-002
    topic_id: BK-1-04-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      補助簿のうち、補助元帳に分類されるものはどれか。
    choices:
      - "売掛金元帳"
      - "当座預金出納帳"
      - "仕入帳"
      - "小口現金出納帳"
    answer: 0
    explanation: |
      補助簿は、特定の取引の明細を発生順に記録する補助記入帳と、特定の勘定の内訳を相手先や種類ごとに記録する補助元帳に分かれる。売掛金元帳は得意先ごとの内訳を示すので補助元帳。当座預金出納帳・仕入帳・小口現金出納帳はいずれも取引を発生順に記録する補助記入帳である。商品有高帳も補助元帳に分類される。

  - id: BK-1-04-003
    topic_id: BK-1-04-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      「商品¥50,000を掛けで仕入れた」という取引が記入される補助簿の組合せとして正しいものはどれか。
    choices:
      - "仕入帳・売掛金元帳・商品有高帳"
      - "仕入帳・現金出納帳"
      - "買掛金元帳のみ"
      - "仕入帳・買掛金元帳・商品有高帳"
    answer: 3
    explanation: |
      仕入取引なので仕入帳、代金が掛けなので仕入先ごとの内訳を記録する買掛金元帳、商品が増えるので商品有高帳に記入する。売掛金元帳は得意先に対する債権の帳簿なので関係がない。現金は動いていないので現金出納帳にも記入しない。ひとつの取引が複数の補助簿に記入される点がポイント。

  - id: BK-1-04-004
    topic_id: BK-1-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      仕訳帳から総勘定元帳への転記についての説明として正しいものはどれか。
    choices:
      - "決算のときにまとめて一度だけ行う"
      - "仕訳の借方科目は総勘定元帳の当該勘定の借方へ、貸方科目は貸方へ、同じ金額で書き移す"
      - "仕訳の借方科目は総勘定元帳の当該勘定の貸方へ書き移す"
      - "金額の大きい側だけを書き移せばよい"
    answer: 1
    explanation: |
      転記とは、仕訳帳に記入した内容を勘定科目ごとに総勘定元帳へ書き移す作業である。借方は借方、貸方は貸方へ、金額もそのまま移す。左右を入れ替えたり片側だけを転記したりすると、試算表の貸借が一致しなくなる。転記は取引のつど行うのが原則で、決算時にまとめて行うものではない。

  - id: BK-1-04-005
    topic_id: BK-1-04-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      補助簿を設ける目的として最も適切なものはどれか。
    choices:
      - "総勘定元帳に代えて財務諸表を作成するため"
      - "仕訳帳への記入を省略するため"
      - "税務署へ提出することが法律で義務づけられているため"
      - "総勘定元帳の勘定だけでは分からない明細を記録し、管理に役立てるため"
    answer: 3
    explanation: |
      総勘定元帳の売掛金勘定を見ても得意先ごとの残高までは分からない。そこで補助簿を設けて明細を記録し、回収管理や在庫管理に役立てる。補助簿は主要簿の代わりにはならず、補助簿を設けても仕訳帳への記入は必要である。設けるかどうかは企業が管理上の必要に応じて決める。

  - id: BK-1-04-006
    topic_id: BK-1-04-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      仕訳帳の役割として正しいものはどれか。
    choices:
      - "各勘定の残高を記録する"
      - "取引を発生順に日付順で記録する"
      - "試算表を作成するための補助帳である"
      - "決算整理仕訳を記入するためだけの帳簿である"
    answer: 1
    explanation: |
      仕訳帳はすべての取引を発生順に記録する帳簿であり、これをもとに総勘定元帳への転記を行う。各勘定の残高は総勘定元帳で管理し、試算表はそこから作成する。決算整理仕訳も仕訳帳に記入できるが、それだけのための帳簿ではない。

  - id: BK-1-04-007
    topic_id: BK-1-04-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      売掛金元帳に記入される取引はどれか。
    choices:
      - "掛けで販売した売上"
      - "現金で受け取った家賃"
      - "借入金の返済"
      - "従業員への給料支払い"
    answer: 0
    explanation: |
      売掛金元帳は得意先ごとの掛け販売や回収の明細を記録する補助元帳である。現金で受け取った家賃や借入金の返済、給料支払いは売掛金とは無関係であり、別の勘定や補助簿で処理する。

  - id: BK-1-04-008
    topic_id: BK-1-04-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      補助簿の補助元帳に分類されるものとして正しいものはどれか。
    choices:
      - "現金出納帳"
      - "仕入帳"
      - "売掛金元帳"
      - "仕訳帳"
    answer: 2
    explanation: |
      補助元帳は特定の勘定の内訳を管理する帳簿であり、売掛金元帳は得意先別の売掛金を記録するために使われる。現金出納帳や仕入帳は補助記入帳であり、仕訳帳は主要簿である。

