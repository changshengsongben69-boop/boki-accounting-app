# BK-3-01
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-3-01
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-3-01

questions:
  - id: BK-3-01-001
    topic_id: BK-3-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      試算表を作成する主たる目的として正しいものはどれか。
    choices:
      - "取引先ごとの債権残高を管理するため"
      - "税務署へ提出するため"
      - "仕訳帳から総勘定元帳への転記が正しく行われたかを検証するため"
      - "当期純利益を確定させるため"
    answer: 2
    explanation: |
      貸借平均の原理により、正しく仕訳・転記されていれば借方合計と貸方合計は一致する。試算表はこれを利用して記帳の正確性を検証するために作成する。当期純利益が確定するのは決算整理を経た後であり、取引先ごとの管理は補助元帳の役割。試算表そのものは外部に提出する書類ではない。

  - id: BK-3-01-002
    topic_id: BK-3-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      合計試算表・残高試算表・合計残高試算表の違いについての説明として正しいものはどれか。
    choices:
      - "合計試算表は各勘定の借方合計と貸方合計を、残高試算表は各勘定の残高を集計し、合計残高試算表は両方を1つの表にまとめたものである"
      - "合計試算表は決算整理後、残高試算表は決算整理前に作成する"
      - "残高試算表だけが貸借一致し、合計試算表は一致しない"
      - "3つとも集計する金額は同じで、名称が違うだけである"
    answer: 0
    explanation: |
      合計試算表は各勘定の借方・貸方それぞれの合計額を集めた表、残高試算表は各勘定の残高（借方合計と貸方合計の差額）を集めた表であり、合計残高試算表は両者を左右に並べたものである。集計する金額は異なるが、いずれも貸借は一致する。作成時期の違いによる区別ではない。

  - id: BK-3-01-003
    topic_id: BK-3-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      試算表の借方合計と貸方合計が一致していても発見できない誤りはどれか。
    choices:
      - "売掛金¥50,000の借方転記を忘れていた"
      - "現金の貸方に記入すべき¥30,000を借方に記入していた"
      - "買掛金の金額を貸方に¥8,000多く転記していた"
      - "仕入の金額を、誤って消耗品費の勘定に転記していた"
    answer: 3
    explanation: |
      誤った勘定科目に転記しても、借方に記入した合計額は変わらないため貸借は一致したままとなり、試算表では発見できない。同様に、取引全体の記帳もれや二重記帳も発見できない。これに対し、片側だけの転記もれ、貸借の逆記入、片側だけの金額誤りは合計額が崩れるので発見できる。試算表は万能の検証手段ではない点が問われる。

  - id: BK-3-01-004
    topic_id: BK-3-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      残高試算表において、通常は借方に残高が記載される勘定の組合せとして正しいものはどれか。
    choices:
      - "未払金・繰越利益剰余金・受取手数料"
      - "繰越商品・備品・仕入"
      - "買掛金・資本金・売上"
      - "貸倒引当金・減価償却累計額・受取利息"
    answer: 1
    explanation: |
      資産と費用は借方に増加・発生を記入するので借方残高となる。繰越商品と備品は資産、仕入は費用なのでいずれも借方残高。負債・純資産・収益は貸方残高であり、貸倒引当金や減価償却累計額も資産の控除を表す評価勘定なので貸方に残高が立つ。

  - id: BK-3-01-005
    topic_id: BK-3-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      決算整理前残高試算表についての説明として正しいものはどれか。
    choices:
      - "当期純利益がすでに計上されている"
      - "期中の取引だけを集計したものであり、決算整理の内容は反映されていない"
      - "決算整理をすべて終えた後の残高を集計したものである"
      - "そのまま貸借対照表と損益計算書を作成できる"
    answer: 1
    explanation: |
      決算整理前残高試算表は、期中に記帳した取引の結果だけを示している。そのため売上原価は算定されておらず、減価償却も貸倒引当金の設定も費用の見越し・繰延べも未処理である。ここに決算整理を加えてはじめて正しい期間損益が計算できる。繰越商品の残高が期首商品有高のままである点が、その代表例である。

  - id: BK-3-01-006
    topic_id: BK-3-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算整理前残高試算表の繰越商品¥50,000が意味するものとして正しいものはどれか。
    choices:
      - "期末の商品有高"
      - "当期の商品仕入高"
      - "当期の売上原価"
      - "期首の商品有高"
    answer: 3
    explanation: |
      3分法では期中に商品を仕入れても仕入勘定に記入するだけで繰越商品勘定は動かない。したがって決算整理前の繰越商品の残高は、前期から繰り越されてきた期首商品有高をそのまま示している。期末商品有高が繰越商品勘定に載るのは、決算整理でいわゆる「しーくり・くりしー」の振替を行った後である。

  - id: BK-3-01-007
    topic_id: BK-3-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    preformatted: true
    question: |
      次は当月の売掛金勘定の記入である。

      【売掛金】
      （借方）前月繰越 300,000 ／ 売上 850,000
      （貸方）普通預金 620,000 ／ 売上（返品） 40,000

      月末に作成する合計残高試算表の売掛金の行の記載として、正しいものはどれか。
    choices:
      - "借方合計 1,150,000／貸方合計 660,000／借方残高 490,000"
      - "借方合計 1,150,000／貸方合計 660,000／貸方残高 490,000"
      - "借方合計 850,000／貸方合計 660,000／借方残高 190,000"
      - "借方合計 1,150,000／貸方合計 620,000／借方残高 530,000"
    answer: 0
    explanation: |
      借方合計は前月繰越300,000と掛売上850,000の合計で1,150,000円。貸方合計は回収620,000と
      返品40,000の合計で660,000円。差額490,000円が借方残高となる。
      前月繰越を借方合計に含め忘れると190,000円、返品を貸方に入れ忘れると530,000円になる。
      売掛金は資産なので、残高は借方に生じる。

  - id: BK-3-01-008
    topic_id: BK-3-01
    exams: [nissho]
