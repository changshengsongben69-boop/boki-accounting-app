    preformatted: true
    question: |
      決算整理前残高試算表の金額は次のとおりで、資本金だけが空欄になっている。

      （借方）現金 96,000／普通預金 800,000／売掛金 800,000／繰越商品 50,000／備品 600,000／
      　　　　仕入 1,200,000／支払家賃 240,000／支払保険料 120,000／給料 500,000
      （貸方）買掛金 400,000／借入金 300,000／貸倒引当金 6,000／備品減価償却累計額 240,000／
      　　　　資本金 （　？　）／繰越利益剰余金 200,000／売上 2,200,000／受取手数料 60,000

      空欄に入る資本金の金額として正しいものはどれか。
    choices:
      - "1,000,000円"
      - "800,000円"
      - "1,200,000円"
      - "1,406,000円"
    answer: 0
    explanation: |
      借方合計は4,406,000円。貸方のうち資本金以外の合計は
      400,000＋300,000＋6,000＋240,000＋200,000＋2,200,000＋60,000＝3,406,000円。
      試算表は貸借平均の原理により必ず一致するので、差額の1,000,000円が資本金となる。
      1項目が不明でも差額で求められる点が、試算表の構造を理解しているかを測る。

  - id: BK-3-01-009
    topic_id: BK-3-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    preformatted: true
    question: |
      残高試算表を作成したところ貸借が一致せず、借方合計が貸方合計より18,000円多かった。
      原因として考えられるものはどれか。
    choices:
      - "買掛金9,000円を貸方に転記すべきところ、誤って借方に転記していた"
      - "売掛金9,000円の借方への転記を忘れていた"
      - "仕入18,000円を誤って消耗品費の勘定に転記していた"
      - "現金18,000円を受け取った取引を、まったく記帳していなかった"
    answer: 0
    explanation: |
      貸方に記入すべき9,000円を借方に記入すると、借方が9,000円増え貸方が9,000円減るので、
      差は倍の18,000円になる。差額の半分にあたる金額を探すのが、この誤りを見つける定石。
      借方への転記もれは借方が不足するので、借方が多くなる原因にはならない。
      科目の取り違えや取引全体の記帳もれは、借方と貸方が同額動くため差額は生じず、
      試算表では発見できない。

  - id: BK-3-01-010
    topic_id: BK-3-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    preformatted: true
    question: |
      合計試算表における現金の借方合計は840,000円、貸方合計は744,000円であった。
      同じ日付で作成する残高試算表の現金の記載として、正しいものはどれか。
    choices:
      - "借方に96,000円"
      - "貸方に96,000円"
      - "借方に1,584,000円"
      - "借方に840,000円"
    answer: 0
    explanation: |
      残高試算表には各勘定の借方合計と貸方合計の差額だけを、残高が生じる側に記載する。
      840,000−744,000＝96,000円で、資産である現金は借方残高となる。
      1,584,000円は借方合計と貸方合計を足したもので、いずれの試算表の金額でもない。
      合計試算表は取引量を、残高試算表は現在有高を示す、という役割の違いを押さえる。

  - id: BK-3-01-011
    topic_id: BK-3-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
