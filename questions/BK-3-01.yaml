    preformatted: true
    question: |
      次の資料から、当月末の合計試算表における買掛金の貸方合計を求めるとどうなるか。

      【資料】
      前月繰越（貸方） 250,000
      当月の掛仕入 700,000
      当月の買掛金の支払 480,000
      当月の仕入戻し 30,000
    choices:
      - "950,000円"
      - "700,000円"
      - "440,000円"
      - "1,180,000円"
    answer: 0
    explanation: |
      買掛金は負債なので、増加要因である前月繰越250,000円と掛仕入700,000円が貸方に記入され、
      貸方合計は950,000円となる。支払480,000円と仕入戻し30,000円は減少要因なので借方に入り、
      借方合計は510,000円。差引440,000円は「貸方残高」であって「貸方合計」ではない。
      合計を問われているのか残高を問われているのかを読み違えないこと。

