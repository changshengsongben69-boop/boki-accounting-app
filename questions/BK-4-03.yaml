# BK-4-03
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-4-03-01, BK-4-03-02
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-4-03-02

questions:
  - id: BK-4-03-001
    topic_id: BK-4-03-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      繰越利益剰余金についての説明として正しいものはどれか。
    choices:
      - "配当のために現金を別に取り分けておく資産の勘定である"
      - "過年度からの利益の留保額を表す純資産の勘定で、株主総会の決議により配当などに充てられる"
      - "当期に生じた収益を集計した収益の勘定である"
      - "株主から払い込まれた出資額を表す勘定である"
    answer: 1
    explanation: |
      繰越利益剰余金は、稼いだ利益のうち社外に配当されずに会社内部に留保されている金額を表す純資産の勘定である。処分は株主総会の決議によって決まる。株主からの出資額は資本金であり、区別すること。また純資産の勘定であって現金そのものを表すわけではないため、残高があっても同額の現金があるとは限らない。

  - id: BK-4-03-002
    topic_id: BK-4-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      剰余金の配当にあたり利益準備金を積み立てる理由として、最も適切なものはどれか。
    choices:
      - "株主に対する配当金を増やすため"
      - "法人税の納付額を減らすため"
      - "配当のための現金を確保する義務があるため"
      - "会社財産の社外流出を一定範囲にとどめ、債権者を保護するために会社法で積立てが求められているため"
    answer: 3
    explanation: |
      株式会社では株主が有限責任であるため、会社財産が債権者にとって唯一の引当てとなる。そこで会社法は、配当を行う際に一定額を利益準備金として積み立て、社外流出に歯止めをかけることを求めている。積立ては純資産の中での振替にすぎず、現金が拘束されるわけでも税額が減るわけでもない。積み立てた分だけ配当可能な額はむしろ減る。

  - id: BK-4-03-003
    topic_id: BK-4-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      利益準備金はどの勘定科目に振り替えられるか。
    choices:
      - "繰越利益剰余金"
      - "資本金"
      - "資本準備金"
      - "未払配当金"
    answer: 2
    explanation: |
      利益準備金は会社法により資本準備金に振り替えられる。会社法上、資本準備金は資本金に準ずる純資産の一部として扱われ、剰余金の配当可能額を制限する効果がある。繰越利益剰余金は振替元の勘定であり、未払配当金は負債勘定である。

  - id: BK-4-03-004
    topic_id: BK-4-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      利益準備金の積立て後、会社の純資産合計はどうなるか。
    choices:
      - "増加する"
      - "減少する"
      - "変わらない"
      - "負債が増える"
    answer: 2
    explanation: |
      利益準備金の積立ては、剰余金の一部を資本準備金に振り替える純資産内の振替であるため、純資産合計は変わらない。これは資本と剰余の内部移動であって、外部財産の増減を意味しない。

  - id: BK-4-03-005
    topic_id: BK-4-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      利益準備金を積み立てることで、会社法上の何が保護されるか。
    choices:
      - "株主の配当額"
      - "会社財産の社外流出"
      - "法人税の税額"
      - "資本準備金の額"
    answer: 1
    explanation: |
      利益準備金は、配当などによる会社財産の社外流出を一定範囲にとどめ、債権者を保護するための制度である。税額そのものを減らすものではない。株主の配当額はむしろ制限される。 

  - id: BK-4-03-006
    topic_id: BK-4-03-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      利益準備金の積立額が30,000円の場合、振り替えの相手勘定はどれか。
    choices:
      - "繰越利益剰余金"
      - "資本金"
      - "普通預金"
      - "未払配当金"
    answer: 0
    explanation: |
      利益準備金として積み立てるときは、繰越利益剰余金を減少させて資本準備金を増加させる。資本金や普通預金、未払配当金はこの振替仕訳の相手勘定にならない。

  - id: BK-4-03-007
    topic_id: BK-4-03-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      会社法で利益準備金は原則として剰余金の何分の一を積み立てることになっているか。
    choices:
      - "1/10"
      - "1/4"
      - "1/2"
      - "1/20"
    answer: 0
    explanation: |
      利益準備金は原則として剰余金の1/10を積み立てる。3級ではこの規定を理解し、利益準備金の積立ては一定割合の剰余金を内部留保に振り替えることだと押さえる。

  - id: BK-4-03-008
    topic_id: BK-4-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      利益準備金を積み立てる仕訳として正しいものはどれか。
    choices:
      - "（借）繰越利益剰余金 ／ （貸）資本準備金"
      - "（借）資本準備金 ／ （貸）繰越利益剰余金"
      - "（借）普通預金 ／ （貸）資本金"
      - "（借）繰越利益剰余金 ／ （貸）未払配当金"
    answer: 0
    explanation: |
      利益準備金の積立てでは、繰越利益剰余金を減少（借方）させ、資本準備金を増加（貸方）させる仕訳を行う。これは純資産内の振替である。

