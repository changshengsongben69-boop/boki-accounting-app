# リース — 仕訳入力形式（企業会計基準第34号・2027年度〜）
#
# 本アプリは2027年度以降の合格を目的とする受験者向け。旧基準（企業会計基準第13号）を
# 学習対象とする問題は作らない。ただし旧基準の科目（リース資産・リース債務）は、
# 実際に混同されるため誤答の候補としては使う。
#
# 根拠: 商工会議所簿記検定試験出題区分表 改定趣旨の説明書（2026年7月31日）
#       企業会計基準第34号・適用指針第33号
#
# 数値は説明書に掲載された公式の仕訳例に準拠している。
#   リース期間5年 / リース料 年額800,000円（後払い） / 利息相当額 400,000円
#   利子抜き法 → 使用権資産 3,600,000円、支払利息 80,000円/年
#   利子込み法 → 使用権資産 4,000,000円
#
# format: journal。answer.debit / answer.credit は順不同で採点される。
# accounts は候補（4つ程度）。誤答候補には実際に混同されるものを置く。

format: journal
topic_default: BK-2-15-01

questions:

  - id: BK-2-15-01-J01
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 2
    rows: 2
    accounts: [使用権資産, リース負債, リース資産, リース債務]
    question: |
      期首にリースにより営業用のトラックを調達し、使用を開始した。リース期間は5年、
      リース料は年額800,000円（後払い）、利息相当額は400,000円である。
      利子抜き法による場合の、リース開始時の仕訳を示しなさい。
    answer:
      debit:
        - {account: 使用権資産, amount: 3600000}
      credit:
        - {account: リース負債, amount: 3600000}
    explanation: |
      リース料総額 800,000円 × 5年 ＝ 4,000,000円。利子抜き法では、ここから利息
      相当額400,000円を控除した3,600,000円を使用権資産およびリース負債として計上する。

      勘定科目に注意。企業会計基準第34号では「使用権資産」「リース負債」を用いる。
      「リース資産」「リース債務」は旧基準（第13号）の科目であり、2027年度以降は
      標準・許容のいずれの勘定科目表にも存在しないため誤りとなる。

  - id: BK-2-15-01-J02
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 2
    rows: 2
    accounts: [使用権資産, リース負債, 支払利息, 支払リース料]
    question: |
      期首にリースにより営業用のトラックを調達し、使用を開始した。リース期間は5年、
      リース料は年額800,000円（後払い）、利息相当額は400,000円である。
      利子込み法による場合の、リース開始時の仕訳を示しなさい。
    answer:
      debit:
        - {account: 使用権資産, amount: 4000000}
      credit:
        - {account: リース負債, amount: 4000000}
    explanation: |
      利子込み法では利息相当額を控除せず、リース料総額4,000,000円をそのまま
      使用権資産およびリース負債の金額とする。

      開始時に利息相当額を支払利息や前払利息として計上することはしない。
      利子込み法では支払時にも利息を区分せず、リース負債を800,000円ずつ減額していく。

  - id: BK-2-15-01-J03
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 3
    rows: 3
    accounts: [リース負債, 支払利息, 普通預金, 支払リース料]
    question: |
      リース期間5年、リース料は年額800,000円（後払い）、利息相当額400,000円の
      リースについて、利子抜き法により処理している。利息相当額の各期間への配分は
      定額法により、当期に生じた利息はリース料の支払時に計上する。
      第1回のリース料を普通預金口座から支払ったときの仕訳を示しなさい。
    answer:
      debit:
        - {account: リース負債, amount: 720000}
        - {account: 支払利息, amount: 80000}
      credit:
        - {account: 普通預金, amount: 800000}
    explanation: |
      支払利息 ＝ 400,000円 ÷ 5年 ＝ 80,000円。
      リース負債の減少額 ＝ 800,000円 − 80,000円 ＝ 720,000円。

      リース負債の減少額は、使用権資産の計上額3,600,000円を5年で割った額と一致する。
      検算に使える。

      「支払リース料」は賃貸借処理する場合の科目であり、オンバランスしたリースの
      支払には用いない。

  - id: BK-2-15-01-J04
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 2
    rows: 2
    accounts: [減価償却費, 使用権資産減価償却累計額, 使用権資産, リース負債]
    question: |
      リースにより計上した使用権資産3,600,000円について、決算にあたり減価償却を行う。
      耐用年数5年、残存価額ゼロの定額法により、記帳方法は間接法による。
      この仕訳を示しなさい。
    answer:
      debit:
        - {account: 減価償却費, amount: 720000}
      credit:
        - {account: 使用権資産減価償却累計額, amount: 720000}
    explanation: |
      減価償却費 ＝ 3,600,000円 ÷ 5年 ＝ 720,000円。

      記帳方法が間接法であるため、貸方は「使用権資産減価償却累計額」を用いる。
      直接法であれば貸方は「使用権資産」となるが、本問は間接法の指定がある。

  - id: BK-2-15-02-J01
    topic_id: BK-2-15-02
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 2
    rows: 2
    accounts: [支払リース料, 支払家賃, 現金, 使用権資産]
    question: |
      事務所用のスペースの家賃90,000円を現金で支払った。当該家賃は短期の賃貸借契約に
      おける月額であり、短期リースに該当するため賃貸借として処理する。
      この仕訳を示しなさい。
    answer:
      debit:
        - {account: 支払リース料, amount: 90000}
      credit:
        - {account: 現金, amount: 90000}
    explanation: |
      短期リース（リース期間が12か月以内で、かつ購入オプションを含まないもの）は
      オンバランスせず賃貸借処理を行うことが容認されている（適用指針第20項）。

      勘定科目に注意。2級以上では、不動産の賃借を賃貸借処理する場合であっても
      支払家賃勘定を用いず「支払リース料」勘定に統一される。支払家賃は3級の範囲で
      用いる科目である。

  - id: BK-2-15-01-J05
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 3
    rows: 3
    accounts: [リース負債, 支払利息, 普通預金, 使用権資産]
    question: |
      リース期間5年、リース料は年額800,000円（後払い）、利息相当額400,000円の
      リースについて、利子込み法により処理している。
      第1回のリース料を普通預金口座から支払ったときの仕訳を示しなさい。
    answer:
      debit:
        - {account: リース負債, amount: 800000}
      credit:
        - {account: 普通預金, amount: 800000}
    explanation: |
      利子込み法では、支払ったリース料を元本部分と利息部分に区分しない。
      支払額800,000円をそのままリース負債の減少として処理する。

      利子抜き法であれば「リース負債720,000／支払利息80,000」と分けるが、
      利子込み法では支払利息を計上しない。開始時にリース負債を4,000,000円
      （利息相当額を含んだ総額）で計上しているため、利息はすでに負債に
      織り込まれているからである。
