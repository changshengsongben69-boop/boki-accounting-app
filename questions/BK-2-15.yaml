# リース（企業会計基準第34号ベース・2027年度〜）
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版、2026年7月31日最終制定）
#       改定趣旨の説明書「15.リース」および同「18.収益と費用」
#       企業会計基準第34号「リースに関する会計基準」
#       企業会計基準適用指針第33号「リースに関する会計基準の適用指針」
#
# 数値例は改定趣旨の説明書に掲載された公式の仕訳例に準拠している。
# 2027年4月1日以後開始する事業年度から強制適用。

topic_default: BK-2-15-01

questions:
  - id: BK-2-15-01-001
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 1
    question: |
      新しいリース会計基準における借手のリース開始時の処理として、計上される
      勘定科目の組合せとして正しいものはどれか。
    choices:
      - リース資産 と リース債務
      - 使用権資産 と リース負債
      - 使用権資産 と リース債務
      - リース資産 と リース負債
    answer: 1
    explanation: |
      正解は「使用権資産 と リース負債」。

      企業会計基準第34号では、借手はリースの定義を満たすものについて基本的に
      オンバランス化が求められ、借りている物件を使用する権利を「使用権資産」、
      リース料を支払う義務を「リース負債」として計上する。

      「リース資産 と リース債務」は企業会計基準第13号（旧基準）における
      ファイナンス・リース取引の勘定科目であり、2026年度までの正解。2027年度
      以降は誤りとなる。過去問を解く際は年度に注意すること。
      残る2つは新旧の勘定科目を混在させたもので、いずれも誤り。

  - id: BK-2-15-01-002
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 2
    question: |
      当社は期首にリースによって営業用のトラックを調達し、使用を開始した。
      リース期間は5年、リース料は年額800,000円（後払い）、利息相当額は
      400,000円である。利子抜き法による場合、リース開始時に計上する使用権資産
      の金額はいくらか。
    choices:
      - 800,000円
      - 3,600,000円
      - 4,000,000円
      - 4,400,000円
    answer: 1
    explanation: |
      正解は3,600,000円。

      利子抜き法では、リース料総額から利息相当額を控除した金額で使用権資産と
      リース負債を計上する。
        リース料総額 800,000円 × 5年 = 4,000,000円
        4,000,000円 − 利息相当額 400,000円 = 3,600,000円

      4,000,000円はリース料総額そのものであり、これは利子込み法による場合の
      計上額。設問は利子抜き法を指定しているため誤り。
      800,000円は1年分のリース料にすぎない。
      4,400,000円はリース料総額に利息相当額を加算したもので、計算方向が逆。

  - id: BK-2-15-01-003
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 3
    question: |
      リース期間5年、リース料年額800,000円（後払い）、利息相当額400,000円の
      リースについて、利子抜き法により処理し、利息相当額の各期間への配分は
      定額法による。当期に生じた利息はリース料の支払時に計上する。
      第1回のリース料を現金預金から支払ったときの仕訳として正しいものはどれか。
    choices:
      - (借) 支払リース料 800,000 ／ (貸) 現金預金 800,000
      - (借) リース負債 800,000 ／ (貸) 現金預金 800,000
      - (借) リース負債 720,000、支払利息 80,000 ／ (貸) 現金預金 800,000
      - (借) リース負債 640,000、支払利息 160,000 ／ (貸) 現金預金 800,000
    answer: 2
    explanation: |
      正解は「(借) リース負債 720,000、支払利息 80,000 ／ (貸) 現金預金 800,000」。

      利子抜き法では、支払ったリース料を元本部分と利息部分に分けて処理する。
      利息相当額の各期間への配分を定額法によるため、
        支払利息 = 400,000円 ÷ 5年 = 80,000円
        リース負債の減少 = 800,000円 − 80,000円 = 720,000円
      となる。リース負債の減少額は、使用権資産の計上額3,600,000円を5年で
      割った額と一致する。

      1番目は賃貸借処理の仕訳であり、オンバランスしたリースには用いない。
      2番目は利子込み法による場合の仕訳。利子込み法では支払利息を区分しない。
      4番目は利息相当額の配分額が誤っている。

  - id: BK-2-15-01-004
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 2
    question: |
      リースにより計上した使用権資産3,600,000円について、決算にあたり減価償却を
      行う。耐用年数5年、残存価額ゼロの定額法、記帳方法は間接法による場合の
      仕訳として正しいものはどれか。
    choices:
      - (借) 減価償却費 720,000 ／ (貸) 使用権資産 720,000
      - (借) 減価償却費 720,000 ／ (貸) 使用権資産減価償却累計額 720,000
      - (借) 減価償却費 800,000 ／ (貸) 使用権資産減価償却累計額 800,000
      - (借) 支払リース料 720,000 ／ (貸) 使用権資産減価償却累計額 720,000
    answer: 1
    explanation: |
      正解は「(借) 減価償却費 720,000 ／ (貸) 使用権資産減価償却累計額 720,000」。

      減価償却費 = 3,600,000円 ÷ 5年 = 720,000円。記帳方法が間接法であるため、
      貸方は「使用権資産減価償却累計額」となる。

      1番目は直接法の仕訳であり、設問が間接法を指定しているため誤り。
      3番目の800,000円は利子込み法により使用権資産を4,000,000円で計上した場合の
      減価償却費であり、本問の条件とは合わない。
      4番目は借方科目が誤り。減価償却の計上に支払リース料勘定は用いない。

  - id: BK-2-15-01-005
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 2
    question: |
      リース期間5年、リース料年額800,000円（後払い）、利息相当額400,000円の
      リースについて、利子込み法によった場合のリース開始時の仕訳として正しい
      ものはどれか。
    choices:
      - (借) 使用権資産 3,600,000 ／ (貸) リース負債 3,600,000
      - (借) 使用権資産 4,000,000 ／ (貸) リース負債 4,000,000
      - (借) 使用権資産 4,000,000 ／ (貸) リース負債 3,600,000、前払利息 400,000
      - (借) 使用権資産 3,600,000、支払利息 400,000 ／ (貸) リース負債 4,000,000
    answer: 1
    explanation: |
      正解は「(借) 使用権資産 4,000,000 ／ (貸) リース負債 4,000,000」。

      利子込み法では、利息相当額を控除せず、リース料総額をそのまま使用権資産と
      リース負債の金額とする。800,000円 × 5年 = 4,000,000円。

      1番目は利子抜き法による金額。
      3番目・4番目のように、開始時に利息相当額を前払利息や支払利息として計上する
      処理は行わない。利子込み法では、支払時にも利息を区分せず、リース負債を
      800,000円ずつ減額していく。

  - id: BK-2-15-01-006
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 3
    question: |
      企業会計基準第34号における借手側のリースの分類に関する記述として、
      正しいものはどれか。
    choices:
      - ファイナンス・リースとオペレーティング・リースに区分し、前者のみを資産計上する
      - ファイナンス・リースとオペレーティング・リースの区分は行わない
      - 所有権移転ファイナンス・リースのみを資産計上する
      - すべてのリースについて例外なく資産計上する
    answer: 1
    explanation: |
      正解は「ファイナンス・リースとオペレーティング・リースの区分は行わない」。

      新しいリース会計基準において借手側では、これまでのファイナンス・リース取引と
      オペレーティング・リース取引との区分がなくなり、リースの定義を満たすものは
      基本的にオンバランス化が求められる。

      1番目・3番目は企業会計基準第13号（旧基準）における借手の取扱いであり、
      2026年度までの正解。
      4番目は「例外なく」が誤り。短期リースおよび少額リースについては、
      オンバランスせず賃貸借処理を行うことが容認されている。
      なお、**貸手側では新基準においてもファイナンス・リースとオペレーティング・
      リースの区分が残されている**点に注意すること（区分が消えたのは借手側のみ）。

  - id: BK-2-15-02-001
    topic_id: BK-2-15-02
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 2
    question: |
      短期リースとして、オンバランスせず賃貸借処理を行うことが容認される
      リースの要件として正しいものはどれか。
    choices:
      - リース期間が12か月以内であること
      - リース期間が12か月以内であり、かつ購入オプションを含まないこと
      - リース期間が12か月以内であり、かつリース料総額が少額であること
      - リース期間が24か月以内であること
    answer: 1
    explanation: |
      正解は「リース期間が12か月以内であり、かつ購入オプションを含まないこと」。

      企業会計基準適用指針第33号第20項により、短期リースはリース期間が12か月
      以内で、かつ購入オプションを含まないものとされている。期間の要件だけでは
      なく、購入オプションを含まないことが併せて求められる点が重要。

      1番目は購入オプションの要件が欠けている。
      3番目は金額の要件を加えているが、これは少額リースの要件であって短期リース
      の要件ではない。両者は別の免除規定である。
      4番目は期間が誤り。

  - id: BK-2-15-02-002
    topic_id: BK-2-15-02
    basis: asbj-34
    grades: ["2", "1"]
    valid_from: 2027
    difficulty: 2
    question: |
      少額リースに該当するものとして賃貸借処理を行うこととした事務所用スペースに
      ついて、当月分の賃借料70,000円を現金で支払った。この仕訳として正しいものは
      どれか。
    choices:
      - (借) 支払家賃 70,000 ／ (貸) 現金 70,000
      - (借) 支払リース料 70,000 ／ (貸) 現金 70,000
      - (借) 使用権資産 70,000 ／ (貸) 現金 70,000
      - (借) リース負債 70,000 ／ (貸) 現金 70,000
    answer: 1
    explanation: |
      正解は「(借) 支払リース料 70,000 ／ (貸) 現金 70,000」。

      少額リースはオンバランスせず賃貸借処理を行うことが容認されている
      （適用指針第22項）。2級以上においては、不動産の賃借を賃貸借処理する場合も
      支払家賃勘定を用いず支払リース料勘定に統一されるため、借方は支払リース料と
      なる。

      1番目の支払家賃は3級の範囲では正解になるが、2級以上では誤り。
      3番目・4番目は、賃貸借処理を行うにもかかわらずオンバランスの勘定を用いて
      おり誤り。なお2級以上では、不動産の賃借について賃貸借処理する方法と使用権
      資産として計上する方法の**両方が出題対象**となる点に注意すること。

  - id: BK-2-15-03-001
    topic_id: BK-2-15-03
    basis: asbj-34
    grades: ["1"]
    valid_from: 2027
    difficulty: 3
    question: |
      企業会計基準第34号における貸手側の会計処理に関する記述として、正しいものは
      どれか。
    choices:
      - 借手側と同様に、ファイナンス・リースとオペレーティング・リースの区分は廃止された
      - ファイナンス・リースとオペレーティング・リースの区分は引き続き残されている
      - すべてのリースについて使用権資産を計上する
      - 貸手側の会計処理は出題範囲から除外された
    answer: 1
    explanation: |
      正解は「ファイナンス・リースとオペレーティング・リースの区分は引き続き
      残されている」。

      新リース会計基準では、借手側の区分は廃止されたが、**貸手側では依然として
      ファイナンス・リースとオペレーティング・リースの区分が残されている**。
      出題区分表でも「ウ．リースの貸手側の処理(ファイナンス・リース、
      オペレーティング・リース)」と括弧書きで明示されており、注意喚起がなされて
      いる。

      1番目は借手側の取扱いを貸手側にも及ぼした誤り。借手と貸手で扱いが非対称に
      なっている点が新基準の要注意箇所である。
      3番目の使用権資産は借手側の勘定であり、貸手側では計上しない。
      4番目は誤り。貸手側の処理は1級の出題範囲である。

  - id: BK-2-15-05-001
    topic_id: BK-2-15-05
    basis: asbj-34
    grades: ["1"]
    valid_from: 2027
    difficulty: 4
    question: |
      借地権の設定に係る権利金等の会計処理として、企業会計基準適用指針第33号が
      原則としている取扱いはどれか。
    choices:
      - 支払時の費用として処理する
      - 無形固定資産として計上し、20年で償却する
      - 使用権資産の取得価額に含め、借手のリース期間を耐用年数として減価償却を行う
      - 非償却資産として計上し、償却を行わない
    answer: 2
    explanation: |
      正解は「使用権資産の取得価額に含め、借手のリース期間を耐用年数として
      減価償却を行う」。

      適用指針第27項により、借地権の設定に係る権利金等は使用権資産の取得価額に
      含め、借手のリース期間を耐用年数とし、減価償却を行うことが原則とされて
      いる。2027年度の出題区分表の改定で、1級特有の論点として新たに明示された
      項目である。

      1番目は、権利金が将来にわたる使用の対価であることと整合しない。
      2番目の「20年」という償却期間の定めはない。耐用年数は借手のリース期間で
      ある。
      4番目は、旧来「借地権は非償却」とされてきた扱いに引きずられた誤り。
      使用権資産に含めて償却する点が新基準の要点である。

