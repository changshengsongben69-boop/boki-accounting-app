questions:
  - id: BK-2-10-001
    topic_id: BK-2-10-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    question: |
      備品¥400,000を購入し、引取運賃¥8,000と据付費¥12,000を現金で支払った。この備品の取得原価として正しいものはどれか。
    choices:
      - "¥408,000"
      - "¥412,000"
      - "¥420,000"
      - "¥400,000"
    answer: 2
    explanation: |
      有形固定資産の取得原価は、購入代価に付随費用を加えた金額とする。引取運賃も据付費も、その資産を使える状態にするために要した支出なので取得原価に含める。¥400,000＋¥8,000＋¥12,000＝¥420,000。付随費用を費用として処理してしまうと、取得原価が過小になり以後の減価償却費も過小になる。

  - id: BK-2-10-002
    topic_id: BK-2-10-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      当期首に取得した備品（取得原価¥600,000、残存価額ゼロ、耐用年数5年）について、決算にあたり定額法・間接法により減価償却を行う。正しい仕訳はどれか。
    choices:
      - "（借）減価償却費 120,000 ／（貸）備品減価償却累計額 120,000"
      - "（借）減価償却費 120,000 ／（貸）備品 120,000"
      - "（借）備品減価償却累計額 120,000 ／（貸）減価償却費 120,000"
      - "（借）減価償却費 100,000 ／（貸）備品減価償却累計額 100,000"
    answer: 0
    explanation: |
      定額法の減価償却費は（取得原価−残存価額）÷耐用年数＝¥600,000÷5年＝¥120,000。間接法では備品勘定を直接減らさず、備品減価償却累計額という評価勘定を貸方に計上する。備品を直接減らすのは直接法で、2級以上の範囲。この方法により備品勘定の残高は取得原価のまま維持される。

  - id: BK-2-10-003
    topic_id: BK-2-10-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    question: |
      決算日は3月31日である。当期の10月1日に取得した備品（取得原価¥600,000、残存価額ゼロ、耐用年数5年、定額法）の当期の減価償却費として正しいものはどれか。
    choices:
      - "¥120,000"
      - "¥30,000"
      - "¥100,000"
      - "¥60,000"
    answer: 3
    explanation: |
      期中に取得した資産は、使用を開始した月から決算日までの期間に対応する分だけ償却する。1年分は¥600,000÷5年＝¥120,000であり、10月1日から3月31日までの6か月分なので¥120,000×6/12＝¥60,000。取得日にかかわらず1年分を計上するのは誤り。月割計算は3級で頻出の論点である。

  - id: BK-2-10-004
    topic_id: BK-2-10-05c
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    question: |
      備品（取得原価¥700,000、決算整理前の減価償却累計額¥448,000）について、定率法（償却率40%）により減価償却を行う。当期の減価償却費として正しいものはどれか。
    choices:
      - "¥179,200"
      - "¥100,800"
      - "¥280,000"
      - "¥252,000"
    answer: 1
    explanation: |
      定率法の減価償却費は、期首の帳簿価額（未償却残高）に償却率を掛けて計算する。帳簿価額は¥700,000−¥448,000＝¥252,000なので、¥252,000×40%＝¥100,800。取得原価に償却率を掛ける（¥280,000）のは定額法と混同した誤り。定率法は2027年度から3級に移行した論点だが、償却率が与えられる簡易な出題に限られ、200%定率法の保証率や改定償却率は3級では出題されない。

  - id: BK-2-10-005
    topic_id: BK-2-10-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      備品（取得原価¥500,000、期首の減価償却累計額¥300,000）を期首に¥180,000で売却し、代金は月末に受け取ることとした。正しい仕訳はどれか。
    choices:
      - "（借）備品減価償却累計額 300,000・未収入金 180,000 ／（貸）備品 480,000"
      - "（借）備品減価償却累計額 300,000・未収入金 180,000・固定資産売却損 20,000 ／（貸）備品 500,000"
      - "（借）備品減価償却累計額 300,000・売掛金 180,000・固定資産売却損 20,000 ／（貸）備品 500,000"
      - "（借）未収入金 180,000 ／（貸）備品 180,000"
    answer: 1
    explanation: |
      帳簿価額は¥500,000−¥300,000＝¥200,000であり、売却価額¥180,000との差額¥20,000が固定資産売却損となる。間接法なので備品は取得原価¥500,000で消し、累計額も同時に取り崩す。代金は商品以外の売却によるものなので売掛金ではなく未収入金。備品を売却価額だけ減らす処理では、取得原価と累計額が帳簿に残ってしまう。

  - id: BK-2-10-006
    topic_id: BK-2-10-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      備品（取得原価¥300,000、減価償却累計額¥270,000）を除却した。なお、この備品には¥20,000の処分価値があると見積られた（当期の減価償却は考慮しない）。正しい仕訳はどれか。
    choices:
      - "（借）備品減価償却累計額 270,000・固定資産除却損 30,000 ／（貸）備品 300,000"
      - "（借）備品減価償却累計額 270,000・貯蔵品 30,000 ／（貸）備品 300,000"
      - "（借）固定資産除却損 300,000 ／（貸）備品 300,000"
      - "（借）備品減価償却累計額 270,000・貯蔵品 20,000・固定資産除却損 10,000 ／（貸）備品 300,000"
    answer: 3
    explanation: |
      除却とは事業用として使うのをやめることをいい、処分価値がある場合はその見積額を貯蔵品（資産）として計上する。帳簿価額¥30,000と処分価値¥20,000との差額¥10,000が固定資産除却損。処分価値を無視して全額を損失とするのは、まだ価値のある資産を計上しないことになり誤り。有形固定資産の除却・廃棄は2027年度から3級に移行した論点である。

  - id: BK-2-10-007
    topic_id: BK-2-10-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      備品（取得原価¥300,000、減価償却累計額¥270,000）を廃棄し、処分価値はなかった（当期の減価償却は考慮しない）。正しい仕訳はどれか。
    choices:
      - "（借）備品減価償却累計額 270,000・固定資産廃棄損 30,000 ／（貸）備品 300,000"
      - "（借）備品減価償却累計額 270,000・貯蔵品 30,000 ／（貸）備品 300,000"
      - "（借）固定資産廃棄損 300,000 ／（貸）備品 300,000"
      - "（借）備品減価償却累計額 300,000 ／（貸）備品 300,000"
    answer: 0
    explanation: |
      廃棄は文字どおり捨ててしまうことなので、処分価値はなく貯蔵品も計上されない。帳簿価額¥300,000−¥270,000＝¥30,000がそのまま固定資産廃棄損となる。除却との違いは、処分価値を貯蔵品として資産計上するかどうかにある。累計額を無視して取得原価全額を損失にすると、すでに費用化した減価償却費を二重に計上することになる。

  - id: BK-2-10-008
    topic_id: BK-2-10-05
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      間接法により減価償却を記帳している場合の、備品勘定の残高についての説明として正しいものはどれか。
    choices:
      - "決算のたびにゼロになる"
      - "処分するまで記帳されない"
      - "減価償却をしても減らず、常に取得原価を示す"
      - "毎期の減価償却費だけ減少し、帳簿価額を示す"
    answer: 2
    explanation: |
      間接法では減価償却費の相手科目を備品減価償却累計額とするため、備品勘定そのものは取得原価のまま動かない。帳簿価額は、備品勘定の残高から減価償却累計額を控除して求める。備品勘定が直接減っていくのは直接法である。取得原価と償却済みの金額の両方が帳簿に残る点が間接法の利点。

  - id: BK-2-10-009
    topic_id: BK-2-10-08
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      固定資産台帳について正しいものはどれか。
    choices:
      - "取得原価・耐用年数・減価償却方法などを記録する帳簿である"
      - "商品の仕入先と売上先を記録する帳簿である"
      - "現金出納帳の別名である"
      - "損益計算書の作成に直接使う帳簿である"
    answer: 0
    explanation: |
      固定資産台帳は固定資産の取得原価、耐用年数、減価償却方法など資産の基本情報を記録する帳簿である。仕入先や売上先を記録する帳簿ではなく、現金出納帳や損益計算書とも用途が異なる。

