      - "繰越商品：修正記入 借方50,000・貸方70,000、貸借対照表欄 借方50,000／仕入：損益計算書欄 借方1,200,000"
      - "繰越商品：修正記入 借方20,000、貸借対照表欄 借方70,000／仕入：損益計算書欄 借方1,180,000"
