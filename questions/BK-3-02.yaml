  - id: BK-3-02-001
    topic_id: BK-3-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      8桁精算表の欄の構成として正しいものはどれか。
    choices:
      - "残高試算表欄・仕訳帳欄・損益計算書欄・貸借対照表欄"
      - "合計試算表欄・残高試算表欄・修正記入欄・損益計算書欄"
      - "修正記入欄・損益計算書欄・貸借対照表欄・繰越試算表欄"
      - "残高試算表欄・修正記入欄・損益計算書欄・貸借対照表欄"
    answer: 3
    explanation: |
      8桁精算表は、残高試算表・修正記入・損益計算書・貸借対照表の4つの欄がそれぞれ借方と貸方の2列を持つため、合計8列（8桁）となる。決算整理前の残高から出発し、修正記入欄で決算整理を加え、その結果を損益計算書欄と貸借対照表欄へ振り分けるという流れを一覧できるのが精算表の役割である。

  - id: BK-3-02-002
    topic_id: BK-3-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      精算表において、期首商品棚卸高¥50,000・期末商品棚卸高¥70,000であるときの繰越商品の行の記入として正しいものはどれか。
    choices:
      - "残高試算表欄の借方に50,000、修正記入欄の借方に70,000、損益計算書欄の借方に120,000"
      - "残高試算表欄の借方に50,000、貸借対照表欄の借方に50,000"
      - "残高試算表欄の借方に50,000、修正記入欄の貸方に50,000と借方に70,000、貸借対照表欄の借方に70,000"
      - "残高試算表欄の借方に70,000、修正記入欄の借方に50,000、貸借対照表欄の借方に120,000"
    answer: 2
    explanation: |
      決算整理前の繰越商品は期首商品¥50,000。これを仕入勘定へ振り替えるので修正記入欄の貸方に¥50,000、期末商品¥70,000を繰越商品へ振り替えるので同欄の借方に¥70,000と記入する。差引残高¥70,000が期末の商品有高として貸借対照表欄の借方に記載される。繰越商品は資産なので損益計算書欄には現れない。

  - id: BK-3-02-003
    topic_id: BK-3-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
