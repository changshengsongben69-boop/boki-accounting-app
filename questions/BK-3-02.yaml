      　　　　資本金 1,000,000／繰越利益剰余金 200,000／売上 2,200,000／受取手数料 60,000　　計 4,406,000

      【決算整理事項】
      ① 期末商品棚卸高は70,000円である。
      ② 売掛金の期末残高に対して2%の貸倒引当金を差額補充法により設定する。
      ③ 備品について、残存価額ゼロ・耐用年数5年の定額法により減価償却を行う（間接法）。
      ④ 支払保険料は当期の12月1日に向こう1年分を支払ったものである（決算日は3月31日）。
      ⑤ 家賃の未払分が20,000円ある。

      精算表の貸借対照表欄の借方合計として正しいものはどれか。
    choices:
      - "2,446,000円"
      - "2,070,000円"
      - "2,426,000円"
      - "4,406,000円"
    answer: 0
    explanation: |
      貸借対照表欄の借方に入るのは、現金96,000＋普通預金800,000＋売掛金800,000＋繰越商品70,000
      ＋前払保険料80,000＋備品600,000＝2,446,000円。
      貸倒引当金16,000円と備品減価償却累計額360,000円は評価勘定なので、資産から差し引くのではなく
      貸方の項目として記入する。したがって借方合計からは除く。
      2,070,000円はこれらを控除した後の金額で、貸借対照表を作成するときの資産合計にあたるが、
      精算表の欄の合計ではない。この総額と純額の違いが精算表と財務諸表の分かれ目になる。

