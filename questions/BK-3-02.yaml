    question: |
      精算表において、決算整理で新たに計上した前払保険料が記入される欄として正しいものはどれか。
    choices:
      - "修正記入欄の貸方と損益計算書欄の貸方"
      - "修正記入欄の借方と貸借対照表欄の借方"
      - "修正記入欄の貸方と貸借対照表欄の貸方"
      - "修正記入欄の借方と損益計算書欄の借方"
    answer: 1
    explanation: |
      前払保険料は次期の費用を前払いしたことによる資産なので、決算整理で借方に計上し、貸借対照表欄の借方へ記入する。相手科目である支払保険料は修正記入欄の貸方に記入され、その分だけ損益計算書欄に載る費用が減る。決算整理前の残高試算表欄には現れず、修正記入欄からはじめて登場する行になる。

  - id: BK-3-02-007
    topic_id: BK-3-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      精算表の損益計算書欄と貸借対照表欄について、正しい説明はどれか。
    choices:
      - "損益計算書欄だけが一致し、貸借対照表欄は一致しない"
      - "当期純利益を加える前から両欄とも一致している"
      - "どちらの欄も一致することはない"
      - "当期純利益（または損失）を加えると、どちらの欄も借方合計と貸方合計が一致する"
    answer: 3
    explanation: |
      収益と費用の差額、資産と負債・純資産の差額は、いずれも当期純損益に等しい。したがって当期純利益（または損失）を不足している側に加えれば、両欄とも貸借が一致する。しかも損益計算書欄で計算された利益と貸借対照表欄で必要となる金額は必ず同額になり、これが精算表による検算の意味である。

  - id: BK-3-02-008
    topic_id: BK-3-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      精算表の修正記入欄についての説明として正しいものはどれか。
    choices:
      - "決算整理仕訳の借方と貸方を、それぞれの勘定の行に書き写す欄である"
      - "期中の取引をすべて記入する欄である"
      - "誤った記帳を訂正するためだけの欄である"
      - "当期純利益を計算する欄である"
    answer: 0
    explanation: |
      修正記入欄には決算整理仕訳の内容を記入する。ひとつの仕訳の借方と貸方は、それぞれ該当する勘定科目の行の借方欄・貸方欄に分かれて記入されるため、欄全体の借方合計と貸方合計は必ず一致する。期中取引は残高試算表欄にすでに反映済みであり、修正記入欄は誤記訂正専用の欄でもない。

