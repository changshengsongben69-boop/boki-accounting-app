      【決算整理事項】備品について、残存価額ゼロ・耐用年数5年の定額法により減価償却を行う（間接法）。

      精算表の記入として正しいものはどれか。
    choices:
      - "減価償却費：損益計算書欄 借方120,000／備品減価償却累計額：貸借対照表欄 貸方360,000"
      - "減価償却費：損益計算書欄 借方120,000／備品減価償却累計額：貸借対照表欄 貸方120,000"
      - "減価償却費：損益計算書欄 借方72,000／備品減価償却累計額：貸借対照表欄 貸方312,000"
      - "減価償却費：損益計算書欄 借方120,000／備品：貸借対照表欄 借方480,000"
    answer: 0
    explanation: |
      当期の減価償却費は600,000÷5年＝120,000円。
      貸借対照表欄の累計額は、決算整理前の240,000円に当期分120,000円を加えた360,000円となる。
      当期分だけを累計額とするのは、前期までの償却額が消えてしまうので誤り。
      帳簿価額360,000円から計算した72,000円は定率法と混同したもので、定額法は取得原価を基礎とする。
      間接法なので備品勘定は600,000円のまま動かない。

