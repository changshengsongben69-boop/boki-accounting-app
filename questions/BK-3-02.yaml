    question: |
      精算表において、貸倒引当金繰入と貸倒引当金が記入される欄の組合せとして正しいものはどれか。
    choices:
      - "貸倒引当金繰入は損益計算書欄の借方、貸倒引当金は貸借対照表欄の貸方"
      - "貸倒引当金繰入は損益計算書欄の貸方、貸倒引当金は貸借対照表欄の借方"
      - "どちらも損益計算書欄に記入する"
      - "どちらも貸借対照表欄に記入する"
    answer: 0
    explanation: |
      貸倒引当金繰入は当期の費用なので損益計算書欄の借方へ、貸倒引当金は債権から控除される評価勘定として貸借対照表欄の貸方へ記入する。名前が似ている2つの科目が異なる欄に分かれる点が精算表の頻出ポイント。減価償却費と減価償却累計額の関係もまったく同じ構造である。

  - id: BK-3-02-004
    topic_id: BK-3-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      精算表において、備品減価償却累計額が記入される欄として正しいものはどれか。
    choices:
      - "貸借対照表欄の借方"
      - "損益計算書欄の借方"
      - "損益計算書欄の貸方"
      - "貸借対照表欄の貸方"
    answer: 3
    explanation: |
      減価償却累計額は備品という資産から控除される評価勘定であり、残高は貸方に生じるので貸借対照表欄の貸方に記入する。当期分の費用である減価償却費のほうは損益計算書欄の借方に記入する。貸借対照表では備品の取得原価から累計額を控除する形式で表示される。

  - id: BK-3-02-005
    topic_id: BK-3-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      当期純利益が生じた場合、精算表における当期純利益の記入位置として正しいものはどれか。
    choices:
      - "損益計算書欄の貸方と貸借対照表欄の貸方"
      - "損益計算書欄の借方と貸借対照表欄の貸方"
      - "損益計算書欄の貸方と貸借対照表欄の借方"
      - "損益計算書欄の借方と貸借対照表欄の借方"
    answer: 1
    explanation: |
      損益計算書欄は貸方（収益）が借方（費用）より大きいときに利益が出るので、貸借を一致させるために不足している借方に当期純利益を書き入れる。貸借対照表欄では逆に、利益の分だけ純資産が増えるので貸方に書き入れる。当期純損失の場合は両方とも逆側になる。

