# BK-1-05
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-1-05-01, BK-1-05-02, BK-1-05-03
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-1-05-02

questions:
  - id: BK-1-05-001
    topic_id: BK-1-05-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      3伝票制で用いられる伝票の組合せとして正しいものはどれか。
    choices:
      - "入金伝票・出金伝票・振替伝票"
      - "入金伝票・出金伝票・仕訳伝票"
      - "仕入伝票・売上伝票・振替伝票"
      - "入金伝票・出金伝票・仕入伝票"
    answer: 0
    explanation: |
      3伝票制は入金伝票・出金伝票・振替伝票の3種類からなる。現金が増える取引は入金伝票、現金が減る取引は出金伝票、現金が動かない取引は振替伝票に記入する。仕入伝票と売上伝票が加わるのは5伝票制であり、3伝票制では用いない。

  - id: BK-1-05-002
    topic_id: BK-1-05-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      「商品¥40,000を売り上げ、代金を現金で受け取った」という取引を3伝票制で起票する場合、用いる伝票と記入内容として正しいものはどれか。
    choices:
      - "出金伝票に、科目「売上」・金額¥40,000と記入する"
      - "振替伝票に、現金¥40,000と売上¥40,000を記入する"
      - "入金伝票に、科目「売上」・金額¥40,000と記入する"
      - "入金伝票に、科目「現金」・金額¥40,000と記入する"
    answer: 2
    explanation: |
      現金が増えるので入金伝票を用いる。入金伝票は借方が現金であることがあらかじめ決まっているため、伝票に記入するのは相手科目、すなわち貸方の売上である。借方の現金を記入するのではない点に注意する。現金が動いている以上、振替伝票は用いない。

  - id: BK-1-05-003
    topic_id: BK-1-05-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      「商品¥100,000を売り上げ、うち¥30,000は現金で受け取り、残額は掛けとした」という取引について、いったん全額を掛け取引として起票する方法による組合せとして正しいものはどれか。
    choices:
      - "振替伝票に「売掛金70,000／売上70,000」、入金伝票に「売上30,000」"
      - "振替伝票に「売掛金100,000／売上100,000」、入金伝票に「売上30,000」"
      - "入金伝票に「売上100,000」のみ"
      - "振替伝票に「売掛金100,000／売上100,000」、入金伝票に「売掛金30,000」"
    answer: 3
    explanation: |
      一部現金取引には2通りの起票方法がある。この方法では、まず取引の全額を掛けで売り上げたものとみなして振替伝票に売掛金¥100,000と売上¥100,000を記入し、続いて売掛金¥30,000をただちに回収したものとして入金伝票に相手科目「売掛金」を記入する。入金伝票の科目を売上とするのは、取引を分解する方法と混同した誤り。

  - id: BK-1-05-004
    topic_id: BK-1-05-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      No.025と同じ取引について、取引を分解して起票する方法による組合せとして正しいものはどれか。
    choices:
      - "振替伝票に「売掛金70,000／売上70,000」のみ"
      - "入金伝票に「売上30,000」、振替伝票に「売掛金70,000／売上70,000」"
      - "入金伝票に「売掛金30,000」、振替伝票に「売掛金70,000／売上70,000」"
      - "入金伝票に「売上30,000」、振替伝票に「売掛金100,000／売上100,000」"
    answer: 1
    explanation: |
      取引を分解する方法では、現金売上¥30,000と掛け売上¥70,000という2つの取引が同時に行われたと考える。したがって入金伝票の相手科目は売上¥30,000、振替伝票は売掛金¥70,000と売上¥70,000となる。どちらの方法でも最終的に総勘定元帳に集計される金額は同じになるが、伝票上の科目と金額が異なる点が問われる。

  - id: BK-1-05-005
    topic_id: BK-1-05-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      出金伝票に「科目：買掛金／金額：¥60,000」と記入されていた。この伝票が表す取引として正しいものはどれか。
    choices:
      - "買掛金¥60,000を現金で受け取った"
      - "売掛金¥60,000を現金で回収した"
      - "買掛金¥60,000を現金で支払った"
      - "商品¥60,000を掛けで仕入れた"
    answer: 2
    explanation: |
      出金伝票は貸方が現金であることが決まっており、記入されている科目は借方の相手科目を表す。したがって仕訳は「（借）買掛金60,000／（貸）現金60,000」となり、買掛金を現金で支払った取引を意味する。掛け仕入は現金が動かないので振替伝票に記入される取引である。

  - id: BK-1-05-006
    topic_id: BK-1-05-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      仕訳日計表についての説明として正しいものはどれか。
    choices:
      - "1日分の伝票を勘定科目ごとに集計した表であり、これをもとに総勘定元帳へ合計転記する"
      - "1日分の現金の収支だけを集計した表である"
      - "決算にあたり1年分の取引を集計した表である"
      - "得意先ごとの売掛金残高を集計した表である"
    answer: 0
    explanation: |
      伝票の枚数が多いと1枚ずつ転記するのは煩雑なので、1日分の伝票を勘定科目ごとに集計した仕訳日計表を作成し、そこから総勘定元帳へまとめて転記する（合計転記）。これにより転記の手数と誤りを減らせる。得意先ごとの明細については、仕訳日計表とは別に伝票から売掛金元帳へ個別に転記する。

  - id: BK-1-05-007
    topic_id: BK-1-05-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      証ひょうについての説明として正しいものはどれか。
    choices:
      - "領収書や請求書、納品書など、取引が行われた事実を証明する書類をいう"
      - "取引を勘定科目ごとに集計した帳簿をいう"
      - "決算で作成する精算表のことをいう"
      - "伝票を綴じ込んだものをいう"
    answer: 0
    explanation: |
      証ひょうは取引の事実を裏づける外部または内部の書類であり、領収書、請求書、納品書、通帳の記録などが該当する。記帳はこれらの証ひょうにもとづいて行われるため、記録の信頼性の出発点となる。近年は証ひょうから直接読み取って仕訳を答えさせる出題も多い。

  - id: BK-1-05-008
    topic_id: BK-1-05-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      3伝票制において、「商品¥80,000を掛けで仕入れた」という取引を起票する伝票として正しいものはどれか。
    choices:
      - "出金伝票"
      - "起票しない"
      - "振替伝票"
      - "入金伝票"
    answer: 2
    explanation: |
      掛け仕入は現金が増えも減りもしないので、入金伝票にも出金伝票にも記入できず、振替伝票に借方「仕入」・貸方「買掛金」と記入する。振替伝票は借方と貸方の両方の科目を記入する形式であり、現金が動かないすべての取引を受け持つ。簿記上の取引である以上、起票しないという扱いにはならない。

