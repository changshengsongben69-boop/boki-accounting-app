topic_default: BK-2-03-01

questions:
  - id: BK-2-03-001
    topic_id: BK-2-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      商品¥300,000を売り上げ、代金は掛けとした。このときの借方科目として正しいものはどれか。
    choices:
      - "前受金"
      - "立替金"
      - "売掛金"
      - "未収入金"
    answer: 2
    explanation: |
      主たる営業取引である商品売買から生じた未回収の代金は売掛金で処理する。未収入金は備品など商品以外を売却したときの債権に用いる科目であり、ここでは誤り。前受金は代金を先に受け取ったときに生じる負債なので、掛け売上の借方には現れない。立替金は取引先が負担すべき金額を当社が一時的に支払ったときの科目。

  - id: BK-2-03-002
    topic_id: BK-2-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      買掛金¥100,000を当座預金から振り込んで支払った。振込手数料¥440は当社負担である。正しい仕訳はどれか。
    choices:
      - "（借）買掛金 100,440 ／（貸）当座預金 100,440"
      - "（借）買掛金 100,000 ／（貸）当座預金 99,560・支払手数料 440"
      - "（借）買掛金 100,000・雑損 440 ／（貸）当座預金 100,440"
      - "（借）買掛金 100,000・支払手数料 440 ／（貸）当座預金 100,440"
    answer: 3
    explanation: |
      消滅する債務は仕入先との約定額¥100,000ちょうどであり、手数料を買掛金に含めてはならない。当社が負担した振込手数料は費用として支払手数料で処理する。当座預金からの実際の減少額は合計の¥100,440。雑損は原因不明の損失などに使う科目で、内容の明らかな手数料には用いない。

  - id: BK-2-03-003
    topic_id: BK-2-03-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      売掛金¥80,000の回収として、得意先から普通預金口座に振込みを受けた。ただし振込手数料¥440が差し引かれており、この手数料は当社が負担する約定である。正しい仕訳はどれか。
    choices:
      - "（借）普通預金 79,560・支払手数料 440 ／（貸）売掛金 80,000"
      - "（借）普通預金 79,560 ／（貸）売掛金 79,560"
      - "（借）普通預金 80,000 ／（貸）売掛金 79,560・受取手数料 440"
      - "（借）普通預金 79,560・売上 440 ／（貸）売掛金 80,000"
    answer: 0
    explanation: |
      回収された債権は約定額の¥80,000全額であり、貸方は¥80,000でなければならない。実際の入金額は手数料控除後の¥79,560で、差額¥440は当社が負担した費用なので支払手数料とする。売掛金を¥79,560しか減らさないと、残高¥440が永久に残ってしまい誤り。売上を取り消す処理も、販売価格そのものは変わっていないので誤り。

  - id: BK-2-03-004
    topic_id: BK-2-03-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      売掛金元帳（得意先元帳）についての説明として正しいものはどれか。
    choices:
      - "売掛金元帳には売上額だけを記入し、回収額は記入しない"
      - "売掛金元帳の各口座は、通常は貸方残高となる"
      - "各得意先の口座の残高を合計すると、総勘定元帳の売掛金勘定の残高と一致する"
      - "売掛金元帳は総勘定元帳の一部であり、売掛金勘定は設けない"
    answer: 2
    explanation: |
      売掛金勘定は得意先全体の合計を示す統制勘定であり、その内訳を得意先ごとに記録したものが補助元帳である売掛金元帳。したがって内訳の合計と統制勘定の残高は一致する。売掛金元帳はあくまで補助簿で、総勘定元帳の売掛金勘定は設けたままである。回収額も貸方に記入し、売掛金は資産なので各口座は通常借方残高となる。

  - id: BK-2-03-005
    topic_id: BK-2-03-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      売掛金元帳の得意先「大阪商店」の口座の貸方に記入されるものとして、正しいものはどれか。
    choices:
      - "大阪商店へ商品を掛けで売り上げたとき"
      - "大阪商店から商品を掛けで仕入れたとき"
      - "大阪商店へ商品を現金で売り上げたとき"
      - "大阪商店から売掛代金を回収したとき"
    answer: 3
    explanation: |
      売掛金元帳の各口座は売掛金勘定の内訳なので、記入する側も売掛金勘定と同じになる。すなわち掛け売上（増加）は借方、回収や返品（減少）は貸方。仕入取引は買掛金元帳の話であり売掛金元帳には現れない。現金売上は売掛金が発生しないため、そもそも売掛金元帳に記入しない。

  - id: BK-2-03-006
    topic_id: BK-2-03-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      仕入先へ商品を返品し、代金は買掛金から差し引いた。買掛金元帳（仕入先元帳）の当該仕入先の口座への記入として正しいものはどれか。
    choices:
      - "補助元帳には記入しない"
      - "借方に記入する（買掛金の減少）"
      - "貸方に記入する（買掛金の減少）"
      - "借方に記入する（買掛金の増加）"
    answer: 1
    explanation: |
      買掛金は負債なので、増加は貸方・減少は借方に記入する。返品により債務が減るので買掛金元帳の該当口座は借方記入となる。総勘定元帳の買掛金勘定と補助元帳の両方に記入するのが原則で、補助元帳への記入を省くと内訳と統制勘定が一致しなくなる。

  - id: BK-2-03-007
    topic_id: BK-2-03-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      月末に売掛金元帳の各口座の残高合計と、総勘定元帳の売掛金勘定の残高が一致しなかった。この事実が意味することとして正しいものはどれか。
    choices:
      - "売上の一部が現金売上であったことを示す"
      - "貸倒引当金を設定した分だけずれるのが正常である"
      - "どちらかに記入もれ・金額の誤り・転記先の誤りがあることを示す"
      - "取引量が多い月には一致しないのが正常である"
    answer: 2
    explanation: |
      統制勘定と補助元帳は同じ取引を別の切り口で二重に記録する仕組みなので、正しく記帳されていれば常に一致する。一致しない場合は記入もれ、金額の誤り、別の得意先口座への転記といった誤りを疑う。現金売上は売掛金勘定にも売掛金元帳にも記入されないため差異の原因にはならない。貸倒引当金は売掛金勘定そのものを減らさないため、これも理由にならない。

  - id: BK-2-03-008
    topic_id: BK-2-03-06
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      商品¥200,000をクレジット払いの条件で販売した。信販会社への手数料は販売代金の3%であり、販売時に計上する。正しい仕訳はどれか。
    choices:
      - "（借）クレジット売掛金 194,000・支払手数料 6,000 ／（貸）売上 200,000"
      - "（借）クレジット売掛金 200,000 ／（貸）売上 200,000"
      - "（借）売掛金 194,000・支払手数料 6,000 ／（貸）売上 200,000"
      - "（借）クレジット売掛金 200,000 ／（貸）売上 194,000・受取手数料 6,000"
    answer: 0
    explanation: |
      売上は顧客への販売額そのものである総額¥200,000で計上する。信販会社から受け取れるのは手数料を差し引いた¥194,000なので、クレジット売掛金はその金額。差額¥6,000は当社が支払う費用なので支払手数料であり、受取手数料とするのは貸借が逆。相手が信販会社である点で通常の売掛金と区別し、クレジット売掛金勘定を用いる。

  - id: BK-2-03-009
    topic_id: BK-2-03-06
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      No.012の代金が信販会社から当座預金口座に入金された。正しい仕訳はどれか。
    choices:
      - "（借）当座預金 194,000 ／（貸）クレジット売掛金 194,000"
      - "（借）当座預金 200,000 ／（貸）クレジット売掛金 200,000"
      - "（借）当座預金 194,000・支払手数料 6,000 ／（貸）クレジット売掛金 200,000"
      - "（借）当座預金 194,000 ／（貸）売掛金 194,000"
    answer: 0
    explanation: |
      販売時に手数料を計上済みなので、帳簿上のクレジット売掛金は¥194,000であり、入金額とちょうど一致する。入金時に改めて支払手数料を計上すると費用の二重計上になる。なお、手数料を入金時に計上する処理をとる場合は、販売時にクレジット売掛金を¥200,000で計上する。どちらの処理かは問題文の指示で判断する。

  - id: BK-2-03-010
    topic_id: BK-2-03-06
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      クレジット売掛金の性質についての説明として正しいものはどれか。
    choices:
      - "回収まで期間を要するため、貸借対照表では固定資産に表示する"
      - "顧客が代金を支払わない限り、売上を計上できない"
      - "信販会社に対する債権であり、商品を購入した顧客に対する債権ではない"
      - "商品を購入した顧客に対する債権である"
    answer: 2
    explanation: |
      クレジット払いでは代金が信販会社から支払われるため、債権の相手は信販会社である。顧客に対する債権ではない点が通常の売掛金との違いであり、勘定科目を分ける理由でもある。通常は短期間で決済されるので流動資産に表示する。売上は商品を引き渡した時点で計上し、代金の回収を待つ必要はない。なお2027年度の出題区分表では「クレジット売掛金（キャッシュレス決済を含む）」とされ、各種キャッシュレス決済によって生じた債権もこの勘定で処理することが明示された。

  - id: BK-2-03-011
    topic_id: BK-2-03-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      仕入先に対する買掛金¥150,000について、取引銀行を通じて債務の発生記録を行った。正しい仕訳はどれか。
    choices:
      - "（借）仕入 150,000 ／（貸）電子記録債務 150,000"
      - "（借）買掛金 150,000 ／（貸）電子記録債務 150,000"
      - "（借）買掛金 150,000 ／（貸）電子記録債権 150,000"
      - "（借）電子記録債務 150,000 ／（貸）買掛金 150,000"
    answer: 1
    explanation: |
      債務者側では、既存の買掛金という債務が電子記録債務に置き換わる。よって買掛金を借方で消滅させ、電子記録債務を貸方に計上する。貸借を逆にすると負債が二重に増えてしまう。仕入は掛けで仕入れた時点ですでに計上済みなので、ここで改めて計上してはならない。電子記録債権は債権者側で用いる科目。

  - id: BK-2-03-012
    topic_id: BK-2-03-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      得意先に対する売掛金¥150,000について、取引銀行を通じて債権の発生記録の請求を行い、取引先の承諾を得て記録が行われた。債権者側の仕訳として正しいものはどれか。
    choices:
      - "（借）売掛金 150,000 ／（貸）電子記録債権 150,000"
      - "（借）電子記録債権 150,000 ／（貸）売上 150,000"
      - "仕訳は不要である"
      - "（借）電子記録債権 150,000 ／（貸）売掛金 150,000"
    answer: 3
    explanation: |
      債権者側では売掛金が電子記録債権に置き換わるので、電子記録債権を借方、売掛金を貸方に記入する。売上は掛けで販売した時点で計上済みであり、ここで再び計上すると収益の二重計上になる。なお発生記録を請求するのが債務者・債権者のいずれであっても、記録が成立した時点で行う仕訳の内容は変わらない。

  - id: BK-2-03-013
    topic_id: BK-2-03-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      電子記録債務¥150,000について、支払期日に当座預金口座から引き落とされた。正しい仕訳はどれか。
    choices:
      - "（借）当座預金 150,000 ／（貸）電子記録債務 150,000"
      - "（借）電子記録債務 150,000 ／（貸）電子記録債権 150,000"
      - "（借）電子記録債務 150,000 ／（貸）当座預金 150,000"
      - "（借）買掛金 150,000 ／（貸）当座預金 150,000"
    answer: 2
    explanation: |
      決済により債務が消滅するので、電子記録債務を借方で減らし、当座預金を貸方で減らす。買掛金は発生記録の時点ですでに電子記録債務へ振り替えているため、ここで買掛金を減らすと同じ債務を二度消してしまう。電子記録債権は自社が保有する債権の科目であり、自社の債務の決済とは結びつかない。

  - id: BK-2-03-014
    topic_id: BK-2-03-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      電子記録債権が法律上発生する時点として正しいものはどれか。
    choices:
      - "電子債権記録機関の記録原簿に発生記録がされた時点"
      - "取引銀行に対して発生記録の請求を行った時点"
      - "商品を掛けで販売した時点"
      - "支払期日が到来した時点"
    answer: 0
    explanation: |
      電子記録債権は、電子債権記録機関が管理する記録原簿へ電子記録がされることによって発生する。請求しただけでは記録が成立していないため発生しない。掛け販売の時点で生じるのは売掛金であり、これが発生記録によって電子記録債権に置き換わる。支払期日は債権が消滅に向かう時点であって発生時点ではない。

  - id: BK-2-03-015
    topic_id: BK-2-03-04
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算日現在、得意先に対する債権が¥500,000あり、そのうち¥150,000については発生記録が行われている。貸借対照表上の表示として正しいものはどれか。
    choices:
      - "売掛金¥500,000として一括して表示する"
      - "電子記録債権¥500,000として一括して表示する"
      - "電子記録債権¥150,000のみを表示し、残額は表示しない"
      - "電子記録債権¥150,000と売掛金¥350,000を区分して表示する"
    answer: 3
    explanation: |
      発生記録を行った時点で売掛金から電子記録債権へ振り替えているため、帳簿上の売掛金残高は¥350,000になっている。電子記録債権と売掛金は権利の性質が異なる別個の資産なので、区分して表示する。まだ記録されていない¥350,000を表示しないのは、資産の計上もれとなり誤り。

