questions:
  - id: BK-3-03-001
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算日において、当座預金勘定が¥50,000の貸方残高となっていた。当座借越契約を結んでいる場合の決算整理仕訳として正しいものはどれか。
    choices:
      - "（借）当座借越 50,000 ／（貸）当座預金 50,000"
      - "（借）支払利息 50,000 ／（貸）当座預金 50,000"
      - "貸方残高のまま翌期に繰り越すので仕訳は不要である"
      - "（借）当座預金 50,000 ／（貸）当座借越 50,000"
    answer: 3
    explanation: |
      当座預金の貸方残高は、実質的に銀行から一時的に借り入れている状態を意味する。資産の勘定がマイナス残高のままでは貸借対照表に表示できないので、決算整理で当座借越（または借入金）という負債の勘定に振り替える。借方に当座預金を記入して残高をゼロに戻し、貸方に負債を計上するのが正しい向き。振替先は当座借越でも借入金でもよい。

  - id: BK-3-03-002
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      当期の12月1日に、向こう1年分の保険料¥120,000を現金で支払い、その全額を支払保険料として処理していた。決算日は3月31日である。決算整理仕訳として正しいものはどれか。
    choices:
      - "（借）前払保険料 80,000 ／（貸）支払保険料 80,000"
      - "（借）前払保険料 40,000 ／（貸）支払保険料 40,000"
      - "（借）支払保険料 80,000 ／（貸）前払保険料 80,000"
      - "（借）未払保険料 80,000 ／（貸）支払保険料 80,000"
    answer: 0
    explanation: |
      12月1日から3月31日までの4か月分が当期の費用で、残りの8か月分は次期の費用である。¥120,000×8/12＝¥80,000を費用から取り除き、前払保険料という資産として次期に繰り越す。当期分の¥40,000を繰り延べてしまう誤りが多いので、「経過した月数」か「これからの月数」かを必ず確認する。未払は費用が発生済みで未払いの場合の処理であり、ここでは支払済みなので該当しない。

  - id: BK-3-03-003
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり、貸付金に係る利息のうち当期に発生しているがまだ受け取っていない分が¥5,000ある。正しい決算整理仕訳はどれか。
    choices:
      - "（借）未収利息 5,000 ／（貸）受取利息 5,000"
      - "（借）受取利息 5,000 ／（貸）未収利息 5,000"
      - "（借）前受利息 5,000 ／（貸）受取利息 5,000"
      - "（借）受取利息 5,000 ／（貸）前受利息 5,000"
    answer: 0
    explanation: |
      当期に発生した収益は、入金がなくても当期の収益として計上する（発生主義）。受け取る権利があるので未収利息という資産を借方に計上し、受取利息を貸方で増やす。前受は先に受け取った収益を次期へ繰り延べる場合の処理であり、方向が逆。未収・未払と前受・前払の4パターンは、時間の前後と資産・負債の別で整理して覚える。

  - id: BK-3-03-004
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり、当期分の家賃¥50,000が未払いであることが判明した。正しい決算整理仕訳はどれか。
    choices:
      - "支払っていないので仕訳は不要である"
      - "（借）支払家賃 50,000 ／（貸）未払家賃 50,000"
      - "（借）未払家賃 50,000 ／（貸）支払家賃 50,000"
      - "（借）支払家賃 50,000 ／（貸）前払家賃 50,000"
    answer: 1
    explanation: |
      当期に使用した期間に対応する家賃は、支払っていなくても当期の費用として計上しなければならない。費用である支払家賃を借方に追加計上し、支払義務を未払家賃という負債として貸方に計上する。支払時点で費用にする現金主義では期間損益が正しく計算されないため、決算整理でこの調整を行う。

  - id: BK-3-03-005
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり、すでに受け取っている受取家賃のうち¥60,000は次期に対応する分であることが判明した。正しい決算整理仕訳はどれか。
    choices:
      - "（借）前受家賃 60,000 ／（貸）受取家賃 60,000"
      - "（借）受取家賃 60,000 ／（貸）未収家賃 60,000"
      - "（借）受取家賃 60,000 ／（貸）現金 60,000"
      - "（借）受取家賃 60,000 ／（貸）前受家賃 60,000"
    answer: 3
    explanation: |
      受け取っていても次期に対応する分は当期の収益ではないので、収益である受取家賃を借方で減らし、次期に役務を提供する義務を表す前受家賃という負債を貸方に計上する。未収は逆に、当期の収益なのにまだ受け取っていない場合の処理。すでに受領した現金を減らす必要はない。

  - id: BK-3-03-006
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり、購入時に費用処理していた収入印紙¥2,000および郵便切手¥1,200が未使用であることが判明した。正しい決算整理仕訳はどれか。
    choices:
      - "（借）租税公課 2,000・通信費 1,200 ／（貸）貯蔵品 3,200"
      - "（借）貯蔵品 3,200 ／（貸）現金 3,200"
      - "未使用でも購入時に費用としているので仕訳は不要である"
      - "（借）貯蔵品 3,200 ／（貸）租税公課 2,000・通信費 1,200"
    answer: 3
    explanation: |
      未使用分は当期にまだ消費していないので費用から取り除き、資産である貯蔵品として次期へ繰り越す。したがって借方に貯蔵品、貸方に租税公課と通信費を記入する。翌期首には再振替仕訳により費用へ戻す。この処理を怠ると当期の費用が過大に計上され、資産も計上もれとなる。

  - id: BK-3-03-007
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      決算手続の順序として正しいものはどれか。
    choices:
      - "財務諸表の作成 → 決算整理 → 帳簿の締切"
      - "帳簿の締切 → 決算整理 → 財務諸表の作成"
      - "決算整理前残高試算表の作成 → 決算整理 → 帳簿の締切 → 財務諸表の作成"
      - "決算整理 → 決算整理前残高試算表の作成 → 財務諸表の作成 → 帳簿の締切"
    answer: 2
    explanation: |
      まず期中の記帳を集計して決算整理前残高試算表を作り、記帳の正確性を確かめる。次に決算整理仕訳で期間損益を正しくし、収益・費用を損益勘定へ振り替えて帳簿を締め切り、最後に財務諸表を作成する。整理の前に財務諸表を作っても正しい利益は出ないし、締め切ってから整理することもできない。

  - id: BK-3-03-008
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      次のうち、決算整理事項に該当しないものはどれか。
    choices:
      - "期末商品棚卸高にもとづいて売上原価を算定する"
      - "売掛金の期末残高に対して貸倒引当金を設定する"
      - "備品について当期分の減価償却費を計上する"
      - "商品¥80,000を掛けで仕入れた"
    answer: 3
    explanation: |
      決算整理とは、期中の記帳だけでは正しい期間損益や期末の財政状態が示されない部分を、決算日に調整する手続をいう。掛け仕入は期中の通常の取引であり、その都度記帳されるものなので決算整理事項ではない。売上原価の算定、貸倒引当金の設定、減価償却はいずれも決算日にはじめて行う典型的な決算整理事項である。

  - id: BK-3-03-009
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり、当座預金勘定の貸方残高¥50,000を当座借越勘定に振り替えていた。翌期首に行う再振替仕訳として正しいものはどれか。
    choices:
      - "再振替仕訳は行わない"
      - "（借）当座借越 50,000 ／（貸）当座預金 50,000"
      - "（借）当座預金 50,000 ／（貸）当座借越 50,000"
      - "（借）当座借越 50,000 ／（貸）借入金 50,000"
    answer: 1
    explanation: |
      決算時の振替は貸借対照表に負債として表示するための便宜的な処理なので、翌期首にはこれを元に戻し、当座預金勘定で継続して記帳できるようにする。したがって決算時と貸借がちょうど逆の仕訳になる。再振替を行わないと、期中の当座預金の増減が実態と合わなくなる。

  - id: BK-3-03-010
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      前期末に、未使用の収入印紙¥2,000を租税公課から貯蔵品へ振り替えていた。当期首に行う再振替仕訳として正しいものはどれか。
    choices:
      - "（借）通信費 2,000 ／（貸）貯蔵品 2,000"
      - "（借）貯蔵品 2,000 ／（貸）現金 2,000"
      - "（借）租税公課 2,000 ／（貸）貯蔵品 2,000"
      - "（借）貯蔵品 2,000 ／（貸）租税公課 2,000"
    answer: 2
    explanation: |
      前期末に資産へ振り替えた未使用分は、当期に使用されるはずのものなので、期首に費用の勘定へ戻しておく。これが再振替仕訳であり、決算時とは貸借が逆になる。収入印紙は印紙税を表すので戻し先は租税公課であり、郵便切手であれば通信費となる。振替先の科目を取り違えないこと。

  - id: BK-3-03-011
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      前期末に前払保険料¥80,000を計上していた。当期首に行う再振替仕訳として正しいものはどれか。
    choices:
      - "（借）支払保険料 80,000 ／（貸）前払保険料 80,000"
      - "（借）前払保険料 80,000 ／（貸）支払保険料 80,000"
      - "（借）支払保険料 80,000 ／（貸）未払保険料 80,000"
      - "（借）前払保険料 80,000 ／（貸）現金 80,000"
    answer: 0
    explanation: |
      前払費用は当期に費用となる部分なので、期首に資産から費用へ戻す。決算時に「（借）前払保険料／（貸）支払保険料」としたものを、期首にそのまま逆仕訳する。この再振替を行うことで、当期に支払った分と合わせて当期の費用が正しく集計される。未払・前受・未収についても同様の再振替を行う。

  - id: BK-3-03-012
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      月次決算を行っている会社が、年間の減価償却費見込額¥240,000を毎月均等に計上している。1か月分の仕訳として正しいものはどれか。
    choices:
      - "（借）減価償却費 20,000 ／（貸）備品減価償却累計額 20,000"
      - "（借）減価償却費 240,000 ／（貸）備品減価償却累計額 240,000"
      - "（借）備品減価償却累計額 20,000 ／（貸）減価償却費 20,000"
      - "月次では計上せず、決算時に一括して計上する"
    answer: 0
    explanation: |
      月次決算では、年間の見込額を12で割った¥20,000を毎月計上し、月ごとの業績を早期に把握できるようにする。年度末には12か月分の累計が年間額と一致する。区分表では月次決算による場合の処理は3級に※付きで示されており、簡易な内容にとどまる。減価償却累計額を借方にするのは取り崩す場合の記入で、計上時とは逆。

  - id: BK-3-03-013
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      決算整理を行わずに財務諸表を作成した場合に生じる不都合として、最も適切なものはどれか。
    choices:
      - "仕訳帳への記入が二重になる"
      - "総勘定元帳の勘定科目が不足する"
      - "当期の収益と費用が正しく対応せず、当期純利益が実態を表さなくなる"
      - "試算表の貸借が一致しなくなる"
    answer: 2
    explanation: |
      決算整理は、売れ残った商品を費用から除いたり、使った分の固定資産の価値を費用にしたり、期間のずれた収益・費用を調整したりして、当期の損益を正しく対応させるための手続である。これを省くと利益が過大にも過小にもなる。整理をしなくても貸借は一致するため、試算表だけでは誤りに気づけない点に注意する。

  - id: BK-3-03-014
    topic_id: BK-3-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算にあたり、現金の実際有高が帳簿残高より¥1,500少なく、原因を調査したが判明しなかった（現金過不足勘定は用いていない）。正しい仕訳はどれか。
    choices:
      - "（借）現金 1,500 ／（貸）雑益 1,500"
      - "（借）雑損 1,500 ／（貸）現金 1,500"
      - "（借）現金過不足 1,500 ／（貸）現金 1,500"
      - "（借）雑益 1,500 ／（貸）現金 1,500"
    answer: 1
    explanation: |
      決算日に判明した過不足は、もはや原因を調査する期間が残っていないため、現金過不足という仮の勘定を経由せず直接雑損（不足の場合）または雑益（過剰の場合）とする。帳簿を実際有高に合わせるため現金を貸方で減らす。期中に発見した場合はいったん現金過不足で受けておく点と対比して覚える。

