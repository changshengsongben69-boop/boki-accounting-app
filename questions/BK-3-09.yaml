questions:
  - id: BK-3-09-001
    topic_id: BK-3-09
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      決算整理後の繰越商品¥70,000は、貸借対照表ではどのように表示されるか。
    choices:
      - "「繰越商品」として費用に表示する"
      - "「仕入」として資産の部に表示する"
      - "「売上原価」として表示する"
      - "「商品」として資産の部に表示する"
    answer: 3
    explanation: |
      帳簿上の勘定科目と財務諸表上の表示科目は必ずしも同じではない。繰越商品は貸借対照表では「商品」と表示する。仕入や売上原価は損益計算書に載る費用であり、貸借対照表には現れない。帳簿科目と表示科目の読み替えは3級の財務諸表作成問題で必ず問われる。

  - id: BK-3-09-002
    topic_id: BK-3-09
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      損益計算書における表示科目として正しい組合せはどれか。
    choices:
      - "どちらも帳簿の科目名のまま「売上」「仕入」と表示する"
      - "売上勘定は「営業収益」、仕入勘定は「商品」として表示する"
      - "売上勘定は「売上高」、仕入勘定は「売上原価」として表示する"
      - "売上勘定は「売上原価」、仕入勘定は「売上高」として表示する"
    answer: 2
    explanation: |
      損益計算書では、売上勘定の残高を「売上高」、決算整理後の仕入勘定の残高（＝売上原価）を「売上原価」として表示する。決算整理を経た仕入勘定の残高が売上原価を表しているからこそ、この読み替えが成り立つ。商品は貸借対照表の表示科目であり、損益計算書には登場しない。

  - id: BK-3-09-003
    topic_id: BK-3-09
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      売掛金¥800,000に対して貸倒引当金¥16,000が設定されている場合の、貸借対照表における表示として正しいものはどれか。
    choices:
      - "資産の部に売掛金800,000を示し、貸倒引当金16,000を控除する形式で表示する"
      - "負債の部に貸倒引当金16,000を表示する"
      - "売掛金784,000とだけ表示し、貸倒引当金は表示しない"
      - "売掛金800,000と貸倒引当金16,000をそれぞれ資産の部に並べて表示する"
    answer: 0
    explanation: |
      貸倒引当金は債権の回収不能見込額を表す評価勘定なので、対応する債権から控除する形式で資産の部に表示する。これにより債権の総額と、回収が見込まれる正味の金額の両方が読み取れる。名称に引当金とあっても支払義務ではないため負債ではなく、資産として並べて表示するものでもない。

  - id: BK-3-09-004
    topic_id: BK-3-09
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 2
    question: |
      備品の取得原価¥600,000、減価償却累計額¥240,000である場合の、貸借対照表における表示として正しいものはどれか。
    choices:
      - "備品360,000とだけ表示する"
      - "備品600,000を資産に、減価償却累計額240,000を負債に表示する"
      - "備品840,000と表示する"
      - "備品600,000から減価償却累計額240,000を控除する形式で表示する"
    answer: 3
    explanation: |
      間接法では備品勘定を取得原価のまま残し、減価償却累計額を控除する形式で表示する。これにより取得原価といくら償却が進んだかが同時に分かる。差引後の¥360,000が帳簿価額（未償却残高）。累計額は資産の控除項目であって負債ではなく、取得原価に加算するものでもない。

  - id: BK-3-09-005
    topic_id: BK-3-09
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      勘定式の貸借対照表における左右の記載内容として正しいものはどれか。
    choices:
      - "借方に資産と費用、貸方に負債と収益を記載する"
      - "借方（左側）に資産、貸方（右側）に負債と純資産を記載する"
      - "借方に負債と純資産、貸方に資産を記載する"
      - "借方に費用、貸方に収益を記載する"
    answer: 1
    explanation: |
      勘定式の貸借対照表は勘定の形にならい、左側に資産、右側に負債と純資産を記載する。資産＝負債＋純資産の関係により左右の合計は必ず一致する。費用と収益が記載されるのは損益計算書であり、貸借対照表には載らない。なお報告式は2級以上の範囲である。

  - id: BK-3-09-006
    topic_id: BK-3-09
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      勘定式の損益計算書において、当期純利益が記載される位置として正しいものはどれか。
    choices:
      - "損益計算書には記載しない"
      - "借方（左側）の末尾"
      - "貸方（右側）の末尾"
      - "借方と貸方の両方"
    answer: 1
    explanation: |
      勘定式の損益計算書は左側に費用、右側に収益を記載する。利益が出ているということは収益（右）のほうが大きいので、左右を一致させるために不足している借方の末尾に当期純利益を記載する。当期純損失の場合は逆に貸方の末尾に記載する。精算表の損益計算書欄と同じ考え方である。

  - id: BK-3-09-007
    topic_id: BK-3-09
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      貸借対照表に表示される繰越利益剰余金の金額についての説明として正しいものはどれか。
    choices:
      - "決算整理前残高試算表の金額をそのまま表示する"
      - "当期純利益とは無関係に決まる"
      - "損益計算書にのみ表示され、貸借対照表には表示しない"
      - "決算整理前の残高に当期純利益を加算した後の金額を表示する"
    answer: 3
    explanation: |
      当期純利益は決算振替仕訳によって繰越利益剰余金へ振り替えられるので、貸借対照表に表示される繰越利益剰余金は、期首からの残高に当期純利益を加えた（損失なら差し引いた）後の金額になる。この処理があるからこそ貸借対照表の貸借が一致する。繰越利益剰余金は純資産の勘定なので損益計算書には現れない。

