    question: |
      【資料】
      損益計算書：収益合計 2,260,000／費用合計 2,110,000
      貸借対照表：資産合計 2,070,000／負債合計 720,000

      貸借対照表の純資産合計として正しいものはどれか。
    choices:
      - "1,350,000円"
      - "1,200,000円"
      - "1,000,000円"
      - "1,500,000円"
    answer: 0
    explanation: |
      純資産＝資産2,070,000−負債720,000＝1,350,000円。
      内訳は資本金1,000,000円と、期首の繰越利益剰余金200,000円に当期純利益150,000円
      （＝2,260,000−2,110,000）を加えた350,000円である。
      損益計算書で計算した利益が貸借対照表の純資産に反映されることで、2つの財務諸表がつながる。
      この関係が成り立たないときは、決算整理か振替のどこかを誤っている。

