# BK-1-01
#
# 根拠: 商工会議所簿記検定試験出題区分表（2027年度適用・確定版）
# 収録論点: BK-1-01-01, BK-1-01-02, BK-1-01-03
#
# boki-apps の3級演習アプリから移送。内容は移送前と同一。

topic_default: BK-1-01-01

questions:
  - id: BK-1-01-001
    topic_id: BK-1-01-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    question: |
      ある会社の資産総額は¥800,000、負債総額は¥300,000である。純資産（資本）の金額として正しいものはどれか。
    choices:
      - "¥800,000"
      - "¥300,000"
      - "¥500,000"
      - "¥1,100,000"
    answer: 2
    explanation: |
      資産＝負債＋純資産という関係（貸借対照表等式）が成り立つので、純資産＝資産−負債＝¥800,000−¥300,000＝¥500,000。¥1,100,000は資産と負債を足してしまった誤り。純資産は株主に帰属する正味の財産を表し、資産から返済義務のある負債を差し引いて求める。

  - id: BK-1-01-002
    topic_id: BK-1-01-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 3
    question: |
      期首の純資産は¥500,000、期末の純資産は¥620,000であった。期中に追加の出資も配当もない場合、当期純利益として正しいものはどれか。
    choices:
      - "¥120,000"
      - "¥620,000"
      - "¥500,000"
      - "¥1,120,000"
    answer: 0
    explanation: |
      純資産の増減から利益を求める方法を財産法といい、当期純利益＝期末純資産−期首純資産＝¥620,000−¥500,000＝¥120,000。ただしこの計算が成り立つのは、増資や配当など損益以外の原因による純資産の変動がない場合に限られる。収益−費用で求める方法は損益法といい、両者の結果は必ず一致する。

  - id: BK-1-01-003
    topic_id: BK-1-01-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      次のうち、費用に属する勘定科目はどれか。
    choices:
      - "受取手数料"
      - "前払金"
      - "借入金"
      - "支払利息"
    answer: 3
    explanation: |
      支払利息は借入れの対価として支払うものなので費用。受取手数料は収益、前払金は代金を先に支払ったことで生じる資産、借入金は返済義務を表す負債である。「支払」「受取」という語だけで判断せず、企業の財産が減る原因か増える原因かで考えるとよい。

  - id: BK-1-01-004
    topic_id: BK-1-01-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      次のうち、負債に属する勘定科目はどれか。
    choices:
      - "貯蔵品"
      - "前受金"
      - "前払金"
      - "貸付金"
    answer: 1
    explanation: |
      前受金は代金を先に受け取ったことで生じる「商品を引き渡す義務」なので負債。前払金は逆に「商品を受け取る権利」で資産、貸付金は返してもらう権利で資産、貯蔵品は未使用の収入印紙や切手を表す資産である。前受金と前払金は名前が似ているので、どちらが受け取った側かを必ず確認する。

  - id: BK-1-01-005
    topic_id: BK-1-01-02
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      次のうち、収益に属する勘定科目はどれか。
    choices:
      - "貸倒引当金"
      - "償却債権取立益"
      - "受取商品券"
      - "繰越利益剰余金"
    answer: 1
    explanation: |
      償却債権取立益は、過年度に貸倒処理した債権を回収できたことによる収益。受取商品券は「受取」とあるが、発行元に請求できる権利を表す資産なので収益ではない。繰越利益剰余金は純資産、貸倒引当金は債権から控除される評価勘定である。科目名の語感ではなく、何を表しているかで分類する。

  - id: BK-1-01-006
    topic_id: BK-1-01-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      当期純利益と財務諸表の関係についての説明として正しいものはどれか。
    choices:
      - "当期純利益は損益計算書にのみ現れ、貸借対照表とは関係がない"
      - "当期純利益は貸借対照表の資産の部に計上される"
      - "当期純利益は負債を減少させる"
      - "損益計算書で計算された当期純利益は、貸借対照表の純資産を増加させる"
    answer: 3
    explanation: |
      損益計算書は一会計期間の収益と費用から当期純利益を計算し、その利益は繰越利益剰余金を通じて貸借対照表の純資産を増加させる。したがって財産法（純資産の増加額）と損益法（収益−費用）は必ず同じ金額になる。利益は資産という個別の項目ではなく、純資産の増加という形で貸借対照表に反映される。

  - id: BK-1-01-007
    topic_id: BK-1-01-03
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      貸借対照表と損益計算書が示す内容の違いとして正しいものはどれか。
    choices:
      - "貸借対照表は一定時点の財政状態を、損益計算書は一定期間の経営成績を示す"
      - "貸借対照表は一定期間の経営成績を、損益計算書は一定時点の財政状態を示す"
      - "どちらも一定時点の財政状態を示す"
      - "どちらも一定期間の経営成績を示す"
    answer: 0
    explanation: |
      貸借対照表は決算日という一時点に、どれだけの資産・負債・純資産を持っているか（財政状態）を表す。損益計算書は期首から期末までの一定期間に、どれだけ稼ぎどれだけ使ったか（経営成績）を表す。時点を切り取るのが貸借対照表、期間を集計するのが損益計算書、という違いを押さえる。

  - id: BK-1-01-008
    topic_id: BK-1-01-01
    exams: [nissho]
    grades: ["3"]
    valid_from: 2027
    difficulty: 1
    question: |
      次のうち、純資産（資本）を増加させる原因となるものはどれか。
    choices:
      - "備品を現金で購入した"
      - "買掛金を現金で支払った"
      - "商品を仕入原価より高い価額で販売した"
      - "銀行から現金を借り入れた"
    answer: 2
    explanation: |
      純資産が増えるのは、収益が発生したときと出資を受けたときである。原価より高く販売すれば利益が生じ、純資産が増加する。借入れは資産と負債が同額増えるだけ、備品の購入は資産の中身が入れ替わるだけ、買掛金の支払は資産と負債が同額減るだけで、いずれも純資産は変わらない。

