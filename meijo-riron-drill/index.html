<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会計理論ドリル</title>
<style>
:root{
  --paper:#EDF1EC; --rule:#BFD0C4; --sumi:#17241D; --shu:#B0322A; --kincha:#8A6D1F;
  --paper-deep:#E3E9E2; --sumi-thin:#5A6B62;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"MS PMincho",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--sumi);
  font-family:var(--gothic); font-size:16px; line-height:1.8;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 64px}

/* ---- 見出し ---- */
header{border-bottom:3px double var(--rule);margin-bottom:16px}
h1{
  font-family:var(--mincho); font-size:20px; font-weight:600;
  letter-spacing:.18em; margin:20px 0 4px;
}
.sub{font-size:12px;color:var(--sumi-thin);margin:0 0 16px;letter-spacing:.06em}

/* ---- セクションタブ ---- */
nav.tabs{
  display:flex; gap:4px; overflow-x:auto; padding:10px 0;
  -webkit-overflow-scrolling:touch; scrollbar-width:thin;
}
nav.tabs button{
  flex:0 0 auto; font-family:var(--gothic); font-size:13px;
  padding:7px 12px; border:1px solid var(--rule); border-radius:2px;
  background:transparent; color:var(--sumi-thin); cursor:pointer;
  white-space:nowrap; line-height:1.4;
}
nav.tabs button[aria-selected="true"]{
  background:var(--sumi); color:var(--paper); border-color:var(--sumi);
}
nav.tabs button .tabid{font-family:var(--mincho);font-weight:600;margin-inline-end:5px}

/* ---- 進捗 ---- */
.progress{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
.bar{flex:1;height:6px;background:var(--paper-deep);border:1px solid var(--rule);border-radius:0}
.bar>span{display:block;height:100%;background:var(--kincha);width:0}
.progress .count{
  font-size:12px;color:var(--sumi-thin);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* ---- 問題カード ---- */
.card{
  background:#F4F7F3; border:1px solid var(--rule);
  border-top:3px solid var(--sumi); padding:18px 16px 20px;
}
.meta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:12px;color:var(--sumi-thin);margin-bottom:12px;
}
.qno{font-family:var(--mincho);font-size:15px;color:var(--sumi);letter-spacing:.08em}
.badge{
  border:1px solid var(--rule);padding:1px 7px;font-size:11px;
  letter-spacing:.08em;background:var(--paper);
}
.badge.calc{border-color:var(--kincha);color:var(--kincha)}
.q{font-size:16px;line-height:1.95;white-space:pre-wrap;margin:0 0 16px}

/* ---- 資料表 ---- */
.table-wrap{overflow-x:auto;margin:0 0 16px;border:1px solid var(--rule);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
caption{
  font-family:var(--mincho);font-size:13px;text-align:start;
  padding:8px 10px;border-bottom:1px solid var(--rule);letter-spacing:.08em;
}
th,td{border:1px solid var(--rule);padding:6px 9px;text-align:start}
thead th{background:var(--paper-deep);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- 入力 ---- */
textarea{
  width:100%;min-height:150px;padding:11px;font-family:var(--gothic);font-size:15px;
  line-height:1.9;color:var(--sumi);background:var(--paper);
  border:1px solid var(--rule);border-radius:0;resize:vertical;
}
.calcrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type="text"].num{
  flex:1 1 180px;min-width:0;padding:10px 12px;font-size:17px;
  font-variant-numeric:tabular-nums;text-align:end;
  color:var(--sumi);background:var(--paper);border:1px solid var(--rule);border-radius:0;
}
.unit{font-size:14px;color:var(--sumi-thin);font-family:var(--mincho)}
button.act{
  font-family:var(--mincho);font-size:14px;letter-spacing:.12em;
  padding:10px 18px;border:1px solid var(--sumi);background:var(--sumi);
  color:var(--paper);cursor:pointer;border-radius:0;
}
button.act:hover{background:#26382E}
.hint{font-size:12px;color:var(--sumi-thin);margin:8px 0 0}

/* ---- 判定結果 ---- */
.result{margin-top:18px;padding-top:16px;border-top:1px dashed var(--rule)}
.verdict{font-family:var(--mincho);font-size:17px;letter-spacing:.1em;margin:0 0 12px}
.verdict.ok{color:var(--kincha)}
.verdict.ng{color:var(--shu)}
.answerbox{
  background:var(--paper);border:1px solid var(--rule);padding:12px 14px;margin:0 0 14px;
}
.answerbox .label{font-size:11px;color:var(--sumi-thin);letter-spacing:.1em;display:block}
.answerbox .val{font-size:22px;font-variant-numeric:tabular-nums;font-weight:600}
.work{white-space:pre-wrap;font-size:13.5px;line-height:1.95;margin:0}

/* ---- 採点要素 ---- */
ul.elements{list-style:none;margin:0 0 14px;padding:0}
ul.elements li{
  border:1px solid var(--rule);border-inline-start:4px solid var(--rule);
  background:var(--paper);margin-bottom:7px;
}
ul.elements li.core{border-inline-start-color:var(--shu)}
ul.elements label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;cursor:pointer}
ul.elements input[type="checkbox"]{margin:5px 0 0;flex:0 0 auto;width:17px;height:17px;accent-color:#5A6B62}
ul.elements .etext{font-size:14.5px;line-height:1.8}
ul.elements .tag{
  font-size:10px;letter-spacing:.1em;border:1px solid currentColor;
  padding:0 5px;margin-inline-end:7px;vertical-align:2px;white-space:nowrap;
}
ul.elements li.core .tag{color:var(--shu)}
ul.elements li:not(.core) .tag{color:var(--sumi-thin)}
.line-note{
  font-family:var(--mincho);font-size:14px;letter-spacing:.08em;
  padding:9px 12px;border:1px solid var(--kincha);color:var(--kincha);margin:0 0 14px;
}
.line-note.short{border-color:var(--rule);color:var(--sumi-thin)}

/* ---- 注意・出典 ---- */
.caution{
  border:2px solid var(--shu);padding:10px 13px;margin:0 0 14px;
  font-size:13.5px;line-height:1.85;background:var(--paper);
}
.caution b{font-family:var(--mincho);color:var(--shu);letter-spacing:.1em;display:block;font-size:12px;margin-bottom:3px}
.source{font-size:12.5px;color:var(--sumi-thin);line-height:1.85;border-top:1px solid var(--rule);padding-top:10px}
.source .doc{font-family:var(--mincho);color:var(--sumi);font-size:13.5px;letter-spacing:.06em}
.source a{color:var(--kincha)}
.source .nolink{color:var(--sumi-thin)}

/* ---- ナビ ---- */
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.nav button{
  font-family:var(--mincho);font-size:14px;letter-spacing:.1em;padding:10px 16px;
  border:1px solid var(--rule);background:var(--paper);color:var(--sumi);cursor:pointer;border-radius:0;
}
.nav button:hover{background:var(--paper-deep)}
footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--sumi-thin);line-height:1.9}

/* ---- a11y ---- */
:focus-visible{outline:2px solid var(--kincha);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
.bar>span{transition:width .25s ease}
@media (prefers-reduced-motion: reduce){.bar>span{transition:none}}
@media (max-width:400px){
  body{font-size:15px}
  .wrap{padding:0 11px 56px}
  .card{padding:15px 12px 17px}
  h1{font-size:17px;letter-spacing:.12em}
  .q{font-size:15px}
  .answerbox .val{font-size:19px}
  button.act{padding:10px 14px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>会計理論ドリル</h1>
  <p class="sub">名城大学 経営学部「簿記・会計特別入学試験」対策 ／ 記述33問・計算28問</p>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="セクション"></nav>

<div class="progress">
  <div class="bar"><span id="barfill"></span></div>
  <span class="count" id="barcount"></span>
</div>

<main id="card" class="card" tabindex="-1"></main>

<div class="nav">
  <button type="button" id="prev">← 前へ</button>
  <button type="button" id="next">次へ →</button>
</div>

<footer id="foot"></footer>
</div>
<script>
"use strict";

/* 原価計算基準 全文ページ（SPEC §2-1 で確認済みとされる URL）。
   本セッションの実行環境は外向き通信が遮断されており、到達確認はできていない。 */
var CAB = "https://www.asb-j.jp/jp/accounting_standards_system/details.html?topics_id=156";
function cab(article, anchor){
  return { doc:"原価計算基準", article:article, issuer:"企業会計審議会", url:CAB + "#" + anchor };
}
/* URL を解決できなかった出典（SPEC §2-2 の指示により条番号のみ表示する） */
function nolink(doc, article, issuer){
  return { doc:doc, article:article, issuer:issuer, url:null };
}

/* ---------- 資料表 ---------- */
var TABLES = {
  INVENTORY: {
    caption: "資料　A商品の当月受払（月初棚卸 100個 @200円）",
    head: ["日付", "摘要", "数量", "単価", "金額"],
    align: ["", "", "num", "num", "num"],
    rows: [
      ["月初", "繰越", "100 個", "200 円", "20,000 円"],
      ["5日", "仕入", "300 個", "220 円", "66,000 円"],
      ["10日", "売上", "250 個", "—", "—"],
      ["20日", "仕入", "200 個", "250 円", "50,000 円"],
      ["25日", "売上", "150 個", "—", "—"]
    ],
    note: "期末の帳簿棚卸数量 200個。実地棚卸数量 190個。期末の正味売却価額 @230円。"
  },
  ALLOC: {
    caption: "資料　当月の製造データ（2026年度 過去問）",
    head: ["項目", "製品X", "製品Y"],
    align: ["", "num", "num"],
    rows: [
      ["直接材料費", "2,000,000 円", "1,000,000 円"],
      ["直接労務費", "600,000 円", "1,800,000 円"],
      ["直接経費", "300,000 円", "450,000 円"],
      ["機械加工時間", "5,000 時間", "7,500 時間"],
      ["製造量", "1,000 個", "1,000 個"],
      ["販売単価", "800 円", "3,200 円"]
    ],
    note: "製造間接費 実際発生額 6,000,000円。月初・月末仕掛品はない。円未満は四捨五入。"
  },
  STDCOST: {
    caption: "資料　製品Zの標準原価カードと当月実績",
    head: ["項目", "標準", "実際"],
    align: ["", "num", "num"],
    rows: [
      ["直接材料費", "@400円 × 3kg", "2,800kg × @410円"],
      ["直接労務費", "@1,000円 × 2時間", "1,850時間 × @1,020円"],
      ["製造間接費", "@1,500円 × 2時間", "2,760,000円（実際1,850時間）"],
      ["　うち変動費率", "@600円", "—"],
      ["　うち固定費率", "@900円", "—"]
    ],
    note: "月間基準操業度 2,000時間。固定製造間接費予算 1,800,000円。当月実際生産量 900個（月初・月末仕掛品なし）。製造間接費は変動予算・三分法による。"
  }
};

/* ---------- 問題データ ---------- */
var DATA = [

/* ============ A 減価償却 ============ */
{ id:"a-w01", section:"A", type:"write",
  q:"減価償却を行う目的を説明しなさい。",
  elements:[
    {text:"費用配分の原則に基づき、有形固定資産の取得原価を耐用期間の各期間に配分する手続である", core:true},
    {text:"目的は適正な期間損益計算にある。期末資産の時価評価を目的とするものではない", core:true},
    {text:"毎期、継続して規則的に行わなければならない（正規の減価償却）", core:true},
    {text:"償却額を恣意的に増減させると利益操作になるため許されない", core:false}
  ],
  source:nolink("企業会計原則注解","【注20】","企業会計審議会"), caution:null },

{ id:"a-w02", section:"A", type:"write",
  q:"減価償却の主な計算方法を4つあげ、それぞれの計算構造を説明しなさい。",
  elements:[
    {text:"定額法：取得原価から残存価額を控除した額を、耐用年数にわたり均等に配分する", core:true},
    {text:"定率法：期首の未償却残高に一定の償却率を乗じる。償却額は初期に大きく、以後逓減する", core:true},
    {text:"生産高比例法：当期の利用度（生産量・走行距離など）に比例して配分する", core:true},
    {text:"級数法：耐用年数の級数を配分基礎とし、償却額が逓減するように配分する", core:false},
    {text:"定率法と級数法はいずれも加速度償却（早期に多く償却する方法）である", core:false}
  ],
  source:nolink("企業会計原則注解","【注20】／連続意見書第三","企業会計審議会"), caution:null },

{ id:"a-w03", section:"A", type:"write",
  q:"生産高比例法はどのような資産に適用できるか。その要件を述べなさい。",
  elements:[
    {text:"総利用可能量（総生産量・総走行距離など）を物理的に見積ることができる資産であること", core:true},
    {text:"減価が主として利用の程度に比例して発生する資産であること", core:true},
    {text:"鉱業用設備、航空機、自動車などが該当する", core:false},
    {text:"時の経過による減価が主因となる建物などには適さない", core:false}
  ],
  source:nolink("連続意見書 第三","有形固定資産の減価償却について","企業会計審議会"), caution:null },

{ id:"a-w04", section:"A", type:"write",
  q:"固定資産の減価が生じる原因を分類して説明しなさい。",
  elements:[
    {text:"物質的減価：使用による磨滅損耗と、時の経過による自然的な老朽化", core:true},
    {text:"機能的減価：陳腐化（技術進歩による相対的な能力低下）と不適応化（経営環境の変化への不適合）", core:true},
    {text:"耐用年数は物質的減価と機能的減価の両方を考慮して見積る", core:false}
  ],
  source:nolink("連続意見書 第三","有形固定資産の減価償却について","企業会計審議会"), caution:null },

{ id:"a-w05", section:"A", type:"write",
  q:"減価償却の記帳方法である直接法と間接法の違いを、貸借対照表の表示とあわせて説明しなさい。",
  elements:[
    {text:"直接法：償却額を固定資産勘定から直接減額する。帳簿価額のみが示される", core:true},
    {text:"間接法：減価償却累計額勘定に集計し、固定資産は取得原価のまま据え置く", core:true},
    {text:"間接法では、貸借対照表上、取得原価から減価償却累計額を控除する形式で表示する", core:true},
    {text:"間接法のほうが取得原価と償却の進行度が読み取れる点で情報量が多い", core:false}
  ],
  source:nolink("企業会計原則 第三・四／同注解","貸借対照表の表示","企業会計審議会"), caution:null },

{ id:"a-w06", section:"A", type:"write",
  q:"減価償却の自己金融効果（固定資産の流動化）について説明しなさい。",
  elements:[
    {text:"減価償却費は当期の費用となるが、当期の現金支出を伴わない費用である", core:true},
    {text:"その分だけ、収益によって得た資金が社外に流出せず企業内に留保される", core:true},
    {text:"固定資産に投下された資金が、貨幣性資産の形で回収されることになる", core:false},
    {text:"自己金融は減価償却の目的ではなく、結果として生じる副次的効果である", core:false}
  ],
  source:nolink("連続意見書 第三","有形固定資産の減価償却について","企業会計審議会"), caution:null },

{ id:"a-w07", section:"A", type:"write",
  q:"固定資産に対する支出を資本的支出と収益的支出に区分する意味を説明しなさい。",
  elements:[
    {text:"資本的支出：耐用年数の延長や価値の増加をもたらす支出。固定資産の取得原価に加算する", core:true},
    {text:"収益的支出：現状を維持するための支出。当期の修繕費として費用処理する", core:true},
    {text:"区分を誤ると、当期の費用と資産の金額がともに誤り、期間損益計算が歪む", core:true},
    {text:"資本的支出とした場合、その後の耐用年数にわたり減価償却を通じて費用化される", core:false}
  ],
  source:nolink("連続意見書 第三","有形固定資産の減価償却について","企業会計審議会"), caution:null },

{ id:"a-w08", section:"A", type:"write",
  q:"減価償却における残存価額とは何か。その性格を説明しなさい。",
  elements:[
    {text:"耐用年数が到来した時点で回収が見込まれる処分価額の見積額である", core:true},
    {text:"定額法・生産高比例法では、取得原価から控除して要償却額を算定する", core:true},
    {text:"見積りである以上、事後の実績と一致するとは限らない", core:false},
    {text:"実務では備忘価額1円まで償却する扱いが広く行われている", core:false}
  ],
  source:nolink("連続意見書 第三","有形固定資産の減価償却について","企業会計審議会"),
  caution:"備忘価額1円まで償却する扱いは法人税法上の規定に由来する実務慣行である。会計上の残存価額は「処分見込額の見積り」であり、両者を同一のものとして書かない。" },

{ id:"a-c01", section:"A", type:"calc",
  q:"取得原価3,000,000円、残存価額0円、耐用年数8年の備品を定額法で償却する。\n1年分の減価償却費はいくらか。（円）",
  answer:375000,
  work:"(3,000,000 − 0) ÷ 8年 = 375,000円",
  source:nolink("企業会計原則注解","【注20】","企業会計審議会"), caution:null },

{ id:"a-c02", section:"A", type:"calc",
  q:"取得原価2,400,000円、残存価額0円、耐用年数10年の機械を11月1日に取得し、ただちに使用を開始した。決算日は3月31日である。定額法により月割計算する場合、当期の減価償却費はいくらか。（円）",
  answer:100000,
  work:"年間償却費 2,400,000 ÷ 10年 = 240,000円\n使用期間 11月1日〜3月31日 = 5か月\n240,000 × 5/12 = 100,000円",
  source:nolink("企業会計原則注解","【注20】","企業会計審議会"), caution:null },

{ id:"a-c03", section:"A", type:"calc",
  q:"取得原価1,000,000円の備品を定率法（償却率0.250）で償却する。\n1年目の減価償却費はいくらか。（円）",
  answer:250000,
  work:"1,000,000 × 0.250 = 250,000円",
  source:nolink("企業会計原則注解","【注20】","企業会計審議会"), caution:null },

{ id:"a-c04", section:"A", type:"calc",
  q:"前問と同じ備品について、2年目の減価償却費はいくらか。（円）",

  work:"実際作業時間における予算許容額\n= 変動費率 @600円 × 1,850時間 + 固定費予算 1,800,000円\n= 1,110,000 + 1,800,000 = 2,910,000円\n予算差異 = 2,910,000 − 実際発生額 2,760,000 = +150,000円（有利差異）\n\n〔検算〕標準配賦額 1,800時間 × @1,500円 = 2,700,000円\n総差異 2,700,000 − 2,760,000 = △60,000円\n　予算差異　　+150,000円（有利）\n　能率差異　（1,800 − 1,850）× @1,500 = △75,000円（不利）\n　操業度差異（1,850 − 2,000）× @900 = △135,000円（不利）\n　合計 △60,000円　→　総差異と一致",
  source:cab("四六（標準原価計算制度における原価差異）","heading-id-406"), caution:null }

];

/* ---------- セクション定義 ---------- */
var SECTIONS = [
  { id:"A", name:"減価償却" },
  { id:"B", name:"棚卸資産" },
  { id:"C", name:"引当金・経過勘定" },
  { id:"D", name:"有価証券・一般原則" },
  { id:"E", name:"原価計算の基礎概念" },
  { id:"F", name:"費目別・配賦計算" },
  { id:"G", name:"予定配賦・差異分析" }
];

/* ---------- 状態（メモリ上のみ。localStorage は使わない） ---------- */
var state = {};
DATA.forEach(function(q){
  state[q.id] = { input:"", revealed:false, checks:(q.elements||[]).map(function(){ return false; }) };
});
var current = { section:"A", index:0 };

function qsOf(sec){ return DATA.filter(function(q){ return q.section === sec; }); }

/* ---------- 数値の正規化 ---------- */
function normalizeNumber(raw){
  if (raw == null) return "";
  var s = String(raw);
  // 全角英数字 → 半角
  s = s.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  // 各種マイナス記号 → 半角ハイフン
  s = s.replace(/[－−ー‐―-]/g, "-");
  // 全角ピリオド → 半角
  s = s.replace(/[．。]/g, ".");
  // 桁区切り・空白・単位を除去
  s = s.replace(/[,，]/g, "");
  s = s.replace(/[\s　]/g, "");
  s = s.replace(/[円個時間kgKg％%\/／]/g, "");
  return s;
}
function parseAnswer(raw){
  var s = normalizeNumber(raw);
  if (s === "" || s === "-") return null;
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  var n = Number(s);
  if (!isFinite(n)) return null;
  return n;
}
function fmt(n){
  var neg = n < 0, a = Math.abs(n);
  var i = Math.floor(a), f = a - i;
  var s = String(i).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  if (f > 0) s += String(Math.round(f * 1e6) / 1e6).slice(1);
  return (neg ? "-" : "") + s;
}

/* ---------- DOM ヘルパ ---------- */
function el(tag, attrs, children){
  var n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}

/* ---------- タブ ---------- */
function renderTabs(){
  var tabs = document.getElementById("tabs");
  tabs.textContent = "";
  SECTIONS.forEach(function(s){
    var n = qsOf(s.id).length;
    var b = el("button", {
      type:"button", role:"tab",
      "aria-selected": String(s.id === current.section),
      "aria-label": s.id + " " + s.name + " 全" + n + "問"
    });
    b.appendChild(el("span", { class:"tabid", text:s.id }));
    b.appendChild(document.createTextNode(s.name));
    b.addEventListener("click", function(){
      current.section = s.id; current.index = 0; render();
    });
    tabs.appendChild(b);
  });
}

/* ---------- 進捗 ---------- */
function renderProgress(){
  var list = qsOf(current.section);
  var done = list.filter(function(q){ return state[q.id].revealed; }).length;
  document.getElementById("barfill").style.width =
    (list.length ? (done / list.length * 100) : 0) + "%";
  document.getElementById("barcount").textContent =
    "解答済 " + done + " / " + list.length;
}

/* ---------- 資料表 ---------- */
function renderTable(key){
  var t = TABLES[key];
  if (!t) return null;
  var table = el("table");
  table.appendChild(el("caption", { text:t.caption }));
  var thead = el("thead"), tr = el("tr");
  t.head.forEach(function(h, i){
    tr.appendChild(el("th", { scope:"col", class:(t.align[i] || "") }, [document.createTextNode(h)]));
  });
  thead.appendChild(tr); table.appendChild(thead);
  var tbody = el("tbody");
  t.rows.forEach(function(r){
    var row = el("tr");
    r.forEach(function(c, i){
      row.appendChild(el(i === 0 ? "th" : "td",
        { class:(t.align[i] || ""), scope:(i === 0 ? "row" : "") },
        [document.createTextNode(c)]));
    });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  var wrap = el("div", { class:"table-wrap" }, [table]);
  var box = el("div", {}, [wrap]);
  if (t.note) box.appendChild(el("p", { class:"hint", text:t.note }));
  return box;
}

/* ---------- 出典 ---------- */
function renderSource(src){
  var box = el("div", { class:"source" });
  box.appendChild(el("span", { class:"doc", text:"出典　" + src.doc + "　" + src.article }));
  box.appendChild(el("br"));
  box.appendChild(document.createTextNode(src.issuer));
  box.appendChild(el("br"));
  if (src.url){
    var a = el("a", { href:src.url, target:"_blank", rel:"noopener", text:"公式ページで条文を確認する" });
    box.appendChild(a);
  } else {
    box.appendChild(el("span", { class:"nolink",
      text:"※このアプリからリンクできる公開ページを確認できていないため、URLは掲載していない。手元の会計法規集で条番号を引いて確認すること。" }));
  }
  return box;
}

/* ---------- 注意 ---------- */
function renderCaution(text){
  var box = el("div", { class:"caution" });
  box.appendChild(el("b", { text:"答案での注意" }));
  box.appendChild(document.createTextNode(text));
  return box;
}

/* ---------- 記述問題 ---------- */
function renderWrite(q, card){
  var st = state[q.id];
  var ta = el("textarea", {
    id:"ta-" + q.id, "aria-label":"答案の記入欄",
    placeholder:"ここに自分の言葉で書く。書き終えてから照合する。"
  });
  ta.value = st.input;
  ta.addEventListener("input", function(){ st.input = ta.value; });
  card.appendChild(ta);

  if (!st.revealed){
    var btn = el("button", { type:"button", class:"act", text:"模範要素と照合する" });
    btn.addEventListener("click", function(){ st.revealed = true; render(); });
    card.appendChild(el("p", { class:"hint",
      text:"※ボタンを押すまで答えは表示されない。まず書ききること。" }));
    card.appendChild(btn);
    return;
  }

  var res = el("div", { class:"result" });
  var core = q.elements.filter(function(e){ return e.core; }).length;
  var coreDone = q.elements.filter(function(e, i){ return e.core && st.checks[i]; }).length;

  res.appendChild(el("p", { class:"verdict",
    text:"自分の答案と照合し、書けていた要素にチェックを入れる。" }));

  var ul = el("ul", { class:"elements" });
  q.elements.forEach(function(e, i){
    var li = el("li", { class:(e.core ? "core" : "") });
    var label = el("label");
    var cb = el("input", { type:"checkbox" });
    cb.checked = st.checks[i];
    cb.addEventListener("change", function(){ st.checks[i] = cb.checked; render(); });
    var span = el("span", { class:"etext" });
    span.appendChild(el("span", { class:"tag", text:(e.core ? "必須" : "加点") }));
    span.appendChild(document.createTextNode(e.text));
    label.appendChild(cb); label.appendChild(span);
    li.appendChild(label); ul.appendChild(li);
  });
  res.appendChild(ul);

  var note = el("p", { class:"line-note" + (coreDone === core ? "" : " short") });
  note.textContent = (coreDone === core)
    ? "合格ライン到達　必須要素 " + core + " 件をすべて満たしている。"
    : "必須要素 " + coreDone + " / " + core + " 件　（あと " + (core - coreDone) + " 件で合格ライン）";
  res.appendChild(note);

  if (q.caution) res.appendChild(renderCaution(q.caution));
  res.appendChild(renderSource(q.source));
  card.appendChild(res);
}

/* ---------- 計算問題 ---------- */
function renderCalc(q, card){
  var st = state[q.id];
  var row = el("div", { class:"calcrow" });
  var input = el("input", {
    type:"text", class:"num", inputmode:"numeric", autocomplete:"off",
    id:"in-" + q.id, "aria-label":"解答（数値）"
  });
  input.value = st.input;
  var btn = el("button", { type:"button", class:"act", text:"判定する" });

  function judge(){
    st.input = input.value;
    st.revealed = true;
    render();
  }
  input.addEventListener("input", function(){ st.input = input.value; });
  input.addEventListener("keydown", function(ev){
    if (ev.key === "Enter"){ ev.preventDefault(); judge(); }
  });
  btn.addEventListener("click", judge);

  row.appendChild(input);
  row.appendChild(el("span", { class:"unit", text:(q.unit || "円") }));
  row.appendChild(btn);
  card.appendChild(row);
  card.appendChild(el("p", { class:"hint",
    text:"全角数字・桁区切りのカンマを入れてもよい。Enter キーでも判定できる。" }));

  if (!st.revealed) return;

  var val = parseAnswer(st.input);
  var res = el("div", { class:"result" });
  var v = el("p", { class:"verdict" });
  if (val === null){
    v.className = "verdict ng";
    v.textContent = "数値として読み取れない　—　数字で入力すること";
  } else if (Math.abs(val - q.answer) < 1e-9){
    v.className = "verdict ok";
    v.textContent = "正　解";
  } else {
    v.className = "verdict ng";
    v.textContent = "誤　答　（解答 " + fmt(val) + "）";
  }
  res.appendChild(v);

  var ab = el("div", { class:"answerbox" });
  ab.appendChild(el("span", { class:"label", text:"正解" }));
  ab.appendChild(el("span", { class:"val", text:fmt(q.answer) }));
  res.appendChild(ab);

  res.appendChild(el("p", { class:"work", text:q.work }));
  if (q.caution) res.appendChild(renderCaution(q.caution));
  res.appendChild(renderSource(q.source));
  card.appendChild(res);
}

/* ---------- 描画 ---------- */
function render(){
  renderTabs();
  renderProgress();
  var list = qsOf(current.section);
  if (current.index >= list.length) current.index = 0;
  var q = list[current.index];
  var sec = SECTIONS.filter(function(s){ return s.id === current.section; })[0];

  var card = document.getElementById("card");
  card.textContent = "";

  var meta = el("div", { class:"meta" });
  meta.appendChild(el("span", { class:"qno",
    text:sec.id + " − " + (current.index + 1) + " ／ " + list.length }));
  meta.appendChild(el("span", { class:"badge" + (q.type === "calc" ? " calc" : ""),
    text:(q.type === "calc" ? "計算" : "記述") }));
  meta.appendChild(el("span", { text:sec.name }));
  card.appendChild(meta);

  card.appendChild(el("p", { class:"q", text:q.q }));
  if (q.table){ var t = renderTable(q.table); if (t) card.appendChild(t); }

  if (q.type === "write") renderWrite(q, card);
  else renderCalc(q, card);
}

/* ---------- ナビ ---------- */
function move(d){
  var list = qsOf(current.section);
  current.index = (current.index + d + list.length) % list.length;
  render();
  document.getElementById("card").focus();
}
document.getElementById("prev").addEventListener("click", function(){ move(-1); });
document.getElementById("next").addEventListener("click", function(){ move(1); });

/* ---------- フッタ ---------- */
(function(){
  var w = DATA.filter(function(q){ return q.type === "write"; }).length;
  var c = DATA.filter(function(q){ return q.type === "calc"; }).length;
  var f = document.getElementById("foot");
  f.appendChild(document.createTextNode(
    "収録　記述 " + w + "問／計算 " + c + "問　計 " + DATA.length + "問。"));
  f.appendChild(el("br"));
  f.appendChild(document.createTextNode(
    "設問文および採点要素は本アプリの作成者が独自に記述したものであり、会計基準等の条文本文は含まない。"));
  f.appendChild(el("br"));
  f.appendChild(document.createTextNode(
    "企業会計原則・同注解／連続意見書／原価計算基準は企業会計審議会、企業会計基準第9号・第10号は企業会計基準委員会（© 公益財団法人 財務会計基準機構）による。条文は各権利者の公表物を参照すること。"));
  f.appendChild(el("br"));
  f.appendChild(document.createTextNode(
    "解答の進捗はページを再読み込みすると失われる（保存機能は持たない）。"));
})();

render();
</script>
